body:
  text: 門人海鹽益證等編題讚題觀音菩薩出山像讚荊璧記室請滿頭鬚髮趺岩谷三十二應自不知欲識渠儂真面目鑊湯爐炭禮慈威擬居士身卻菩薩相側目旁觀悲心等向羅剎鬼國音聞浩宕禮者是誰荊璧供養題三大士同圖坐大松樹下像讚稽首三大老古錐默默無言鼓是非閒得翻經當底事長松下坐幾時歸白衣送子觀音像讚劉進柱居士請誰謂菩薩白衣說法童子參隨人天話杷偷盜四生悲運智拔嗣世無窮應緣即化趺坐何為鑽龜打瓦神鳥飛空嬰兒持花一枝丹桂大地生芽深心供養普利群沙以何為驗羅剎鬼國現其身是則名為觀自在題雲中坐吼觀音像宮妝謾猜作紫閣形容休認是雲中仙子善現惡相總由伊坐斷紅塵無彼此題觀音大士像讚有引辛丑中元日仲將包居士然臂香供大士相遂述讚兼贈道力進猛大士分身聞音加被一炷肉香誓求智慧力固心堅謝塵蠲穢獲命永康德令人畏因居士身發露懺悔信在其中菩薩面對允始允終福備慧備末振宗風芬芳流萃初祖石影像讚有引戊子春寓古雲門有僧云佛日遠門首座在少林見初祖影子現於石內有太守疑為假將石磨礪遂出血水影仍如舊時門印其圖形歸佛日衆以讚頌記之是僧亦欲余為讚云咄還知者個落處麼是伊謂震旦國裏有大乘根器在梁王殿上鼓陳惡風吹到少室峰前盡道你隻履西歸誰知影子落在山石裡千百年後賺得個不唧溜的漢儘力磨礱一上直饒磨得血淋淋底猶不見伊面目在何故一字入公門九牛拔不出十八羅漢圖像邰仲茝居士請讚雲山疊翠殿閣嵯峨清風明月影婆娑斷橋流水溪隔煙羅南嶽天台況若何依稀仙子倣佛風魔弄碁局平展干戈笑輸贏的袒腹消磨倒挾麈尾漫窺探那聚論徵科喜長眉持立正淆訛隊行蹊徑兮路坎坷顧盻紅葉兮佇山坡向前去又見個倚樹防蹉看伊怒目騎虎勒摩望山頂臂反腰阿擎珠浪牽龍戲波攜手橋上話殘指柯肩挑隻履非行腳竟不曉林裡杖過顏色聖凡人莫測畫工筆巧寫還多題關帝獨立像讚有周倉持刀倚背孤挺雄威驚吳懼魏時赴單刀名成宇貴豎目撚髯而胸襟略展周子倚身以智謀而直往義節千秋磨不盡德仁萬古鎮常新天童密雲悟師翁雲門雪嶠信大師合圖真讚生不同條死歸一氣探龍池收竿有據入禹門掉臂長行把住太白峰前海浪騰翻坐斷秦望山頂溪雲合彩吳越冷地生光南北宗風遍布施臨濟機心雄若虎罵佛祖舌語惡如雷咦扶不起捺不倒棒詈縱橫從此曉天童密老和尚像讚銅棺山頂曲不藏直禹門浪裏竭世樞機眼界寬若太虛心腸硬似剛鐵六坐道場一棒打徹四海聲震聞名膽裂不論佛魔都來等施棒棒見血又物等同觀靈機一握殺活縱橫親疏不錯特門庭之磊落兮峙山嶽起臨濟之宗風兮振木鐸纍及兒孫不了殃猶遺千古聲名惡鹿野法師索題扇頭羅漢畫有松枝上懸一葫蘆五百高流應供尊如何特地只單行家山欲去雲非遠野景遙看路亦平藜杖肩扶忘渴飲葫蘆松掛笑風生相逢不必多饒舌蚤已人間識姓名龍池和尚真讚師缺一門牙秀州今古張家兒古有雲門今有師跨灶追風事且奇五百一千居不同時一個折足不肯住一個齒缺偏多語一一分明舉似君雲門禹門合扇親不是木毬踞地獅子老虎咬殺大蟲一門兩家宗旨太白雷轟一喝傳龍池浪激三千里又一住禹門十六年拈條白棒起風顛有時攪徹蛟龍窟打得虛空連架旋又繼祖父爐韝煆湖海英才衒名聲宇宙施迅地風雷傾佛祖骨髓掃魔外胚胎慈悲翻轉面皮惡不管親疏棒劈開細瓦廠普濟院達如老宿像讚稽首達如大師幼入緇門久經叢席參玄叩士不辭戴月披霜杖歷孤峰慣便探竿影草佩寶鏡三昧如印印空傾義海玄珠入流流所歸諸弟子老婆心而為說法信士大夫等閒地不與談禪最初創華嚴精舍末後興普濟禪林一旦踏翻到岸船嘴盧都地絶攀仰珍重兒孫一瓣香世出世間真供養題大慈像侍祖堂燈火坐耘春圃嘯傲煙霞檇李桑梓禹門出家五十六歲割愛繁華一生事業破衲袈裟吟清風而弄月恣遊戲而趺跏侍祖燈兮不倦運大慈兮不奢且道是誰作伴侶識渠面目笑阿㖿題冰欲上人行樂孫三摩請脫白時教習玄儀成僧後禪寂律持行普賢之願廣教化之門為併爨之領袖作堂搆之津梁倏爾知非兮圖形不壞鐵面冰心兮欲乎自在手執如意事若何談空饒舌渾無礙題陳素人頭陀小像逢人在處說頭陀你這頭陀有幾何如意肘眠半曲膝看他不去逐情波素親切意若何邀得淵明醉放歌阿呵呵聽吟哦笑煞風流不較多題馮君玉真弟紋菴求君之生也不喜君之死也不悲觀君之氣象兮骨傲林泉君與人之誠兮風邁濁世不假祖禰彌光超然家成業立謝塵緣兮知非徵自性兮不忒聽葉落兮秋歸觀音容兮若在丹青之描兮供汝子孫文不加點兮吾何狼籍知君玉兮由人識君玉兮真存陸光甫善友為外母求題真讚像坐石頭上無陰陽地汝弗立偏向石床坐得宜若也轉凡成聖去本來男女一菩提題比丘尼不違七十行樂道出常情誰為伴侶不繫塵樊女中杰士趺坐披衣語何以似覷破春光人間非是云爾坐禪數珠輪指孰識伊宗默然離此七十年來說向渠蒲團獨坐春風裡題靈松首座為鹿野監寺四十寫秋林讀書圖峰頭數百藏秋木怪石千層長碧苔寥廓虛齊翻故紙蒼茫幽壑積餘材已知問道忘年事不惑從前論劫灰為愛林泉常載目山窗終日向雲開自讚宗極維那請你這個漢生平膽大遇善不凌逢惡不懦遭天童惡辣習氣橛頭橛腦授禹門本分鉗槌扶正扶倒若謂你是臨濟兒孫令人喜令人怕且道有甚長處唱楚歌說楚話鐵石心腸硬為人從來不打之乎者永濟知藏請一個無情面孔兩道掃帚粗眉好似三家村裡賣柴翁只少個扁挑斧子恁麼擔當正法眼藏忒煞滅宗滅教圖寫伊大不孝更有驚人手段惡擎頭戴角一齊捉任流此語到諸方讚之莫及毀之不錯拙安逸監院請巧乃拙之用拙乃巧之原所以大巧若拙大智若愚智愚不妨巧拙何礙人以智巧成業我以愚拙安身互鎔巧拙而不愚者拙安得之也已一夔法監院請踞海雲室截流逆浪建濟宗風雷喝雨棒橫按竹篦語默離謗親近者心明畏懼者膽喪汝特煞不順人情佛魔聞而影蕩似這等惡辣漢何必寫真供養咄佛事為禹門拙翁和尚舉龕云第一義中廓然無聖末後句子始到牢關正所謂把住則水泄不通放行則瓦礫生光恭惟我法兄拙翁和尚幼歷孤征到處撥火挑煙單丁獨立等閒不與人侔入太白室箭鋒相拄登磬山堂啐啄同時禹門院親炙印心中山寺分燈列焰打鳳羅龍了生前未了公案謙恭克己正末後難正風規大衆還會麼且道拙翁和尚入廛垂手一句又作麼生道不居方丈地毗盧頂上行遂以拄杖卓一卓云兄呼弟應當年事今日親臨弟送兄遂拽杖引龕先行復為封塔云閒拋楖栗上峰顛坐視雲霄日午天雙履捎空留一隻眼光爍破界三千羅圍屏障周天際曠蕩溪流縱百川山有春風花笑面塔無縫罅體安然遂云封為寶覺院尼千眼德法姪封龕云物相遷移固有今古法性流注本無去來實際理地一句了然佛事門中千機垂應所以法身無相等虛空而充滿法眼無瑕同皎月以絶垠千眼德姪達此理具此眼入三峰老人室中透徹玄要後於慧刃法兄處更為矢上加尖授個護身符子不向閨閣藏頭角特來寶覺露家聲六十餘年隨順世緣一期化畢拋卻總持袈裟鶻脫末山衫子且得寂光獨照觸目現前正當與麼時千眼道人密移一步看飛龍去也諸人還見麼鴛鴦繡出從君看不把金針度與人喝一喝云封復舉龕至吳門萬峰山入塔云靈光湛寂智海無涯廓傾邊表迥絶周遮以拄杖擊龕云千眼德道人正當孤明歷歷一默以來堪經四十餘日是諸弟子逆順追思悲慟不已正所謂刀不自割大家知痛是以集諸四衆涓茲良辰得為舉引就穸即此則惺惺寂寂寂寂惺惺到處毫端浮幢剎微塵獨步轉法輪與麼出沒尋常始終古今不異大衆還會麼此是千眼禪師生生受用不盡底且道因行掉臂一句又作麼生等閒移坐萬峰前看取化身千百億守元火師云守元無外不須守在處拈來便知有脫落娘生貼肉衫踢倒須彌藏北斗以火炬打圓相云若向者裡薦得雖有四大元無生死其或未能助汝通身一把火烈焰光中親獨露克塵火師云霜花遍地促林顏克路還家咫尺間假我丙丁送歸去克塵還知歸去路頭麼咄莫將蹤跡落塵寰為蔣氏超象殮棺師以拄杖卓棺云超象還會麼葉落秋歸金風體露生死本無際岸回光觸目菩提遂擊棺云超象若也領略便爾具丈夫相剔起眉毛仔細看優遊直入蓮花界為古井菴湛然禪碩洎徒冰如同掩龕即京蟄前一日師徒同寂湛云吾欲先去尚含笑冰已去師云京蟄前正月後整頓芒鞋歸覺路百花業裡便抽身古井菴前空回首一聲笑破死生關鳥語清風閒白晝湛然老宿得恁麼勦絶六十八年世緣了畢師徒同行冰凝湛寂然雖如是介上座早已覷破了也復卓拄杖云杲日輝空萬里不掛片雲孤峰鎖翠一靈真常獨露所以大丈夫漢當仁不讓於師掉臂先行師不如汝一聲長嘯汝不及師遂以拄杖點云一二三四五六七父子上山各自努力喝一喝云淨法界中任去來春風浩蕩拂天際遂云封化林禪士火云化林師個中消息汝自知若不知更送臨行火一把也須照顧兩莖眉自明禪士封龕云香煙起處坐脫立亡呈好手空裏搖鈴入廛垂手展家風卓拄杖云廓落縱橫百雜碎遂起龕云春風拂面緑柳籠煙鳥語尖新遊子林間增意氣野馬騰空當人屋裡見青山且道作麼生是臨行一句曳杖云去火云龍樓翠鎖玉殿雲封以火炬打圓相云金佛不度爐真佛火裡坐烈焰中翻身自明師看破且道看破個什麼攛炬云燒紋菴火師執炬云七十年前與麼來處處緑楊堪繫馬七十年後與麼去家家有路透長安居士于七月草五日瞑目以來今又臘月草四日也還見有寒暑去來之相麼還知有生死痛苦之身麼如不知有生死痛苦之身亦不見有寒暑去來之相即爾自性圓明見常無我故云靈光獨耀迥脫根塵遂攛下火炬默如碾頭火師云朔風凜凜逼人寒駐碾停牛便放參頃刻翻身紅焰裏是誰脫卻死生衫咄默如雷語如風更為叮嚀此一宗雙融大德起龕師云六十餘年居市廛剎那撒手知歸去根塵迥脫絶遮攔本有風光隨住處雙禪者還會麼萬象之中獨露身聲前聲後俱坐斷卓拄杖云去又火云十二月風凜烈寒香撲鼻正時節禪人歸去絶行蹤萬別千差從此徹雙融大德還知落處麼古者道生也不道死也不道今汝知生已生也知死已死也且道不落死生一句又作麼生道大地都盧一個身不須更覓無生國復以火炬打圓相云火際風輪駕鐵牛撞倒崑崙顛倒走覺雲禪人火師云春風帶雨覺雲寒赤腳腰包入市廛參學一生事已畢草鞋脫卻水雲邊覺雲禪者還會麼其或未然更與通身重煆煉靈光觸處徹根源正修火師云地水火風成四大渠無生死是阿誰咄哉直下承當去心佛即非兩莫疑正修正修汝自知烈焰燒空乘獨步月池大德入塔師云風生涼暑蒸熱日月翻身虛空釘橛月池大德還知落處麼遂彈指云彈指頃開寶塔今朝五月草八絶去來兮脫死生安然坐鎮黃金國道真禪者入塔師云道真禪者還會麼祖師關末後句覿體分明本無來去皮膚脫落盡安居莫教動著中心樹若還願力誓弘深再來此土恣遊戲靈泛禪人入塔云靈泛靈泛爾自知莫向途中生退席從今透脫死生關坐斷千峰第一級為徐氏母子火師執炬云母子不同生亦不同條死生死各不知愛別於此止所以母為子啄子隨母啐啐啄同時應緣不錯徐氏屺瞻母子還知自己安身立命處麼從今豁卻臭皮囊一火化身千百億遂攛下炬云燒又為沈氏火云生不緣死不去生死關頭誰把住沈氏沈氏汝自知烈焰光中親薦取擲炬云去為萃閒老律主舉龕云大通智勝佛十卻坐道場不離於此座恭惟萃閒律主踢倒涅槃山超出生死岸一坐六移寒暑亦不離於此座以大地安居作蒲團平等性智恆常轉將百二十斤擔子一旦放下了也恁麼還知獨脫歸元一句麼卓拄杖云撩得薰風香滿面劈開荊棘路通霄遂云起又火云火熱炎燒六月天寥空萬里絶雲煙碧光直透須彌頂赤腳金剛開眼眠遂舉炬云大衆還會麼此日此時正是萃閒律師行腳之日敢要大衆證明古云趙州八十遊行腳只為心頭未悄然萃老師還知悄然一句麼如或未然不免重說偈言秪憑這把無生火焚卻全身一箇龕欲識悄然獨脫句前三三與後三三七夕為達本禪士化龕云達己達人乃智士之所為知本知源亦衲僧之所歸達本禪友汝昔脫白於天童得度披緇可為智矣而我密雲師翁應世七十七年化緣畢於七月七日汝今追蹈先人之跡可謂知本歸源矣山僧與汝識面三十餘年汝六十八歲一旦掉臂長行恁麼與汝據款結案了也且不落死生一句又作麼生秋風葉落雲生巧烈焰光騰達本源中元日為月輪比丘尼封龕師云秋月明秋輪滿靈光皎潔蟾宮誕秋聲砧杵催寒織體露金風落葉緩寒暑不遷義了然去來生死奚拘管道人行徑絶遮攔任意優遊平坦坦驀豎拂子云月輪比丘尼汝若直下領略便爾脫體無依其或未然不免為汝重說偈言謝卻凡流入聖流百千三昧一毛頭暫將殼子為龕舍幻質匪堅斷莫留遂以拂子指龕云封
