臨筵豈可囊藏被蓋亦不敢辜負先哲將一個印心訣子傾出當陽只要諸人共知共見一狀領過且道因齋慶讚一句又作麼生喝一喝云男兒自有沖天志豈向他人行處行羅漢長老結椎云諦觀法王法法王法如是便下座衆居士設齋請上堂師云明得諸佛義便識祖師心會得祖師心便知諸佛義祖師心諸佛義奪境奪人真信諦遂以拂子向空點𠁼云此是諸佛義將什麼喚作祖師心豈不見一擊竹翻聲色破拖來死尸百年期直饒恁麼的向一機一境上悄然獨露入佛入魔處觸目揚眉總是向外馳求亦未識祖師心在畢竟如何聻良久云萬緑叢中紅一點眼光爍遍甚分明卓拄杖下座立兩序執事上堂僧問昔日臨濟大師住滹沱建立黃檗宗旨和尚今日高登猊座建立阿誰宗旨師云無面目漢自爾領略進云秪如普化克符到來作麼生安置師打云也須喫棒進云棒頭迸出金獅子香象奔騰失卻威師云鐵香爐點頭進云禹門一脈傳千古濟宗從此又重新師云切莫妄通消息師乃云大光明藏香水海百億國土須彌山千丈盧舍那無量衆圍繞賓中主面面相對主中賓眼眼相看主賓互換和聲應響驅雷掣電向無陰陽地上發生裁長補短承叫不應山谷揚聲所以知音罕遇作者難逢智士通明眼辨石中美玉巧匠功能爐淘沙裏精金恁麼報國門下一齊按下了也且道同氣連聲一句又作麼生道隻手共扶宗正眼千金擔荷重如山便下座朱振寰居士設齋請上堂僧問吳門梵剎首稱報國隆興今蒙朱護法設齋鐘鼓齊鳴四衆沾恩事如何師云大衆臨筵進云青山常繞如來座休問白雲何處深師云香飄劫外春光普進云且喜斷虹垂碧落片雲雨過出青山師云緑陰擎傘蓋遍地惜黃鶯進云好鳥枝頭啼百語不呼同伴為誰鳴師云不得向聲色裏轉卻師乃云祖師妙意盡在百草頭流出諸佛心印總向微塵裏轉卻四十二年説不盡一大藏因邪打正末後拈花顯別傳賺得飲光特地倒卻剎竿續焰燈分竺土廓然無聖二三派列支那沒佛處急走過有佛處不得住明頭合暗頭合直得露柱懷胎燈籠喝彩所謂天上産麒麟人間生歡喜祇如胤子延孫一句又作麼生道卓拄杖云蠡斯羽化嗣芳遠福果臻培歷劫春下座嘉興府居士董耀庭尤思川姚公掄同衆請上堂僧問昔日龐居士云有男不婚有女不嫁大家團圞頭共説無生話既是無生且道説個甚麼師云意旨分明進云恁麼則悄然獨露渾無拒劫外春光喜自知師云滿堂誰是知音進云突開結角羅紋處攝入圓𠁼三點中師云且道是甚麼人會進云活計今拈得相逢讓主賓師打云也須喫棒乃云心不二致隨流得妙道無虛應即境歸元所以別傳教外之道至簡至要包括大千而真機獨露輥芥投針而妙體全彰智拔群有鏡圓覺海之澄萬象光騰洞明玄要之旨恁麼説事不得説理不得理事渾融亦不得諸聖到此亦開口不得報國堂前一點也瞞不得雖然如是且建化歸信一句又作麼生道良久云徹底為人三寸舌到頭終不兩般心喝一喝下座地藏聖誕升座僧問地藏垂慈開正眼今朝慶誕又重新如何是應時一句師云大地盡沾渠恩進云恁麼則燈燭輝煌明法界香煙馥郁滿虛空師云有眼者見有耳者聞進云聲聲佛號天然善個個心空及第歸師云你那裏見心空及第歸僧喝師云再喝喝看進云把手牽人行不得惟人自肯乃方親師云理之固然問擊鼓鳴鐘師登猊座四衆臨筵請師舉唱且道舉唱個什麼師云大衆共知進云如是則幽冥界內慈導主報國堂上獨稱尊師云蓋聲騎色進云恁麼則一朝天子令風行賀太平還許學人轉身也無師云試轉身看僧喝師云猶未轉身在進云人人盡有沖天志那個男兒不丈夫師云但願如是問昔日世尊降生一手指天一手指地云天上天下唯吾獨尊為甚麼雲門大師道吾當時若在一棒打殺與狗子喫今日忽遇雲門大師來和尚如何相待師云今日不是者個時節進云是甚麼時節師云是地藏開正眼的時節僧喝師便打進云恁麼到者裏東土二三齊稽首西天四七亦低頭師云何不早恁麼道居士問今朝地藏王誕日未出母胎時意旨如何師云異類藏身士云已出母胎時意旨如何師云一點也瞞他不得士云正生時求師通個消息師云汝還知凌居士腳跟點地麼士喝師云恰好不知士云禮拜和尚去也師云且喜沒交涉金漢翔問巧月三十地藏誕日開眼合眼則不問即今和尚為人一句作麼生道師云向上薦取士云若與麼則大地盡沾恩個個領惠去也師云汝又作麼生士云真個作家師打云也須知棒頭痛癢師乃顧左右云大衆還會麼山門外説話佛殿前拱手聽的聽見的見且道聽見個甚麼聻聽的道謂七月有三十日則地藏菩薩開眼且喜今朝地藏菩薩開眼了也諸仁者還見麼若見得地藏菩薩開眼處即見得自己開眼處見得自己開眼處即見得自己腳跟點地處見得自己腳跟點地處即與地藏菩薩共知共見則不辜負地藏菩薩今日開眼如若未然終日忙碌碌到夜也只是個虛忙終日眼睜睜見底也只如個妄見秪如報國寺裏伐鼓敲鐘鐘鳴無鼓響鼓聲無鐘音又作麼生委悉良久云好向此處究根源切莫隨他見顛倒不顛倒親見親聞明了了喝一喝下座結制李如侯居士設齋請上堂師云佛語心為宗宗通説亦通既謂宗通説通豈可承言滯句墮義沉筌所以四十九年三百餘會談極則笑破迦葉一張口面壁立雪分皮髓賺得神光三拜起恁麼喚作如來禪得喚作祖師禪得去此二途若現菩薩面向驢胎馬腹裏特露風規立金剛身入鑊湯爐炭中超然獨步直饒踏倒萬仞峰扶起破砂盆亦只喚得個隨類建化且與衲僧分中未為奇特報國堂前早以風行草偃更要揭露箇什麼諸仁者還有究竟本來者麼良久云好鳥啼聲春二月寒梅香發報君知喝一喝下座二月十九清明日因講期上堂僧問觀音大士八萬四千寶目請問和尚那一隻為正師云鐵香爐缺箇耳進云恁麼則前三三與後三三師云新柳抽條山眉如黛進云萬紫千紅堆裏過春風陳陳綻天香師云且向自己腳跟下道一句來僧便喝師云再喝喝看僧禮拜問曲應一時即不問單提向上請師宣師云點即不到僧喝師云到即不點進云學人只得禮拜去也師云腳跟下事又作麼生進云作者難謾師云青草堆頭聲轉悲乃云至理無言非言莫顯至道無難惟嫌揀擇所以處林放光久默斯要彌勒騰疑文殊發問故謂之一大事因緣出現於世百丈拈起禪板溈山踢倒淨瓶趙州洗鉢盂去雪峰輥毬靈雲見桃花玄沙躍破腳指頭恁麼謂之向上一著報國寺終日搖唇鼓舌説一説二權説實説因緣説譬喻説若謂之一大事因緣出現於世則埋沒三世諸佛一片心若謂之教外別傳則瞎卻先聖一隻眼如是則鳥語風聲悠揚自在可惜許路上行人總不知且喜目前慶快諸人還知目前慶快一句麼喝一喝云清明時節逢人不得錯舉上堂師云智不格物如杲日朗於太虛理融頓漸若洪鐘扣於靜夜所以光流影寂那有纖毫泥滯響應聲隨豈留音韻沉吟逃得聲色叢中過瞥地玲瓏透徹從上祖師關一場靜悄直得七花八裂報國更與矢上加尖仔細檢點將來亦是勞而無功然雖如是早已鈍置諸人了也喝一喝下座住吳江萬壽寺語録師於康熙八年在秀水如如庵受請於二月二十一日進院山門師云大誓門開鬧闌迥別人間十方婆伽惟斯路頭而入秪如無位真人面門出入又作麼生以柱杖劃一劃云鐵牛鞭起遊芳草踏遍春光露不關便入韋馱師云童真普眼祗園切不浪施應時及節正法賴以匡維三州神化作津濟隆興萬壽永無疆遂插香佛殿云大圓鏡智大人相恆沙國土一毫端不道哇聲來特地天上人間稱獨尊恁麼盡大千界內無處回避今日覿面相逢只得頂禮三拜據室云鐵面金剛到來六十烏藤翻身轉英俊衲子喫著三頓痛棒蒿枝拂恁麼銅頭俱點化隨波逐浪任施為便起當日合邑紳襟居士暨闔山大衆請上堂師接疏云霞箋布彩秀水騰聲錦字函開松陵得地談叢瓶瀉舌吐回瀾筆陳雲崩毫旋光耀欲冀遐音再煩宣出宣疏畢指法座云八萬四千獅子座遍界一音震吼百億須彌盧舍身咸同此日分燈拈柱杖卓一卓云撥轉如來正法輪丹霄獨步絶攀仰遂升座拈香云此一瓣香御之四海民新歸乎八荒日化仰惟聖德無私蘿圖永固又拈香云象分二儀品列三才伏惟文武百僚現任部撫按司都統副協郡邑侯宰城守戎鎮等位承願力輔國培邦助佛音酬唱恩澤又拈香云塵中作主物外橫身伏願合邑紳襟士友并及本寺請衆緇白分明智證無師又拈香云此一瓣香雨灑風吹不著水沒火焚不及今乃第五回拈出供養禹門堂上圓寂先師萬如老和尚用酬法乳斂衣就座上首白槌云法筵龍象衆當觀第一義僧問檀護臨筵懷不二水雲來往更添欣師登猊座將何調令師云春日增光進云秪如一曲句含千古意萬年新發一枝春又作麼生師云垂虹亭畔水流東進云頂笠月上千峰外誰釣江風一點紅師便打僧喝師云漫哮吼進云知音猶在師打云切莫虛張聲勢問不畜一粒米接待十方往來請問和尚既不畜一粒米將甚麼接待十方賢聖師云任汝飽參僧擬進語師云噎煞了也進云直得萬緣齊放下渴飲飢餐不須耕師云未得其便在進云將此身心奉塵剎是則名為報佛恩師云汝恩作麼生報僧喝師打僧禮退乃云佛以一音演説法四十九年不曾説著半個字腳達磨傳佛心印來至梁王殿上恰道個不識未免鈍置一番諸仁者還會麼此是迦文老子與達磨祖師打較不就的句子今日被萬壽覷破了也且道江城諸護法招山僧登斯座又如何話會良久云把手牽人行不得唯人自肯乃方親卓拄杖下座
