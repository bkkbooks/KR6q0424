body:
  text: 記録住吳江海雲寺語録師於順治十八年二月十九日在禾中萬松菴受請於四月十五日進院山門師云廣大法門不用起模畫樣且道隨方建化又作麼生當軒路徑通霄漢一任擎頭戴角來喝一喝便入伽藍師云擁護叢林在爾提持祖令由我將此深心奉塵剎衛法衛僧莫懈惰遂燒香韋馱師云支那國中賓中主海雲寺裏主中賓秪如賓主相見如何話會遂插香云此瓣香燒大家知佛殿師云巍振大千天魔外道拱手至尊三界歷代帝王曲膝今古不離空劫座世出世間咸瞻仰遂展拜據室云從上老古錐盡向這裏坐斷天下人舌頭且道新長老如何施設饒伊鐵額銅頭漢到此也須親煆煉便起當日衆護法請上堂持菴金居士同爾初和尚遞疏師接疏示衆云大衆會麼這個是勾無面目漢的信符具異口同宣的妙義恰好落在山僧手裏若為流通卻請第一座對衆拈出始見千里同風終歸異途一轍宣疏畢師指法座云此箇大寶法王之座天然突地迥絶周遮直饒須彌燈王亦不敢正眼覷著且道新海雲如何趨步喝一喝便升座拈香云此一瓣香拔出人表迥不同儔爇向爐中專為祝延當今皇帝聖躬萬歲次拈香云此一瓣香靈山親承囑付法筵賴以覿面伏惟滿朝文武並及現在宰官郡邑縉紳護法居士等衆歷劫不昧靈根現前均資慧力又拈香云此一瓣香初向南湖揚聲次於都門酬價此乃第三回拈出供養江南常州府宜興縣龍池山禹門堂上先師萬如老和尚用酬法乳之恩斂衣就座圓明和尚白槌云法筵龍象衆當觀第一義師云若是第一義山僧未離嘉秀圓明和尚蚤已一槌打就了也還有超關奪越者麼僧問月到海雲處風來滿院香如何是海雲境師云到江吳地盡隔岸越山多進云如何是境中人師云覿面薦取進云人境已蒙師指示如何是佛法的的意師打云向這裏會去進云不辭行腳苦隨處得風流師云看看時雨灑長空時升座漸有微雨師乃云一句了然千差截斷不落有無階級豈容擬議思惟所以建法幢立宗旨傳佛祖心印別教外離言詮廓人天正眼透聲色外橫身古路向百草頭卓立風規直饒見徹如斯若到衲僧門下更有向上事在遂舉起拂子云大衆還會麼萬古碧潭空界月再三撈漉始應知復曰昔日法燈禪師云山僧本欲深棲巖竇隱遁過時蓋緣清涼老人有未了底公案出來為諸人了卻山僧自先師去世以來向因抱病守拙適承郡邑護法縉紳春元文學居士等衆既我同門圓明爾初和尚馳翰相招將山僧推出海雲座上若謂為龍池先老人了未了底公案則瞎卻天下人眼去在若謂不為龍池先老人了未了底公案亦瞎卻天下人眼去在且道利害在什麼處復舉王常侍一日訪臨濟同到僧堂內侍曰這一堂僧還看經否濟曰不看經侍曰還學禪否濟曰不學禪侍曰經又不看禪又不學畢竟作甚麼濟曰總教伊成佛作祖去侍曰金屑雖貴落眼成翳又作麼生濟曰我將謂你是個俗漢大慧禪師云臨濟老漢握一柄金剛王寶劍氣衝宇宙天下橫行等間被這官人輕輕一拶便見冰消瓦解且道這官人有甚長處聽取一頌大慧頌云世出世間希有事顯發須憑過量人只將補袞調羹手撥轉如來正法輪師云臨濟大師大似藏珍之家忽遇個白拈賊挨身一擦便傾出顆摩尼寶珠光前絶後耀古騰今大慧恁麼拈頌壁立萬仞千古之下誰敢埋沒王常侍且道臨濟大慧還有為人處也無聽取海雲一頌一段奇特大因緣分明驗的向人前大家豁開正法眼莫教滅卻瞎驢禪圓明和尚結槌云諦觀法王法法王法如是下座上巳日命監院啓論普門品經期沈天一居士設齋請上堂僧問祖意教意即不問聲色堆中請師指示師云何處不稱尊進云恁麼則香風遍處誰能識湖水深雲笑滿腮師云誰是知音者僧喝師打云者一喝落在什麼處進云大衆證明師云且喜沒交涉僧禮拜師乃云有佛處不得住菜花開遍處處黃金布地無佛處急走過林木森陰村村煙柳垂絲好光景大家看浪湧桃花三月三平地一聲燒尾去崢嶸頭角絶遮攔且道海雲隊裏如何變化良久云謾誇三級禹門浪密移一步看飛龍卓拄杖下座因開三門程居士夫婦設齋請上堂僧問門開八字明賢蚤悟風帆未挂達者先知正恁麼時如何師云縱目所觀進云龍女獻珠增意氣垂虹亭畔得風流師云海雲天際闊進云鉤頭未釣寒潭月柳線先穿金鯉魚師震威一喝僧禮退問一喝分賓主照用一齊行如何是照用一齊行師垂拂云你還上釣麼進云如何是先照後用師云你不在門外進云如何是先用後照師云棒棒見血進云如何照用同時師云汝試覷看進云如何是照用不同時師云今日不答汝話進云照用已蒙師指示向上法身事若何師云處處桃花刺眼睛進云恁麼則春色滿園關不住一枝紅杏出墻來師云過去久矣進云有意氣時添意氣不風流處也風流師云不得頭上安頭僧禮拜師乃云法無定相遇緣即宗智不格物隨流得妙直得觀音菩薩塵塵作主剎剎分身應以比丘比丘尼身得度者即現比丘比丘尼身而為説法應以婆羅門宰官身得度者即現婆羅門宰官身而為説法應以長者居士身得度者即現長者居士身而為説法應以若男若女等身得度者即現若男若女等身而為説法正所謂觀音妙智力能救世間苦諸仁者還知山僧拂子為諸人説法麼驀豎起拂子云向一毫端上建寶王剎現千百億釋迦牟尼佛而為説法去也雖然如是總不見得何故聻若將耳聽終難會眼裏聞聲始自知喝一喝下座上堂僧問松陵城畔衆信殷勤師登寶座祖印高提如何是密密意師云鑒僧喝師便打乃云擊大法鼓演大法義蠢動含靈個個瞥地為甚靈昭女又道明明百草頭明明祖師意適才落雨恰又天晴晴雨分明見者親見者親切莫馳求向外尋直饒塵説剎説無邊説海雲將來都拋卻為甚如斯個個聞見分明喝一喝下座三月十五日施主設齋請上堂僧問法筵龍象衆當觀第一義第一義即不問如何是當觀師云蚤已道過了也進云金風吹玉管那個是知音師云目前無異法不與衆同流進云獅子蓋覆群音去也師云嚇殺闍黎僧喝師云不得亂鳴師乃云有時向十五日前成所作智了辦也有時向十五日後妙觀察智分明也且道正當十五日大圓鏡智目前無一法無一法不在目前才擬一法便隔千里萬里去也秪如平等性智一句又作麼生情與無情等共見眼裏瞳人各不知卓拄杖下座上堂僧問春末夏初緑樹成陰師升寶座有何祥瑞師豎拂云會麼進云琉璃殿長珊瑚樹瑪瑙階生碧玉花師云見箇什麼道理進云薰風有意無人曉吹綻梅花笑嶺頭師云未是時節僧喝師云再喝一喝看僧禮拜問馬祖一喝因甚百丈三日耳聾師震威一喝進云黃檗吐舌又作麼生師便打進云雪後始知松柏操事難方見丈夫心師云也須領會始得師乃云今朝三月草六春風夏日成熟海雲寺裏無為露柱燈籠碌碌直得三千諸佛説法於重重香水海五百高流應供于天上人間且喜海雲終日喫粥未曾嚼著一粒米又作麼生正直衆施主設齋請山僧升座為諸人説一句子佛法且道這一句子如何説為復是福田説為復是受供説若為福田説福田無量若為受供説受供無處且道除此二途如何即得卓拄杖云諸惡莫作衆善奉行便下座比丘尼明賢勤修領衆善友設齋請上堂問一輪杲日當空挂四海山河處處明文殊是七佛之師因甚出女子定不得師云通身顯露進云大定等虛空罔明是初地菩薩為甚卻出得女子定師云拈來全不費工夫進云出得出不得今蒙指示秪如瞿曇女子文殊罔明即今在甚麼處師云都與一串穿卻進云恁麼則一把柳絲收不得和煙搭在玉欄杆師云也須施功絶妙始得進云謝師答話學人禮拜師云闍黎又分身去也僧便喝師云大衆且道這一喝還有賓主也無進云也要和尚知得師乃卓拄杖云若識得這一喝賓主歷然目前萬法無不了了其或未然不免與諸人下箇注腳今朝四月初一夏熱春聲已畢乍晴乍暗作甘霖草木昆蟲均利益且看行人路頭滑帶水拖泥半乾半濕奇逢移花接木漫呈巧手緣爾攢米作供特煞現成秪如百花叢裏安身十字街頭著腳底合作麼生銷受莫將世俗見埋沒道人心下座史金包張陳沈衆善友設齋請上堂問垂虹亭畔脫體全彰未審海雲門下如何師云風恬浪息進云因甚城東老母與佛同生不得見佛師云你那裏見得僧一喝師打一拂云叫屈作麼進云為什麼十指頭上俱現師云莫妄想問有一物上拄天下拄地二六時中在聖不增在凡不減如何是不增不減底道理師云那裏得這消息進云水底蝦蟆吞日月不風流處也風流師云卻不風流僧擬議師便喝進云啞子喫黃連舌頭俱宕出師云略知滋味問春歸何處也滿目緑陰濃了了不遷義朝朝日出東春去夏來因甚又道不遷師云農夫個個望甘雨進云處處緑楊堪繫馬家家有路透長安師云長安且置吳江風境又如何進云白雲片片歸巖谷芳草漫漫掩逝川師云漫將聲意語喃喃進云大衆牢牢著耳聽師云音韻都在千峰裡啼徹南尋萬木新僧喝師云是何意旨進云聾卻一堂僧師云沒交涉問智與師齊減師半德過在甚麼處師云過在闍黎進云某甲推倒禪床喝散大衆又作麼生師云你不是其人進云從來覿面難回互遍界明明不覆藏師云好與三十棒進云坐卻毗盧印踏破普賢門師云切莫亂走僧便喝師云又亂喝作麼師乃云身是菩提樹心是光明臺智性清淨海日不假安排神通並妙用運水及搬柴現前諸仁者還識得神通妙用麼若識得神通妙只在動用中頭頭顯露物物全彰非但現前四衆人等亦如是過去諸佛亦如是未來諸佛亦如是現在諸佛亦如是乃至僧亦如是俗亦如是男亦如是女亦如是蠢動含靈亦如是所以道不見一法即如來方得名為觀自在以拂子擊香几下座比丘尼領丁信童設齋請上堂問諸家門庭即不問三玄三要請師宣師云點即不到進云為甚麼點即不到師云點進云看破了也師云不點僧一喝師云到即不點問古人一言半句便知曹洞兒孫師云我這裏總用不著僧便喝師云你者一喝是臨濟是曹洞僧又喝師云再喝喝看進云野色更無山隔斷天光直與水相通師云也是亂統師乃云適才伐鼓升座早已向諸人道過了也乃至鼓寂鐘沉時又作麼生所以道靈源不昧萬古徽猷入此門來莫存知解且道未入門一句又作麼生道遂以拂子擊香几三下云海雲今日失利下座在心禪人領陶省吾居士等設齋請上堂問如何是奪人不奪境師云百雜碎進云如何是奪境不奪人師云覿面不相識進云如何是人境俱奪師打云把舵逆風行進云如何是人境俱不奪師云從來不踏歌舞地進云恁麼則一月印千江去也師震威一喝僧禮退師乃卓拄杖云還會麼知有底人穿破聲色外無遺靈然獨耀踏翻歌舞地遊戲物等同真花街柳巷出入自由淫坊酒肆縱橫無礙直向百花叢裏不沾身荊棘林中全意氣又有什寒暑不遷之謂耶所以毗婆尸佛早留心直至而今不得妙現前諸仁者還知自己得妙之處麼眼觀空色界心印了無宗喝一喝下座比丘尼覺塵領超果設齋請上堂問師升猊座四衆臨筵向上一機乞垂方便師良久云會麼進云恁麼則全憑一滴曹溪水流入滄溟透底香師云汝再道看僧喝師云看僧作禮問昨夜吳江傳消息報道海雲飛上天如何是諸佛出身處師云杲日當空進云恁麼則針鋒頭上翻筋斗紅爐焰裏碧波生師云照顧眉毛進云只如薰風自南來殿閣生微涼作何話會師云個個得意氣進云一句曲含千古韻萬重雲散月來初師云又被風吹別調中進云水上東山行不住火中木