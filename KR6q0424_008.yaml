body:
  text: 門人海鹽益證等編禹門影堂集詩偈丁酉十一月自燕歸抵毗陵聞先師訃是歲元旦在北有異夢焉三月行程一渡江秋深葉落滿庭霜才登岸腳收行李忽睹山頭送訃章掩面罔知誰問訊蘇聲重與共商量曾經元夜通消息夢到於今泣路長龕前上供十載師恩報未休聞傾血淚上高丘如何隻履先歸去卻教孤燈末引愁入徑風寒吹面冷臨機語默痛心頭思深石壁空埋迹望斷雲山影莫留十二月初八日夜古南和尚促移龕師本同根各一枝果能誰是克家兒傷殘骨冷叢林散痛徹心酸衆目悲何事生前輕料理致于去後任施為莫言不肖叨法位敢與爭先力論持戊戌春雲陽道上讀鶴林和尚書扇頭詩有感兼步其韻附原韻躡足龍門膽氣誇此來頭面帶煙霞三冬巖室餘松火二月江村賞杏花蟄戶春寒難出穴蜂房人靜自排衙片帆復放荊溪去邈得師真是克家春勝人事自矜誇面擲東風散碧霞叢鳥亂聲催客路驛亭孤影襲燈花江流水闊寒侵戶雨洗林新柳護衙鴻鶴峰前棲泊思迢迢山色米南家寄鶴林十州兄兼呈方丈老人鶴林古德尚高風千載令人竹院逢歷國知名唐代寺虛堂説法近時鐘碑殘墨洗斯文筆境致陰涼祖道松孤峻門庭羞刻劍抱慚僧去繼誰宗有祖道松十三株記碑山中得扛字韻兼慰同門古帆首座安心立雪世無雙為道傾家惟老龐汗馬功成歸漢室乾坤數定息烏江漫將頭角崢庭戶且放和平護法幢流水去還容器得夕陽影落力難扛清明後五日夜大雪忽楚水法弟奔訃入供遂出山有感兼送別不知何事怒天威一夜溪山與世違冰割春風青草斷眼堆白浪玉花飛寒光落焰流凝地節屆燒香冷濕衣踏凍毋輕霜雪纍到家宜展目前機監刻先老人語録雨久偶閲十景遂擬成韻禹門橋翠積橋流迥不同禹門三級浪拋空松間露滴聲聲雨谷口香生面面風芳草溪浮春水緑杜鵑血染映山紅好看霹靂晴燒尾到此方知魚化龍娑羅樹雷抽心木為梁竺國靈根佛廟東移來法脈此山中千秋鐵幹橕霄漢一段堅心剖梵宮花素雷驚香拂火影成蔭覆葉遺風祖庭梁棟承君力虛腹流光氣象雄中龍池林麓龍旋水一池深藏頭角豈驚時代為窟宅形于此淵脈流分派所之空印水明千古月影懸花放不萌枝看飛會作風雷雨遍澤甘霖與世宜分賓嶺昔年問道不知名雲水來參向此行勘破歸宗禪去也掀翻濟北棒離情三登九上人何處喝震雷奔鳥亂聲楖栗橫肩誰把住嶺頭賓主自分明白雲崖欲飛飛不上清霄猶帶春風雨未消陡落斜披鵬展翅崚嶒勢逼虎申腰丹青摹寫絹千尺天女橫拖練一條幾度老龍摶不得一回來去一回騷避暑窟源師三賜帝號五住大剎仍退此終焉禪室多年冷似秋鶯啼花落萬山頭衲衣淨洗巖前雪雲履登沾石上油侍者罷參馴野鳥國師不教索犀牛寒侵松火三冬富避暑涼清一窟幽試心石石插陵虛令試心試心人見膽魂傾縣崖未肯全拋手半偈如何出死生縱步轉身須著眼臨蹊掉臂漫牽情直教試到無心試堪笑東山水上行憑虛閣憑虛一閣倚空高月下誰來把戶敲爐火乍添煙篆古畫圖頻展墨成蛟擬鄰睹史談初地欲與先天論易爻鳥道栽松人罕遇雲霞出入挂眉梢伏虎石君非草木鬥春紅踞伏威獰虎嘯風形似藍田曾沒羽補如神女漫施功驚群磊落嶂煙裏獨立孤危霜雪中願護祖師聲迹在嘗聞聽法曉雲鐘玉陽臺亂峰頭出玉陽臺登望千溪萬壑來山色聊呈紅點翠水光卻映緑生苔迎空音樂花飛雨過嶺老猿聲叫哀未許片雲能翳目一天風月四時裁送先和尚語録板入楞嚴偶過東塔即事信自靈山記莂深福城煙水力追尋新成梵閣標初志奕世文章啓後心檀度果圓酬夙願慎終功德敵祗林好將白社邀賢士法脈芬芳亙古今訊善卷和尚并引浮石老人居吳門西山桐葉菴受善權請戊戌秋九月草一日入院某十月朔二日過禮賦俚言書扇頭呈敬菊花香滿傲霜天桐葉飛聲過善權雲水趨奔離墨山名徑風帆挂落祝陵即祝氏墓也故云祝陵埠煙杖持白髮尊檀膝座侍巾瓶繼佛肩一擊清秋正法眼重開祖印印單傳題善卷洞寺建自孫權時三國雲山開建寺一條古路洞邊去泉流不斷殿無雷火書名偃柏處有雷書偃柏之迹尚在為先和尚録板工竣送入楞嚴值聽梅法師入院書贈去來賓主菊花秋正此時當闡化猷懸辨縱橫稱義虎顯揚曲屈繼禪稠恢張紫柏門庭煥句破楞嚴狂見休不吝廣長無壞舌分身塵剎喻三周龍池和尚小祥塔前上供賦呈永首座兼勉同門師去絶端倪望東枝向西樹眉愁盡落家法治何齊窣堵霾霜雪山流斷碧溪相看天際鶴來去復雲泥懷梁溪馬爾采居士諱瑞出山日於夜忽驟雨記得山頭雨瀑聲想夜狂阻晴兼阻客流日復流香洗垢絶塵迹恣情多抑揚霽開紅緑戰星掃地天荒豔世矯春露松秋操雪霜朱門間茗碗白社逸霞觴時節菊清品谷幽蘭獨芳久懷交淡蕩聊寫菜根長過鳧溪白椎菴挽聞照法師壽四十九七月三日逝憶余初登戒品年公作梵音導其前倏忽春光草四載秋聲葉落驚人駭逝者如斯空歎哉饒是瞿曇也笑哀四十九談無一字縱橫來去恣遊戲白椎不説苦空禪拍手西歸看種蓮鳧溪波浪如天闊諸子望師歸莫測我來遲爇一爐香為師拈出無生滅白椎菴雨阻兼示慧上人春雨長新緑老藤牽古松林深多異鳥水淺少遊龍揭目數竿竹舒懷千里風誰知此段事微笑破顏中又雨中望虎丘緑凝眉宇短長松林內新聲林外峰只道白雲飛去也看看原在此山中晤達明禪友本是同鄉兼俗親緣逢吳國話重新道為南北多相左爾我萍交秪個人訪聞機道兄敘舊憶昔窮山水親臨問道原罷參懸草履招隱理林園竹影移無倦松風操不煩聚傾胸次積霜雪老何言己亥三月十一日復事影堂作明州太白名天下百三十代傳燈亞唐宋五宗啓法筵至臨應菴密菴罷數百年沉法鼓聲洪鐘一扣群音差元公司李作金湯請主師翁辛未夏棘剪雲開萬象森千工萬運梁高架十載叢林一建新中興濟北宗風化十二支分派脈洋百川源海各津梁我師獨闡禹門寺繼父揚聲祖亦揚時陷干戈隔雲水彈指座中祛虎狼鼎革煥然百廢成看破雲山水陸程四海禪流雙眼碧空王殿裏一燈明秋風秋雨灑秋香清波上不泛慈航荊溪東瀉聲悲落月冷千峰草木傷及子延孫未了事誰堪振翼鳴翱翔都緣祖父光餘廕何不傾心向影堂客龍興院偶晤禪友以詩見示作送別細雨瀝秋聲佳期話客情泛流新水濁憑岸得風清相識亦從此知心誰共評天涯逢邂逅惜去意何傾蚤秋作似鐵關法兄方丈一葉知時往飛林不見多花香經雨謝草色漸風磨祖父法幢海弟兄情義河流清亙古潔豈與濁成波又蚤秋即事和鐵關兄韻不覺箭催時又改惟餘滄海共山高林間茆屋英雄隱石上松陰處士操夏日冰生成節祭秋風浪湧往徒勞凋殘葉落霜塗地萬籟聲消何處號寄住宛陵同鄉幾回深想敬亭登何日風帆入宛陵畫壁圖真千百個同呼名姓識高僧敬亭昔黃檗客寓裴相國見壁上畫聖僧真引問師云云即此送六融法姪為師住禹門打供七月秋風猶帶熱路行車馬漫停歇白蘋翻浪魚鱗輥楊柳疏陰蛛網結何事獨行不惜身葦波履險沖符節因時僧聚禹門多固爾殷勤打供切楖栗龍遊去百川草鞋虎猛離群穴逢人謾乞一文錢開口須饒三寸舌賺得襄陽龐老禪傾家財施真豪傑君不見懶融日日走丹陽三十年來名始揚朝去暮回力不折身心堅似一條鐵遺風籍載牛山頭道德名標千古碣子緣生楚黃麻人楚稱黃麻才氣神難近難親終不易為人為己要經綸打東家罵西鄰驅耕奪食捉麒麟捉得麒麟徑莫輟踏破千溪萬嶺月一回直入寶山家傾倉倒廩不須説清風滿載日歸來恣爾師顏歡相悅三拳肋下還一把虎鬚捋此是超群獅子訣履冰辭省覲伴我和尚口占龍池絶頂玉陽臺須自親登到一回舉似霎溪資福老句中兼致正中來九日前送密音禪友住壽昌寺龍池數載不辭勞贏得清秋眼界高此際黃花香欲吐送君含笑節前操遊張公洞徑入張公洞玲瓏醉客心怪神工不易奇巧步難尋靈竅通天日鬼形奪地陰擬窮沿底路前去峽猶深過海會禮磬山天隱老和尚塔乾巽向多年聲迹磬山隈今日親臨到此來塔立乾峰新海會寒香獨秀一枝梅中秋夜諭看月華者一輪皎潔淨無瑕猶較春燈光更奢珍重管絃延醉客莫教眼底妄生花又得歸字風蕩雲霞盡息機中庭孰與是成非竹林高士何相習獨許淵明醉著衣題畫雪裏梅有雙雀一啼一宿一枝雪裏香寒徹雙雀啼眠意若何設使春風搖弄影莫教離此別投窠題畫圖帝闕亂疊千峰雲外出一庭風月向溪流相看坐對青林下不計前朝王與侯登芝山頂謁玄帝新宮上有三十六洞峰立聳霄漢煙堆殿宇新山靈多古洞石潤少飛塵羽士承仙脈玄宮集蚤春浪傳童子去丹灶尚遺真溧陽方山普陀寺影堂集題八景詩有引己亥秋九月寓方山日暇觀眺其山形若飛禽獸伏之狀可謂殊勝固擬八題曰八景云其坐山形似象眠故題曰象屏峰于項橫落一脈直下如鳳翀霄其平如掌有印林禪師者誅茆開闢建寺騎上董太史其昌書額曰小普陀寺旁有池流注不涸故題曰鳳皇池清涼石者在寺之後印公初撥荒入見其石以拄杖卓立遂意禱云云而孑然弗傾固爾心喜默異焉因是以成叢林記其原名清涼石也寺西南有高阜與象尾相連絡僅對其懷宜為普賢臺之名右有紫竹叢積茂盛約畝許云紫竹林即圓通殿側西北有泉甘美清潔筧入廚可給數百口之餘擬以天人師號應之曰調御泉向有龍洞馬衝而合為八景遂拈筆吟詠粗索成韻孰曰詩歟聊記林泉之始末亦閲笑于大方作遊興之餘韻云兼不亡其人當額曰印林禪院青龍洞一山特起萬山朝山洞龍藏雲外飄變化神奇看掣電應時風雨及抽條象屏峰象屏峰擁碧雲霄寶帶垂空落鳳毛羅列溪聲長廣舌梵音嘹嚦捲松濤鳳皇池靈傑山川發秀奇天星形落鳳皇池茂林深注長流水月照清波緑染眉石馬衝萬里馱經白馬功身堅石馬歷秋冬名稱兩立歸僧寺石迹堆衝馬化龍調御泉派遠流清調御泉涵空印月徹深淵滋生萬物成佳品縱爾調羹必用先普賢臺峨嵋山上普賢來信步移方向此臺落地雲開菩薩面放光石照象王回嵋山有放光石紫竹林紫竹林中身應多善財雲裡唱玄歌不知音韻誰家曲到處聞聲向普陀清涼石清涼石上白雲封獅子遊行不見蹤哮吼之時群腦裂文殊冷笑漫扶笻又總八題成韻方山乃金陵幹龍也象屏峰湧金陵浪紫竹林開小普陀石馬衝明空界月青龍洞古碧岩阿鳳皇池影天花落調御泉香六味和殊勝清涼石上立普賢臺望遠來波即原韻奉答呂秀才影孤雲鶴過溪山為愛林泉玉筍班偶筆不堪成俚句承箋獎諭啓柴關青松皓月高岡上白日風塵滿世間若也信歸灰劫事好偷忙裏話生間喜林叟禪兄夜話有引自乙亥太白相別之後迄今二十餘載忽自淳溪過方山訪豫豫偶外遊至夕方回及晤面不識矣公撫掌笑云某也相敘甚樂故賦以志之春日遊行過別峰歸來燈火夜初紅入門把手面生澀道字傾聲音已通彼此相看霜雪裡大家疑似夢場中掀翻祖窟當年事漫話滄桑鬢不同又過淳溪相訪與豫同庚忘年共半百彈指晤三春太白參同普淳溪道義親水流天際月風落樹頭塵湖海一瓢飲幽居日又新途中五十自囑麥秋五日卻生渠浪迹天涯半百余心外有身堪算數杯中無物可躊蹰笑談麈尾憑拈弄輕薄狂言自剪除洗鉢江湖隨挂搭杖頭風月聽吾祛同林叟甘宜伯袁非池諸公登保聖寺塔林無顏色可當時三月遊亭罷酒卮古寺蒼茫龍虎柏古柏二株名龍虎僧堂冷落祖師眉新荷出水簪雲濕老樹凌空操雪姿塔上鐸鳴呼客語聚談霄漢眼高窺初夏初夏入新熱花陰臥短墻一枝情不倦蓋覆草頭香題高淳縣新橋又名鳳皇橋系宛陵通要長虹穿水面鳳眼逆流窺兩岸波濤靜平帆去不危襟湖通宛道負郭接京師任重頻來往樓臺引月隨題龍悟菴并引淳陰龍悟菴者興于丙戌歲適有龍自西北來蟠踞菴脊頭角顯然稍頃向西南飛去觀者以謂奇事邑侯丁偶題龍悟為額恰符其兆焉庚子春豫就醫寓此是以知其詳聊述志云菴東向結草向平原龍蟠衆目喧花香塗覺地果熟布祗園萬頃煙波集千林樹木繁開窗明四野紅日湧當軒龍池和尚十月草九三周忌日師真高挂月明中三載殷勤事已終鳥謝春林香滿地猿啼殘雪歲寒風追思不教全無改較後誰行半折衷捲卻簾吹燈下火虛堂日落影凌空影堂告辭詩有引先師去世七日舟方入山正直紛紛舉措之際及任請狀乞銘監刻語録之事至次年五月十二日工竣遂送板嘉興楞嚴寺已入藏坊秋舉入塔特進山諫議衆心已合非一可止爾故告供而往師小祥躬禮塔頭見塔銘未勒工石未程又居兩月以完刻立碑遂計遠行己亥春聞永首座病將危矣偶泊吳門得信以至悲感剋腑臟遂勉詣山乃三月初十也次日即奉影堂其永首座徒輩又作一變沸搖非小固輸己資以為調解事得沖融嗣後商于衆以繼席之舉於是一衆未全肯諾言至再方允從于六月一日接某入院以影堂一應等事交代畢矣吁舟雖未能盡孝然三居禹門共一十六箇月日也時九月十有二日過方山主人洎衆堅請住持亦勉允以補三年之志而作事奉焉約一年三周之制畢故先於真前作告辭云師之去世舟無住皆因師後事所纍舟豈無能向遠行見語嘈嘈忍將避師在光中鑑亦清寧有祖道屬人治半年一年存與亡兩次三翻事不易若彼若此有嫌疑門墻角立何名位寒心三反入龍池仰面捫聲吞熱淚欲訴於師未及聞猶將今古評公議百丈典型千古持豈向禹門一旦棄聽説斯語衆顏怡故從繼舉承遴次既托于兄事周旋豈不傾誠全仁義思子於父觀其行固假方山展終始就此室中縣師真聊表一點喪心志陳芹供水作清饗日焚夜火恭如侍雖未緝御樹法幢靈光虛運空不墜循環交際秋幾經屈指師今三周忌禮師真前告作辭乞師昭格鑑舟意欲負師真別此間馨香再播他方地暫隨雲翼寄空林若得深棲重興記友人歸桑田結菴口占味道參風歷有年歸菴傍水近親田春花夏麥秋黃稻正好安間看雪天春日寄金粟孤雲和尚憶昔看林落年來草四秋世移疏見闊情慊淡交遊瘦影春聲拂幽香谷口流惟憑持此意寄語別山頭和𨍏轢嚴居士中興普明寺韻昔年問寺僧悲感復何興棘草逢春剪金沙聚日增願深功業就持重道愜弘載帛千秋事誰將名共登秋蛩吟爾聲于類亦非雅何以喜其秋露吟若使夜深聽仔細悲悲切切語寒心影堂集終
