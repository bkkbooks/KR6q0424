body:
  text: 侍者超修録吳門雜録囑卻迷泓知藏衲僧家出一叢林入一保社切究佛祖根源了脫死生大事始不負參學之志若乃為己為人亦須具透關眼目方可到徹頭徹尾底田地然後拈一機一境教令直下勦絶便掀翻禪床躍倒淨瓶焚拂禪板肋下還拳劈面便掌恁麼喚作全體大用亦早已錯過了也不見臨濟祖師云吾滅後不得滅卻吾正法眼藏時三聖云怎敢滅卻和尚正法眼藏師云已後有人問汝向他道甚麼聖便喝師云誰知正法眼藏向這瞎驢邊滅卻試看他先德提持正法豈若今時不是落在文字障裏便乃坐殺玄要句語中又有等阿師見他後生輩寫得幾個字畫得兩筆山水就以聲勢牢籠他謂你隨老僧住住將來不孤負汝引得他業識茫茫無本可據一心只要付法偶湊騙得枚拂子去到三家村裏説青道黃忽遇著個孟八郎驀頭一問便面赤耳熱報國亦不是壓良為賤惟將驗過的藥病一併拈出果服應效管取四稜著地何妨將千金擔子與伊儘力肩去第不得效麻纏紙裹的樣子到處惹人笑是書此語一任卻迷上座持去示天下人囑形山洽記室返昭陽舊隱吾有一寶祕形山等間莫與路人談消磨垢淨輝天地照徹心宗獨指南水國幽居宜養靜研窮妙義契同參他年果熟香飄處十字街頭任放憨囑天節中維那天節維那名源中自入海雲之室歷嘗諸方五味禪有年矣丙午秋于報國領衆至丁未春解制後辭歸省親遂書囑云偈曰如來禪祖師禪拋擊聲中省悟前焚沐酬恩遙禮謝絶攀大意樹枝懸玄關透脫無師智妙協不同獨腳篇得此香嚴真骨髓維持正法永流傳囑且瀚澯副寺且瀚副事名源澯昔到方山次任海雲副寺知因果明罪福骨鯁氣和行履清潔可為今時衲子中間氣也一日辭去遍參于丙午秋復來報國入侍寮仍兼理副事以至山僧謝院之後辭去結茆固難以意留若道山僧把住放行逢人但恁麼語偈曰心離意識參同普學絶聖凡碗脫丘一滴源分四大海三條篾束萬峰頭喝雷棒雨傾湫嶽打鳳羅龍駕鐵牛且喜住山人本色見超師可異常流同住規約馬祖百丈開闢釋氏宗規黃檗臨濟特倡千古玄猷所以建叢林立規矩分賓主定賞罰辦道安心之士有所歸焉邇來法門風運奢侈相習亦不免欣厭之半然報國乃創始梁代前茂林和尚中興之業自茂翁去世雖有繼美之風而或其力未充故席院寥落人力星散法屬監院亞圭者結影撑持欲起前人之志固乞郡邑薦紳護法居士等公啓敦請山僧於五月初九日進院不覺睹目動念思古人曰安危德也興亡數也而苟德可將苟數可憑斯叢林規矩豈可忽哉敢以先德煩略之誡聊述數條以勉同住者云復永寧素嚴和尚自先老人去世并入塔之後不料種種異變異聞雖咫尺如隔天涯忽接翰諭兼讀尊刻令人肺腑加虔永寧可謂卓然高出雲表禹門頭角獨伸淮東天際欣慰欣慰豫年齒衰頽六種緣慳無能振揚祖道甚抱愧焉介石弟擬遷塔因得手札方諳始末餘並無一音入耳此一舉必是旁以勢惑之豈可附其尾亦張其聲耶升塔之念愚意久矣奈無物固爾因循茲慶美舉幸先老人巾瓶猶傑出九峰之右也但考形揀選恐日期太促于七八月間動得方妥倘今年不就要在丁未秋可也極欲圖晤面傾夙積因寺中向貽荒産役纍逼迫固不得抽身遠出如尊意果決不妨輸質當先誠恐資力兼備者難在先人面上亦不顧是非得失之虞可也不宜緩急就之為妙餘不盡述幸亮裁奪專此草覆和順治先皇帝贈玉林和尚還山詩原韻自古真人降帝家指天指地作生涯神光耀宇流清韻紫氣騰空麗彩霞教徹宗通傳正脈慈弘願濟等河沙玉樓煙染緇衣色覆卻金毛獨露牙甲辰九日後古帆法兄過吳門報國以詩見惠一宿而返思去之速遂和得黃字韻兼寄懷霜老楓林落葉黃何如籬菊晚來香滿庭秋色排幽徑擊目天涯渺去航意氣橫空鴻雁履不朝深處臥雲房漫辭弘道勞心力回挽頽風振古揚甲辰小陽月訪繼起和尚憩落紅亭覽其匾序幡然一新遂口占為贈靈岩亦名象山形勢儼然故鼻峰建亭曰落紅靈峰卓立青霄外三萬六千波漾中浩蕩胸襟廓聖眼千秋象顧落花紅乙巳秋素嚴和尚往禾請藏經路值龍風水漲丈餘抵報國話懷兼送別為法裒金一剎那不辭風險入洪波傾心濟物參同契任願弘休道韻和燈破永寧千古暗教流東海福田多停看落日吳門寺曉載歸帆上北河訪豈凡金太傅記別靈峰不昧因乘時化現宰官身掌樞裁決誇明哲問喘和聲頌道民才選名高柱下史願弘信歷法王臣誓深塵剎將心奉淨穢遊行佛日新寄仲將包居士三載江城賴護心傾懷道義重如金聊書短句詢幽致他日臨風話別音題朱鳳萱居士夫婦真子振寰請質稟陰陽生化育根同天地歷清秋松山偕老無餘事胤子延孫奉不休自讚卻迷知藏請謂渠是個傖漢卻也骨力挺然指迷者之路而翳豁青天驅狂者之病而電掣盲禪不將語默恆規矩一味攔腮掌與拳一拳拳落當門齒報國風聲從此始自讚抱真請咄是你曾入天童悟祖之室一棒打不回頭後到禹門浪裏通身抖擻不及只得一肩擔荷去也抱爾真兮拘執師爾法兮壁立露雙鼻孔與人看了此目前萬事畢丙午大年日為吏部考功司張住漢封翁止文老居士七旬壽天生俊骨産麒麟臘底梅花香異聞維嶽喬松千古秀景庭鶴集舞凌雲五日壽法慧禪碩五日天中節家家扶醉客唯吾法慧翁問壽于松柏松靈柏歲長柏子松花香蒼翠棲雲鶴幽林語奏篁明晨千樹火照夜一眉光佳氣彌新斗慶雲流滿堂辭報國兼懷徐昭法居士空生不覺滿頭霜眼碧清秋陶徑香黃葉雲飛天外去歲寒松柏只如常又辭報國寺寺居臥龍街西首百花洲之東一瓢雲挂臥龍頭三載清風載月流問道鐘聲歸何處滿庭香積百花洲因事自嘲赴席吳門寺何如珠走盤光旋雖不異役世豈能安水火無情急形骸須自寬憶經來去事莫與論心寒示幻雲知客雲化風神雨化天滿林春色露長涓有時幻出諸形象直教人稱自在禪和蜜蜂頌并引宋佛慈祥禪師者嗣法圓悟有蜜蜂頌五首勒石淹沒久矣不意復出於醉李金明寺掘泥土中得之諸方傳和者甚廣豫一日過如菴訪同門案頭得賞原什其味淵深遂次其韻思懷詩詠蜜蜂時憶佛慈心何日歸碑斷采花聲滿地韻聯字腳帶香飛萬子千孫天一涯春風花裏自排衙看看俱有青雲志隊隊成行入帝家三春花發正當時引起遊情去未離采得中心香味足一聲韻入益清脾一家和氣運春光風入煙波意不忙鋭刺林間香捧足百花叢裏去承當西風簷下閉枯桐謝卻香林光竅通百煉金針藏蜜室等間一刺血流紅與龍池介石登禪師書先老人十周之際某當躬叩塔頭奈勢有不可往者而猶有畏焉竊謂龍池一席乃濟宗中興之始非泛泛之所當今兒孫遍天下淵源皆由此耳自幻密二祖歸隱之後漸屬寂寥幸得先和尚復振祖父之風雖遭滄桑之易遐邇瞻光益隆不幸丁酉之變家門作祟致有同根相煎之憂一旦塔幢空寂徑屬別往今賴賢法弟仍踵祖父之武克紹入室之聲德恢已墜之業林睹抽新之條誰不望巖而聆謦咳乎是有不可往者恐辱起家之麟也巍巍祖庭豈不宣弘正令乎是有所畏也雖然安忍坐視旁聽令議者罪歸法門乎有謂今龍池遵鐵古二和尚之式凡同門概以客禮相待夫虛客座以待同門者或前者之偶然而後者亦出其不意可也若擬此為恆第恐聞達於識者深為法門不取也良以祖道下衰非人傑詎能揚聲於末運況區區之不肖者乎固不當履諫爭之階也語云尊莫乎道美莫乎德當斯之世雖未見其人或于法門禮有可取者自爾和氣攸歸果欲達己達人庶遠恥辱也吾法弟和尚幸踞既傾之岸必回狂瀾之波即風雲偃化響應聲來及門賴其光寵緇白慕其實歸不致旁觀者噱則存沒之幸矣謹具先老人供儀遙申寸衷之至仇敬泉居士八十功名世壽與文王直釣垂綸渭水長夏復春光臨醉里潑天雲氣藕花香懷灌溪李居士應時桃柳浴春風松菊猶存秋徑通故國懷深情去遠吳山望近意難窮煙樓撞破流芳葉臺柏凌霄駐玉驄雲水天高一段路不知何日論心空贈大頑法姪即舜山全居士莫大因緣一段事頑空特地為申冤銅頭鐵額蒿枝拂從此禪流濟北源送同門素嚴法弟旋荊溪歸永寧寺片帆才挂秋江上千里歸音振海濤肩拍禹門空裏過射州城望佛頭高臘月初六日為董耀庭居士七秩冬日雲開萬丈天一光東照大羅仙皓歌誰謂商山隱角里偏居向白蓮溪上松風清似鶴壺中月挂直如弦談空實相從心悟不學人間寐語禪付囑都門普濟禪林覺幻監院黃檗聞百丈舉馬祖一喝三日耳聾不覺吐舌睦州識得臨濟必成大樹陰覆天下人所以千古之下獨稱濟北宗風而機辨奪群傑出人表至我天童師翁白棒掀天繁衍中外龍池先師激空禹浪雷轟普濟平地聲騰唯覺幻監院去華存實抱逸青標深藏頭角豈同點額之流偈曰密移妙用大雄峰覿面全提箭拄鋒傳此繼吾正法眼莫教滅卻瞎驢宗自讚永濟融長老請兩眉橫劍雙眼一天胸壑虛浩口海流禪機拔利鈍棒掃廉涎是聖是凡居末位恆沙佛不與齊肩又讚覺幻監院請普濟堂前露本懷棒頭一擊禹門雷衝開碧落千尋浪敕點飛龍遍九垓送永濟長老回廣寧二首己酉春路出關山氣浩然宗風獨立正人天踏翻三級禹門浪源化東流濟百川送子歸程萬里還春帆高挂水雲間杖頭撥轉西來意正祖風規一笑顏寄盛京國子公殿下擊目天涯只咫間遼陽秀氣結千山王公古産英靈地玉葉金枝第一班寄北直天台寺宗極證長老遞燈吹卻較千差暗地光生證克家焚鈔獨輸宗正眼意超言外笑拈華贈中山石舸法姪繼師之席開辟中山駕石船一帆雲挂濟無邊載歸湖海風流客拋出金剛圈子禪為楞嚴當家道充禪碩壽梅開玉樹滿庭芳二月春風載露香目送雲岑佳氣象青林柏染紫霞光酬華嚴寺雙樹房雪林老師原韻談吐如風豈易求鶴形松骨逼人眸百城參罷華嚴室雙樹林高萬壽樓南澗久膺心法印罄山相契箭鋒投而今弗覺輕攜杖重整詩懷句絶流酬本山深秀堂人素師原韻松陵古寺迥雲巔邀我鐘聲煙雨前法説應心無所住花香優鉢太虛懸林深秀氣開三徑位襲單傳印五天問道人從橋上過橋流水定素如淵行狀住永寧同門法弟行淵述師諱行舟字介為別號扣寂楚之沔陽州趙氏子父諱世節號季明母杜氏世服儒業師於十一歲喪母廢學出至黃安縣東林寺矢志脫塵禮純心師剃染十八歲隨師伯童山參方歷吳越間習經論之學五年間潛通教典師志意高遠不甘以語言文字埋沒此生聞天童密老和尚宗風大振亟往謁值童上堂下座師隨入方丈便問今日上堂事如何童云下座了也你見個甚麼道理師云乞和尚指示童便棒師禮退疑情頓起一日又入方丈問虛空粉碎大地平沉十方諸佛向什麼處安身立命童便棒云你只今在什麼處安身立命師從此愈加疑悶偶閲高峰語録見萬法歸一公案參年餘圓具後尋辭出山之龍華瑞白和尚一見欣然即送進堂堂中規條嚴整正遂師意從此晝夜苦參不惜身命嗽症極危亦不放參一夕聞二板飲茶放手中茶甌忽然會得日午打三更意旨舉萬法歸一一歸何處至一切古今公案了了無疑師既證徹不自表暴解制後復上天童往還十餘年老和尚每見甚恰意心器重之續因費和尚住金粟師輒往就冬結制安兩序職事尚缺知客忽見師費大喜曰有這位好知客在如何失錯即命兩序送知客寮費曰汝久住天童一應規條惟汝練達今金粟務要悉照行事師一味平等未幾辭職同師伯往江陰結茅數載緇白瞻風剃度頗多時與張靜涵居士尤契厚後雪嶠大師赴雲門座下弟子曹源大歇招師進雲門師至大師方示寂請師為典客其營葬造塔一應後事多屬師任然大師生平呵佛罵祖眼空宇內會下英俊極多見師必推師為老參熟諳法門紀綱師從容荷負不辭繁劇督理叢林樹立窣堵於雲門辨才古塔之旁竟為大師最後之法檀焉時先和尚正中興龍池祖席諸方久參宿學遐邇趨風師聞之始往親依一見機緣契合遂命為維那是時英賢濟濟師乃調攝有方內外咸悅朝夕惟率衆扣激此事日益智證經年餘便為入室真子矣嘉禾如如庵先和尚創始之地自赴龍池之後虛席十載順治己丑二月先和尚親送師入院集合郡紳襟上堂囑付命主其席時與觀察履素黃公激揚法要居三年師以老和尚發迹之所不敢獨自久留屢欲退謝固辭不許凡七歷寒暑整造修飭規模一新于是堅辭老和尚命古鑑禪師繼住交代後師往都門受普濟禪院之請結制開法闡揚向上一著普利人天明年冬南旋至毗陵聞先和尚訃音已八滅七晝夜矣奔赴心喪理後事并請狀請銘監刊語録次年五月送板楞嚴入藏後即請鐵關禪師繼席龍池進院之後師以老和尚三年未滿乃應瀨江方山近席設立影堂供養盡禮三年中凡龍池常住極艱瘁事無不竭盡心力一衆咸賴云龍池向自先和尚道崇德廣海納山容方來無不翕受十五年來故六種與闡提之輩窺覷無門後之相繼而住者或以緣不適稱或以歲值多艱不無宵小與外來者借此搆難于其間師平日為師為友當其義有所激念有所之雖鼎鑊在前師亦不懼故龍池凡巨細事悉為排難解紛也辛丑師過嘉禾萬松庵值有吳江海雲寺之師將遠行不欲就時值前住圓明正禪師力懇之師方允初至海雲頽落不堪未久諸廢畢舉冬夏安禪設戒衲子如歸遠近信嚮居三年應蘇郡報國寺之請寺自茂林大師後日漸凌替田園荒蕪征呼絡繹師志在振興凡除弊起廢有非他人所能勝者會當事嚴查度牒遽動故山終老之志戊申年寓歸如庵二載吳江承天萬壽寺係宋報本元禪師道場龍象雜沓載在僧寶傳中日漸廢弛明嘉禾檀護陸公光祖馮公夢禎輩屬吳江大姓蠲金助田經理故院為接納雲水之要津邑中第一剎也乃於康熙戊申共延青印法和尚主法結制於內一載諸紳士方以海雲夙誼且以丈室乏人非師弗克負荷復過如庵敦迫方允進院日四衆無不歡聲動地因寺田多瀕水不能供課師經畫事理公私幸安然慕年攻苦兼以嚴冬不得休息至庚戍復發痰症自春徂夏形體羸弱而操作精明一如平日痰症轉加諸護法請立監院稍節勞苦由是命久執侍者從聞上座監院事值插蒔晨起語監院曰我若一死薄治龕不用一切虛禮滋常住纍勸農勤作務要加厚飲食毋以我為念午時整衣趺坐少傾而逝蓋四月九日也師賦性磊落純誠無偽居恆簡默不露文彩待人平等律己甚嚴及遇法門體要全身擔荷舉動皆直節自見不肯少徇微私至于勘驗衲子當機迅利不假辭色惓惓以古人相期不輕許可不濫付授所至叢林經理補救辛勤不輟晚年無他嗜好惟勤勤執作務以利益常住為心至是入寂師世壽六十僧臘四十四出世開堂六居大剎説法自在語句切實具有古人風範所計語録兩册板送嘉禾楞嚴寺流通得法者十人剃度授戒皈依者難以數計于康熙辛亥年十二月二十七日護法紳士暨合寺大衆奉師全身樹塔于寺之西塔上一片石將乞當代大手筆銘之以垂不朽而監院從聞侍者法章等念師悟由雖表道行未詳復念余與師同門最契遠走海澨屬余述行狀余雖椎魯不敏義不能辭略為紀其生平梗概若師之真實圓通潛行密用與夫金剛正眼惟冀當世名賢君子受囑靈山大士筆尖點出永照後五百祀矣謹狀塔銘介為禪師以康熙庚戌四月九日示寂於松陵之萬壽寺越明年十二月二十七日弟子超修奉全身塔於寺西上寧元字墟世壽六十僧臘四十有四前後五坐道場度弟子若干人既葬其上首超修法嗣海鹽等具狀來乞銘將欲假世諦文字破介公實相為世人説法作疏通證明亦賢弟子之職也余何敢辭謹案狀師諱行舟字介為別號扣寂楚之沔陽趙氏子父世節母杜氏世服儒業生而姿秀氣宇邁倫既而父母相繼下世年十六祝髮於黃州之黃安東林寺西禪堂即五祖初渡之黃梅道場也得純心師度之年雖幼便已出身許道化物為宗頎然具大人相矣年十八以童山師伯之鼓策遂迸裂牽纏而出門初步已具萬里行腳因緣始謁天童密翁於太白峰頭便知十方諸佛什麼處安身萬法歸宗從何著落令其緒論直證無上法門徵其妙心立見本來宗旨由是參古德於名山探法輪於淵海過辨山謁龍華瑞公至武原謁金粟費公頓覺頭頭是道處處安禪泛綃川如淨海跋危翠如平塗於是雲水既厭結茅江陰靜息數載後往龍池遇萬老和尚承法乳之弘慈傳真如之妙諦遂爾命主嘉禾如如庵法席歷七年而朴素韜光淡泊養性敝衲自怡烹藜可食頭陀習其苦行津梁不惜勤勞是非人法俱空體用兼備者能如是哉丙申赴都門受普濟禪院之請開法二載繼而整海雲之頽瓦新報國之叢林憩老南湖終歸萬壽萬壽者宋報本源禪師法席明紫柏大師之所式廓者也師以吳江護法堅請故欣然以萬壽為歸未幾而積勞既厭四大頓空一法不存二利兼盡囑付已畢遂證涅槃嗟乎龍池源息法海波亭吳越之間狂狺猘噬求之太白一燈先後一轍者惟介師一人而已何也以師能砥柱末法張主宗門不作今知識色相而一棒一喝痛下爐錘使雲水縱遊之子掃盡一切葛藤立證三乘龍象豈可與今之架大屋養間漢者所能同日語哉況超修等繼志述事一遇法門體要慷慨直前全身擔荷信乎其可謂知師者矣而龍池萬公之席震炫重新俾初祖之西來大意炳如日星非師一人之光明得以復旦乎今超修海鹽等久沾薝蔔之香素領醍醐之化與諸檀護築塔於松陵之萬壽寺西敘師行實并刻生平語録紀述屬余為銘余宦遊吳地問渡胥城向跋高風不獲如閭丘守訪道寒山彭澤宰締交惠遠然披覽遺編恍同對麈爰述景行以示來劫乃再拜而繫之銘曰六祖初度教傳東土震旦國中人天覺路屹立重關誰不退墮倬彼介師一擲而過虛空粉碎大地平沉光明四照通徹帝閽下振聾瞽上動日星末世法席賴公以整如風鳴條如川赴奔盲師瞎禪厥有今名扇惑當世謂之魔民師若不砭舉世而昏熒熒一席如彼傳燈誓揮我戈誓堅我城斬卻魔種如醉而醒師居其間回陽沍陰生死既透去來任因何處是師吳江之濱日彼萬壽息師之靈巋然一塔坐對蒼旻師其安然萬億斯年余銘茲塔亦藉以傳賜同進士出身中憲大夫知蘇州府事前禮部精膳清吏司郎中吳道煌撰
