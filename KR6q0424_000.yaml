body:
  text: 介為舟禪師語録序別傳之旨如何若何的醉後猜三枚猜得著也是扶墻摸壁走眼目定動的棺材裏瞪眼睛掙轉來鷂子已過新羅國單刀直入的雖血濺梵天得勝時未免傷鋒犯手眉毛還在麼蓋由太白山高登峰造極者絶少禹門浪急暴腮點額者良多惟有介為和尚龍池洗澡波浪滔天諸方瀟灑活潑潑地脫盡語言文字獨逞向上風流鴛湖曾吐氣普濟大揚眉都門敲磕來直得大清國裏拈椎豎拂如麻似粟許禪和子被這漢一條拄杖揮入東洋大海去也龍蛇何必分魚目不必辨還要尋章摘句在之乎者也上吹毛求疵便失卻自己眼目順治辛丑暮春朔旦同堂法弟𨍏轢道人嚴大參盥手敬題序禪宗一燈自臨濟開山而後接其薪傳者晨星落落迄荊溪萬如禪師大啓宗乘抉奧宣玄説法龍池之上為衣鉢正支四方名宿靡不連袂重趼瞻禮恐後冀其指引迷津證成勝果然桂香滿院天花散空究之觸背皆非未聞標指見月風幡聚訟誰其瞻斗悟趨謂非妙蘊難窺異敏希遘哉茲介為和尚楚中奇士也慧根夙具英穎絶群甫髫齔時即受沙門戒行既則精進益力勤修罔間積十五六載喟然思所依皈杖策吳浙得天童密老人引而進之一經啓示矍然有悟頓參無上諦後為萬師入室真子允哉臨濟一派匪是莫歸矣久之功行日隆開堂演説人人瞻仰因主報國古寺舊緒賴以聿新則又師之有造于吳也今觀其所説語録書詩皆玄機邃旨為一切世間希有用宜登諸梨棗以作濟世津筏爰筆其事以辨諸簡端密菴李模題介為舟禪師語録目次卷首序文卷一上堂附挂鐘板齋單卷二上堂卷三小參拈頌法語入室機緣垂問卷四偈卷五傳書引疏卷六題讚自讚佛事卷七萍吟集卷八影堂集卷九松陵雜録卷十吳門雜録行狀塔銘
