body:
  text: 松陵雜録侍者照德記録辛丑十月二十五日為法門説師云古有學儒學佛者而有排佛排法者亦有謂選官選佛而言下知歸者蓋因夙植種子深淺不同固有信與不信而各善其本也唯六祖已下出臨濟曹洞二派綿遠流長所以代出傑人道明眼正宗風不墜也一時士大夫傾心仰慕不可枚舉至於見道明心師師授手機緣載傳燈録以垂千古模範絶非泛泛之流也秪如靈巖檗菴者據法門禮當姪輩前晚至夜扣門投宿知客相通謂某即熊魚山也彼時山僧對知客説不管魚山檗菴以禮相待知客遂安排夜飯食畢即送安單次晨粥後知客引檗相見及入門便云某在途中於禮有所不周恐輕冒和尚云云山僧答云不必太謙檗隨作禮一拜起云某有小事云云便出時山僧見彼倉忙而去意甚有不然稍頃知客回謂檗菴師云我們三峰家法叔不受法姪禮的與天童家不同有靈松法姪者亦同知客送出遂云這裏和尚向來法姪輩俱不還拜於是檗唯唯而去山僧聞此語不覺撫掌一笑將謂魚山是個人原來器量只如斯耶向聞他為明朝極諫一時頗有聲名及為僧又承嗣靈巖以紹佛祖慧命可謂學佛學儒而選官選佛之名位兩全矣豈料只可聞名不可面見既擔當法門自有法門名位而何以法門眇視自欺乃爾耶如若粥飯主人賓主之禮尚不可忽況法門乎既爾氣岸踞傲亦不該入山僧之門既入山僧之門必循法門之禮詎可謂天童三峰家禮有不同乎三峰豈是天童家之外人耶汝或放不下一頂紗帽原去做宰官何得偷生于法門而亂法門之禮耶罪莫大焉山僧不是揚人之過切要人知過必改毋致法門陵替而罪歸任法之人也傳云人能弘道非道弘人而今而後高尚其志者幸各勉旃壬寅花朝慧劍禪人乞語歸南嶽結茆懸智慧鏡鑒當臺邪正握金剛劍截岐路葛藤須是個漢方許恁麼地去慧劍禪者係湖南茶陵州人中年忿志詣吉之禾山剃度受具篤信向上一著誓欲遍參知識究明大事因緣復往楚之衡州見有中國清寺荒涼之甚意有感發固營造殿宇恢張功畢即延某禪師開堂自一衲飄然歷吳浙參龍池報恩靈隱天童靡以本分事叩詢雖未獲棒下翻身作風顛而亦有所益焉茲過海雲丐余數言歸故里以全誅茆之計山僧欲書語恐返鈍慧劍費磨礱也不見昔日郁禪師過斷橋有省作偈云我有明珠一顆久被塵勞關鎖而今塵盡光生照破山河朵朵如有問慧劍索明珠者切忌當鋒者喪示施秀峰居士大凡學道人要立心堅猛如開荊棘林相似手執利器直截向前毋令退縮始到平陽田地方得縱橫無礙有何拘禁念佛參禪的亦須如是參念到情盡念斷時即此看看是阿那個念佛參禪秀峰向這裏下得一語他日閻老子見你倒退三千里有分如若未然且看念佛的是誰參與莊汝揚文學書前月冒暑敢煩起居深為法門金湯銘感七月初間偶拈筆草瀆懸望頒示竟付不聞且疑焉孔聞拈香一端姑謂衆居士之請至于私竄藏板紊法悖常其罪難逭即曩歲先老人去世某因燕旋兼程抵山辭世才七日群議紛紜衆同門固以先人末後事委豫種種跋涉而不辭畏者振先人後事整法門紀綱不惜了身力任之苟若悠悠兩端何以主持慧命乎叨大檀現身護法敢向披衷也即前荷體泉衆居士勉從老居士之愛姑為暫止如掃菴者道義相孚跂仰良久不謂今日遂至斯耶若以私奪公以邪亂正不過枝葉敷衍一時到底水落石出難為識者哂縱孔聞一孽鬼馘作活計自有法門綱紀在所可惜者拖人下水一時正人君子有被瞞頇古云識法者懼寧三思毋忽為上因山衲素欽門下望隆山斗為正法墻塹固冒昧重言于長者之前少救一時之眩惑緇衣之好雅有同心幸祈鑒原山衲幸甚法門幸甚示碧雲天維那業儒者必言行相顧學佛者須內外一如所以儒釋之道不易言也學佛的人要説到行到者甚難見道的人要化道了道者亦不易説到行到名行解相應得之於心應之於外始終內外一如方合道化于世謂言行相顧又豈離斯之外耶自天童師翁力振宗風而諸方遍播雖盛衰一時獨欽人心有所慕爾近來參學之士賢愚類雜識見偏枯飾於外者邪正不分朴於內者聞閲不廣固爾高下相持門黨各立護以冷熱爭勝我山堆積至于是非紛紜慨不足惜也碧雲維那當持此為戒云他日龍天推出則頭正尾正不得謂山僧辜負汝也至囑示楚珍全知客船子朱涇三十春功程不計釣金鱗海雲住在吳江濱來往師僧暫寄身欲效渠儂重整綸只恐波清魚不親魚龍最喜桃花伸禹門一躍力精神凡物鎔質變化新安能學道不師真齊賢三省思古人超群拔萃作梁津臨濟一喝全主賓楚國慈明神鼎珍今將此語書楚珍記取歸家莫浪陳示恰安定知客誅茆打點身心要住山把茆蓋頭不等間習氣銷鎔情識盡方能透脫死生關古來學道士英傑道不齊名身不還昔日勇公禮雪竇後果聲鳴震宇寰彼乃丈夫我亦爾子當發憤莫辭艱住得十年草年去寒巖枯木香千般若問深山何意味一聲啼鳥落花間示且憨溶悅衆學道無難易進趣要心堅離卻文字解力攻鐵橛禪所得如轟電明暗見不偏掀翻葛藤案截斷衆言詮如大象搏兔若龍戲宛蜒能具是德量鑑物義了然所以香嚴老機忘擊竹前桃花靈雲見洞徹妙中玄理事融如海方棄到岸船若還窮未盡勤篤細鑽研朝參及暮請必須匹古賢且憨持此語將去養成羽翼鳴沖天冬日贈虎丘鳧溪雪鄰關主書大經雪點梅花寒裡香松風水月映交光竹林日影搖蒼蒼四壁溪流濬眇茫孤峰高矗浮圖幢百千座繞須彌王五十三參無厭狂百城謁遍豈尋常善緣惡境心相忘樓閣門前彈指郎絶境絶鄰開士房爐煙篆起雲飄揚明窗淨几展奇章翻閲妙義不可量手捧目觀誦未莊濡毫蘸墨寫珍藏功完擲筆破關墻好將聲振海雲鄉寄贈開迷禪碩居不厭塵囂溪蘋供自饒蓼莪吟野興貝葉誦餘朝柳繫雲山闊畦攤稼穡遙間情狎鷗鳥豈許尺書招秋冬交際落鄉收成苦雨欲供十方雲水餐喫辛苦處要心寬都言浪子偏憐客誰想臨身事事難思春景況林豐富入夏炎蒸汗不乾一尺青禾長沒岸十分兵餉逼交官指望秋成辦國課忽天作陰風作寒三日五日雨連綿滿田枯稻水面攤焦心柴米兩增損男婦煎愁睡不安如若延遲加霜雪腳凍皮穿眼淚血傷豫傷豫不可測徐仲達居士因事索書以自勉人之喜兮如春風春風悅意情愈奢人之怒兮如秋風秋風一發林木殺殺木聲愁心且悲思春猶意未足觀一念思欲如夏火夏火炙物顏色墮誰知欲火毒如蛇穿骨入髓總不惜直待火灰冷如冰蛇始化形無蹤迹仰天一笑頓豁疑此段景界孰得知説與君兮君自持簡雪廠禪師公嗣法古南向居越州恢復寶掌別業適歸南麻明慶寺有楚行之意而靈松首座者系公法胤因省敬故作此寄以為贈一株大樹本同根千葉芬芳蔭地森實落秋風成太白花香春谷布南岑山開古寺通明慶筆吐新聲振越音倘若乘帆如楚國暫停船子話傾心因託院事後述懷偶爾乘帆入鬧廛雲開風月到庭前寒期細火生幽戚日逐長波浪息肩幾問深山何處得徒看要路往淒然非干檀度門高迥愧自無能道力全壬寅仲春步西郊外過顧慎所園看西敷海棠共本數十根似虯旋藤抱可羡雖閲其多未見此之奇異也遂書以為記云海棠花有名多種巧質無如此樹嘉盤礡清香懷遠義枝枝笑若醉扶奢祝琴川新塔法叔浮石老和尚七秩慶值春光華滿林香風吹舞奏新琴浮屠七級然燈座法鼓三槌獅子音化道源流宗濟北芬芳譜集鎮虞岑掀翻海嶽傾天際留得聲名萬古欽題畫層巒疊翠壑流泉徑入深林別一天倚杖憑欄何所思莫如歸去問陶潛謝徐松之見訪并贈冒暑徐君子輕衣過海雲交遊身立正選集目超群剪翳空花盡舒襟茅塞焚經綸堪載國天不棄斯文過介嵩禪友靜室書贈村居不遠郭西疇五水源歸三萬流春到庭園香草木雲開桂嶺詠清秋雨移竹圃泥疏腳晴種梅林雪點頭只有這些風味別何妨山市亦輸籌贈蘇門沈居士桂子香飄下碧天門開洞府紫雲還絲桐韻疊頻生指鸞鳳雙鳴并集肩芝酒不辭歌永夜斑衣寧醉舞長年為憑海嶽春常載偕老同登陸地蓮送浮老人復住報恩過湖泊快風閣登眺登閣風停快移舟水浪平載歸僧寺晚夕火起鐘聲送破峰法姪返芙蓉同門有三十三人芙蓉棒下徹風顛三十三人繼後先勘破諸方歸去也小廝兒在別峰前示盛文學參禪馬師一喝大機用賺得兒孫天下奇寄語松陵盛居士也須照顧兩莖眉寄仲達徐居士思我浩然已白頭憶君四十正青秋三心不得明宗旨一貫研窮入聖流世幻多般間伎倆人生倏忽夢莊周好將平昔情繁緒盡付東淵水上漚上元夜寓萬松菴觀風俗作暖氣梅方吐晴和燈節佳田蠶燒野岸鑼鼓鬧官街雜綵排昏眼新聲散醉懷一輪當宇宙到處見天涯慕雲凌居士七十書贈公五男一女二三子在庠世間五福壽為良難得如君五六郎泮府雙名標姓字蟾宮獨步繡鴛鴦和風滲面春波長蘭酒傾樽滿苑香惟願老翁年登百快來入我選佛場嵩月禪者為衆打供未就遂返靈隱惜爾之作子乃舊門第為僧靈隱寺青姿割愛緣剋苦身當事喜同里若初禪友話懷兼送別十六離親向陸沉看經霜雪老來侵位尊道德生皇愧禪學詩書感慨深欲罷法筵歸晚計幸豫桑梓聚談心聊將邂逅燈前語猶作家山送別吟寒雲禪者同師暨弟居靈巖久適過海雲敘舊欲返里故書此送別適晤滄桑沔水音誰知老幼昔何今秋空雁落撩虛影霜結冰寒禁客心兄弟曉行輕似葉師徒夜集重如金靈巖法社膺居久調弄同聲過別林題琴川圖城環橋鎖樹頭峰峻谷泉奔下碧空坐愛青山藏屋裡間邀明月拂絲桐拂水岩虞山頂玄帝宮前有河一似龜五似鶴飛朝故有龜去鶴來之景云五鶴迎龜去懸流落澗深轉添春雨勝風逆拂千尋題金溪松石圖岩石玉生光耀碧清溪金色漾流中雲煙霾壑泉聲隱千尺寒松落澗風朱尚鄉居士索題慶餘圖邃谷幽藏迹喬松鶴引年林清渾世外坐寂幾塵喧危石傾雲雨晴嵐秀碧天最深人罕到宜老地行仙懷黎川隱峰禪師相謂黎川北幽然別一居誼風懷古道節操益欽餘問故清溪月翻新案上書不將玄妙旨輕忽許躊躇示定遠尼既為佛子當報佛之深恩始不負出家之志汝前日過海雲丈室之中老僧詰問汝本分事汝遂跪求開示老僧便棒云還會麼汝適擬議老僧又棒云擬議即錯知此一棒落處便識得汝未生已前本來面目亦不枉出家不然終日茫茫無本可據非但虛過日子亦只與為衣食輩者無異也及至一口氣不來又向甚處安身立命所以出家乃大丈夫之所為汝既出家可謂女中丈夫於二六時中貴要發明自己心地必須參究父母未生前阿那個是我本來面目若果驀地冷灰裏一星火爆管教照天照地去也直饒到恁般田地正好海雲來喫棒定遠試道道看正所謂把手牽人行不得惟人自肯乃方親毒機法姪索偈歸里掩關子是邗江家裏人幾回踏破嶺南春而今歸把關頭住不落機前出異群癸卯七月草日計甫草居士四旬書贈四十君初度中元候五辰桂香秋夜月桃實洞天春但得安間法何愁不老身清心寧致遠濟世若為倫中秋夜懷普峰道兄晤別廣陵道相安數十春天涯知己在白髮逐時新葉灑秋紅雨雲開桂玉輪徘徊翻憶昔遙致一函陳示淨眉侍者參禪人莫間散清淨心田休汙染撞倒銀山鐵壁墻孤峰獨露無拘管此時節丘脫碗一擲聲傾頓豁眼識取渠儂真面目竿頭進步翻身轉贈西歸主人雪鏡禪碩一天風月自西來雲水歸帆向日開萬頃湖光涵野色雪中香徹鏡中梅贈丘玉臣居士傳得岐黃玄妙訣援生不倦最精神慣將一點針頭力扶起人間痼癖身與朱使君子葵居士曩者牧其師寓鶴洲過詢承留齋擾謝屈指幾經寒暑而懷想神如左右也戊戌夏送龍池先師語録板入藏曾具柬躬叩聞尊體違和故弗再造齋事之畢遂返毗陵嗣後掃菴有左議之釁欲晤子蓉令弟傾悉始末尚緣慳未獲其面遂以柬致老居士深知楞嚴不忘令先司寇弘護之願力迄今耿耿得施玉峰詢咨清勝之極每念真如浮屠若非大力量人之綱維詎能得文筆插天卓然遠近欣慕即檀護不朽之觀欣羡茲玉峰之便敢附片楮訊候起居拙録附上幸原弗備代浮老人哭徒孫曉宗兼和諸什弦字韻人影去蕭然虛虧月上弦徘徊看白髮啾唧喪青年桂子香飄落雲開露滴憐輕歸生死路何事怨蒼天瑞遊圖雙親真於圓光之中几供經卷瓶花茗碗手輪珠對坐馬某索題遂拈筆書云長者師仁閨閣以德夫婦怡然花賞茗啜經卷勿開而自誦串珠不念而自徹真耶影耶問子瑞遊即得觀音贊坐磐陀石無説而説具滿月相內徹外徹欲識渠儂真面目大千沙界波羅密讀黃山谷作士大夫食時五觀文注食無求飽居無安儒釋何曾有兩般千古法言垂不朽九思仁者重如山斷指法姪復濟祖塔募興化寺殿宇書此為贈擺脫金鎖獅子爪牙全露掀翻海嶽滹沱浪激潑天普化鈴聲棺材裏何常搖空小廝隻眼瞎驢邊幾曾滅卻一句三玄要驗盡龍蛇兩喝分賓主歷然堂奧一旦毀沒沙積雲封裔尋荒迹劈空殿宇維新鑿石敲磚特地塔峰影豎報恩門下産麒麟魏府興化昂頭角克家之子脈洪濟北以憑公驗墨券昭格力肩祖印劈荒丘掘得真身寶剎浮從此門庭光顯達喝風棒雨幾時休隨筆書示破愚副寺秋葉落楓林黃花泣露吟長空鴈影去窗下喜無聲示持珍尼律云比丘持身菩薩持心經云受持者是持此身心得不懈怠而精進道業珍者若世之金玉珠寶五穀之屬為世之所重不論貧富貴賤僧俗人等必假以滋生而長養色身堅成世業并證無上道果號持珍者意義珍重之諭也經云三千大千界珍寶滿其中味此則理貫精粗性通物我於世出世間之法鎔成一片即無一法不是珍寶無一法不是自己乃至動轉施為拈箸放碗無不是本地受用本地風光即此圓淨盡底何妨聲色堆頭著眼百花叢裏安身然雖如是直須持珍信得頑石點首方自甘喫海雲三十棒始知佛法不作人情囑拙安逸監院傳持佛祖慧命貴乎心明眼正然後潔身行道而又要嚴己恕人自爾揚名於後世如若苟徇利養附物緣情非但現前聲名不振亦乃玷辱宗風而立身何級夫思前必顧於後是則其過鮮矣海雲拙安逸監寺者參歷叢林雖年茂而志向可畏遂書偈勉住山他日龍天決不負爾偈云佛法當年不易求九旬腰雪鑑千秋傳持衣鉢大庾嶺建立宗風濟北流豁達門庭玄要祕縱橫照用主賓酬元弘祖道楊岐老傑出叢林南匾頭掃盡葛藤禪一味接伊正脈繼吾儔為靈巖繼起儲禪師壽兼致謝伏以靈峰獨秀迥出春林雪嶺叢芳香飄異國恭惟繼翁法兄和尚慧日和光智燈炳焰台宕德聲五百座中不啻隔江招手浙吳風韻千人石上寧殊就地點頭玄要宗開鄧尉桂香風繞琴臺湖海雲籌共集川流信祝咸臻曩承香供於證心堂上銘刻不忘茲期恭詢於崇報室中有懷靡及幸逢趙老百二羲甲初周聊獻一芹稍申積愫甚愧菲褻仰冀莞存臨楮曷任屏營之至贈五祖寺聖揆法姪白蓮峰下一花開五葉芳芬百億胎千丈岩前凡聖路三更衣鉢繼西來因行者彈燭煤燒衣口占彈燭燒衣恐著身忙將冷眼謾吹塵橫拈一擲拋空去隨地連風掃臥雲贈寓菴禪者昔年曾躍禹門浪平地升騰頭角昂吞吐頷珠全意氣潑天雷雨沒遮藏示從聞侍者從聞思修不墮有無言言見諦切莫塗糊送碧雲天西堂歸楚住山離楚遊吳三四載海雲得意便歸家一帆高挂長江去快捉南山鱉鼻蛇毒殺岩前瞌睡虎兒孫腳下遍天涯甲辰春因恙幸陸允培居士得瘳遂索偈以為日進自勉不偏識見如春雨萬物承滋枝葉繁大小根莖芳潤色花香草木長林園心空要破玄關語境寂誰存解悟言但得時中無間斷菩提場只在塵喧示破愚副寺破愚不會禪一味氣性蠻如人觸他怒衝倒一邊天牧頭水牯養成彪耕熟山荒曠野田有人問道棒三十沒奈你何祕莫傳際門實侍者一日自霅往昭陽省師宿海雲偶晤近文孫勉送歸里仍往師所喜其誠孝有始終遂書偈以記其志往返苕溪路昭陽復問津迢迢水國去何日帶歸雲示蘭先禪人幽谷蘭香正是時春風吹遍壓梅枝聲新鳥語呼林緑先到人間叫畫眉過雪溪菴訪本潔禪師溪環翠繞一林幽雪裏梅花香白頭佳色滿庭空界月照人不倦亙千秋宿雪溪遊沈氏北山草堂有九株剔牙松甚奇平原空谷雲堆巧卓立峰頭翠點奇家宅奕居元宋樹草堂題筆大名詩九松挺秀凌霜雪三徑蹊斜下碧池坐久渾忘歸日晚濤聲聽落北山遲可微禪者昔披剃天童密師翁座下追隨白雲歷有年矣癸卯冬過海雲詢豫豫留度歲一日持紙索住山語遂拈筆述以為贈云曾經嶺過鐵蛇關只為尋師太白山陰蓋亭中肩可歇鉢盂峰頂路微攀法求斷臂當年切道歷深心此日間鄭重堂前親鏟草破砂盆子債須還復吳門報國寺衆護法恭惟王臣從靈鷲而來渾身覺海居士因法華再現獨印心宗上國咸賴金湯三吳允瞻光焰愧無文章難作闡揚之口況多野僻徒抱面墻之形適承符命甚慚協舉一橛禪非云自了懋老人恐其哂之惟大方盡吸西江致樗林追隨百尺不獨宗律有同源之慶而佛祖擴慧命之傳矣謹此復奏不宣恰安定知客請喫密翁棒毒煞叢林氣鱍天會得三更日午打掀翻千七葛藤禪單開一隻頂門眼慣用通身掉臂拳勘破也個生緣邈他不值半文錢
