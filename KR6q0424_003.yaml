body:
  text: 門人海鹽益證等編小參為紋菴對靈小參師云今朝七月草七大事因緣了畢生死本無去來聖凡兩途不立既是聖凡不立即今紋菴道者向什處安身立命不見道有物先天地無形本寂寥能為萬象主不逐四時凋若也如斯薦得則生不以生為樂死不以死為苦然而苦樂無拘是名脫生死去來之相也良久云信爾深心親領略一念回光明歷歷小參師云根塵體殊性本無二緣名緣相爾現爾前離空離色靜極光生所以陰極陽生而萬物發萌則春榮夏茂陽盡陰施而群芳落豔則秋歸冬至年往月來故有輪轉遷流之變若男若女執質緣生故生歡死畏是乃被生滅之所繫也佛性場中纖毫不動有什陰陽奇偶所變有何男女生滅所從塵緣剎海自性朗若杲日獨露真常當下豁爾圓明且道超元陸氏即今向甚麼處安身立命赤體條條無罣礙蓮花藏海任悠遊喝一喝下座徐仲達居士為大郎屺瞻請小參師云百千妙用自他不隔於毫端十世古今始終不離於當念驀豎起拂子云徐屺瞻還見麼汝還知自己靈明之性麼此性如水底月若空中雲雖有現相本體常存實無污染汝因妄想緣合忽爾打個筋斗向徐氏門中耽閣一十七年既謝此夢幻之軀正好向無生國裏逍遙自在不復更向恩愛中著倒老僧為汝一一分析了也更聽吾偈曰十七年來童子身一翻遊戲走紅塵從今割斷恩愛索不復相牽父子情除夕師云烹露地白牛分歲此是古人的家風南湖今日亦不與諸人分歲且要與諸人索取露地白牛汝諸人莫有不甘服者麼如無恁麼又截汝諸人命根去也設有貪生畏死者試出來與木上座公斷看時一僧出衆欲禮拜師以拄杖止住云汝莫非是個當地賊麼要來偷取露地白牛的蹄角麼快快招供免得鞭考教你有氣也沒處出如若不招只消一棒管取你見黑面老子去僧遂翻身便奔出師驀招衆云看看這僧供狀了也諸人還見麼贓已獲了賊亦去了秪如分歲一句又作麼生道正所謂好手手中呈好手紅心心裏中紅心遂拋拄杖歸方丈拈頌臨濟示衆云我在先師處三度問佛法的的大意三度被打如蒿枝拂相似如今更思一頓誰為下手時有僧出云某為下手師拈棒度與僧僧擬接棒師便打拈云臨濟迸富連貧罄家一蕩猶向百尺竿頭弄線卻令者僧才擬搆望便與捺倒雖然未免殺人犯手被這僧忍行苦肉誰知臨濟直至而今遭人簡點頌云子承父業自為家不賣靈龜賣鱉蛇特向人前輕一擲遭他毒氣眼彌麻烏石靈觀禪師因雪峰來參敲門師云誰峰云鳳皇兒師云作什麼峰云來啖老鸛師便開門搊住云道道峰擬議師便托開閉卻門峰住後示衆云我當時若入得老鸛門你這隊噇酒糟漢向什麼處摸索拈云烏石豈但把頭收尾亦善回風戰將若非頂門具眼爭見雪峰氣急直饒住後恁麼告報未免上人門戶著賊頌云打鳳羅龍手自高放收力不費纖毫雖然靈翮縱橫去未免投林惜羽毛陸亙大夫問南泉天地同根萬物一體云云拈云大夫雖是個俗漢也識得肇公只是未會天地同根萬物一體王老師縱有機關猶似開眼說夢頌云風吹水面千層浪月照山河萬壑明步步緑陰全體現踏花歌舞一身輕洪州寶峰和尚因僧參師云其中事即易道不落其中事始終難道僧云某甲在路時便知有此一問師云更與二十年行腳也不較多僧云莫不契和尚意麼師云苦瓜那堪待客拈云寶峰雖則撥火撩風其僧不合向路中探人虛實當時待峰云不落其中始終難道便與劈脊一拳且看者老漢向什麼處開口頌云其中事即易白紙個個書黑字不落其中事難道長安路上馬喫草出征將軍誰敢當弦響應落天邊鳥行腳草年不較多苦瓜待客知音少黃檗示衆云汝等盡是噇酒糟漢還知大唐國裏無禪師麼時有僧出云諸方匡徒聚衆又作麼生師云不道無禪只是無師拈云汝等盡是噇酒糟漢還知大唐國裏無禪師麼腦後見腮可惜者僧不識語脈便向他鉤頭上竊餌被伊掉轉風帆直教大唐國裏嘉聲獨布頌云老年無事太風顛舞上高樓索酒錢忽把面皮輕勒轉猶敲花鼓唱樽前阿難問迦葉世尊傳金襴之外別傳何物迦葉召阿難阿難應諾葉云倒卻門前剎竿著拈云阿難雖則特地風波迦葉不妨順水放纜兄呼弟應有來由還知古人落處麼頌云金襴之外復何傳一語分明不二言直應剎竿隨倒卻豈容蹤跡到門前僧問葉縣省雪山童子捨身為求諸行此行如何師云掉臂街頭走仰面見青天云恁麼則迷人尋著向城路也師云此人入地獄萬劫出應難拈云不是弄潮漢焉能水底行頌云醉人扶上酒家樓口裏喃喃話不休驀地燒身一把火始知痛徹入心頭臨濟上堂僧出禮拜師便喝僧云老和尚莫探頭好師云你道落在什麼處僧便喝又僧問如何是佛法大意師便喝僧作禮師曰你道好喝也無僧曰草賊大敗師曰過在什麼處僧曰再犯不容師曰要會臨濟賓主句問取堂中二禪客拈云臨濟老老大大卻被草裡蛇驚二僧雖入虎穴未得虎子還識臨濟賓主句麼兩彩一賽頌云春到黃鸝樹上鳴一聲啼罷一聲賡由來只許知音辨不是知音莫浪評保壽開堂三聖推出一僧壽便打聖云恁麼為人非但瞎卻者僧眼瞎卻鎮州一城人眼去在壽便歸方丈拈云城門失火殃及池魚帶纍這僧直至如今受屈我若作保壽又且不然當時待彼推出者僧便歸方丈管教三聖一場懡㦬頌云逆浪長風勢潑天漁舟久慣不愁顛一聲歌罷歸家去載得清光月滿船三聖云我逢人即出出即不為人興化云我即不然逢人則不出出則便為人拈云一個行處不見人一個見人不留跡且道二老還有優劣也無具眼者試分析看頌云風來樹響水高船長出入分明影不孤向深明二上座同過淮河見牽網者魚跳出深云俊哉恰似個衲僧相似明云雖然如是爭奈當初不撞入網羅好深云明兄你猶缺悟在明行數里至中夜方省拈云同行無疏伴話裡有知音俊哉恰似個衲僧相似好與三十棒何故奈伊向境上作活計明云爭奈當初不撞入網羅好亦與三十棒為什一釣便上明兄你猶缺悟在雪上加霜行數里至中夜方省醉後添杯介上座恁麼據款結案且道端的在什麼處頌云俊哉一躍逼英豪引得漁翁趁落潮急水灘頭流不住令人中夜恨方消韓文公一日訪大顛和尚問春秋多少師提起數珠曰會麼公曰不會師曰晝夜一百八公不曉遂回次日再來至門前見首座舉前語問意旨如何座叩齒三下及見師理前話問師亦叩齒公曰元來佛法無兩樣師曰是何道理公曰適來問首座亦如是師召首座曰是汝如此答否曰是師便趁出院拈云昌黎老老大大春秋也不知大顛雖是本分宗師亦乃善呈巧手殊不知首座殺人不用刀活人不用劍致使大顛韓公伎倆俱盡頌云一日登臨探蚤春等閒杯酒醉官人天然骨格風流異不落宮商調逾清只使兩般三叩齒令教去路一聲新秪因為說從前事禍入東家及北鄰香嚴上樹話拈云香嚴上樹大似蟭螟眼裏打鞦韆虎頭上座善能向龜毛上見數雖然如是未免笑殺傍觀頌云機關施設逞英雄命在懸絲路不通卻被虎頭輕一拶轉歸深處笑春風僧問南院顒萬里無雲時如何師云飢虎投崖拈云者僧家窮計盡向人覓碗南院肘後書符善移星轉斗殊不知被者僧看破頌云晴空霹靂打枯樁拽倒攔門破草房喪盡家私身萬里不留雞犬落平鄉晴空霹靂打枯樁一火燒空萬里荒飢虎投崖全意氣風生山勢長威光萬里無雲瞥地荒忽逢飢虎爪牙張進前莫問歸家路直下翻身去不妨風穴禪師因僧問語默涉離微如何通不犯師曰常憶江南三月裏鷓鴣啼處百花香拈云其僧雖諳音律慣弄琵琶何如風穴老漢等閒一曲鷓鴣辭致使渠儂聽轉深頌云遊人唱出陽春曲仙子猶將白雪歌曲入歌聲聲入耳直教織女也停梭大徹底人本脫生死為甚麼命根不斷拈云且道高峰大師命根在甚麼處若簡點得出許伊具隻眼頌云東風迎笑寒香足野鳥翩翻上樹頭叫得深閨人意惱一聲聲聽轉風流外道問佛不問有言不問無言世尊良久頌云一陳幽香入畫樓令人直下豁雙眸迷雲忽捲千峰淨良駟追風影不留雲門大師云聞聲悟道見色明心觀世音菩薩將錢買糊餅放下手來卻是饅頭頌云不在目前亦非千里上大人丘乙己德山托鉢因緣頌云托得鉢來貓叫屈低頭歸去鼠遭殃子陳父過揚家醜弟揭兄端話短長末後句異尋常密將意啓更郎當張三李四呵呵笑八十翁翁哭斷腸將頭不猛纍三軍禍及私門千古評末後句絶煙塵殺人刀劍血淋淋果受記活三春更加一級令重新雲門乾矢橛話頌云如何是佛乾矢橛情見衆生忙不徹天上人間沒處尋花街柳巷與麼得僧問趙州如何是西來大意州云庭前柏樹子僧云和尚莫將境示人州云老僧從來不將境示人僧云如何是西來大意州云庭前柏樹子頌云趙州老子白拈賊將境示人何太拙又謂不將境示人誰知一片婆心切境示人是何說可惜春庭一院花遊人看得眼流血百丈野狐頌云不落不昧自全身一句明明當下傾海自宴河自清依前日午打三更南泉住菴一日被僧打破鑊頌云住菴日久戶常開忽地僧來打破鑊不是冤家不聚頭也要舉似話流布話流布南泉住處君休住黃龍三關頌云我手何似佛手任爾點胸點肘伸出一雙拳頭塞卻沒量人口我腳何似驢腳擬向甚麼安著蹴翻大海無蹤令人喜怒哀樂人人有個生緣吟風弄月目前一任呼驢呼馬從來骨格天然臨濟三句頌云舌根未掉虛空𨁝跳驀地相逢烏雲染皂一撾毒鼓聞者俱死南山起雲北山下雨春至柳青把酒上墳黃金萬兩火裏翻身藏身處沒蹤跡沒蹤跡處莫藏身頌云十字街頭尋不見虛空眨眼黃金變沒蹤跡處莫藏身南北東西雲片片電光爍破迦羅眼芍藥花開菩薩面菩薩面說與君兮君不薦溈山水牯牛頌云溈山杜口強安名道是牛來又是僧兩號一身橫古路分明頭角自獰猙衲僧得一合作麼生頌云衲僧底事一何收出入行藏始自繇荊棘林中渾無事百花叢裡任悠游陸亙大夫舉天地同根萬物一體南泉指牡丹云此花如夢相似頌云大夫無事生事南泉眼裏著刺道甚庭前牡丹依然如夢相似古澗寒泉頌云古澗寒泉流到嘴邊買賣交易看貨還錢苦的苦甜的甜雪峰趙州舌頭匾修山同地藏法眼論天地同根萬物一體頌云天地同根萬物一體兩兩三三話短長咄瞬目揚眉的不是你那臨濟栽松頌云關頭把住難開三钁縱橫無礙鼎林千古宗風噓聲遍地若雷趙州勘婆子破頌云趙州勘破臺山婆笑話一場天樣大歸去家中忙舉似誰知倒被婆勘破天王道悟禪師常叫快活及臨終叫苦頌云兩面三刀說秦道楚常年快活臨終叫苦何以故苦苦苦苦苦只許漁翁破浪歸行船又被逆風阻瑞巖主人翁頌云主人翁惺惺著向後莫被人謾卻一一叮嚀報與君休把南山當北嶽打牛即是打車即是頌云起手加鞭車牛齊走語話甚分明舌頭不出口僧問玄沙如何是親切事師云我名謝三郎頌云親切底事如何舉揚覿面提持無覆無藏向日江頭垂釣客今知原是謝三郎牛頭未見四祖時百鳥銜花見後為甚麼不銜花頌云富貴招他賓客往貧來猶恨一身多慈舟不泛清波上劍峽徒勞放木鵝風幡動頌云不是風幡動風幡動是心當時盧行者錯認定盤星破沙盆頌云隨拈一個破沙盆蓋覆乾坤絶點痕脫落家私無向背那堪殃及纍兒孫太白峰頭獨露身氣吞寰宇播乾坤破沙盆子輕拋出塞卻如來正法輪法眼指簾頌云傑出叢林老古錐驀將簾指許誰窺直饒會得清涼意未免遭他腦後槌文遠禮佛頌云文遠心直口快趙州無端捏怪獅子咬人韓盧逐塊百丈惟政禪師有老宿見日影透窗問師云為復日就窗窗就日師云長老房中有客歸房好頌云窗就日日就窗和聲報有客歸房等閒一句分賓主收卻相思淚兩行巖頭共羅山尋塔基次到中路羅山忽然喚云和尚頭回首云作麼生山以手指行這裡好一片田地頭喝云瓜州賣瓜漢又行三二里歇次羅山禮拜問和尚豈不是三十年在洞山來又不肯洞山頭云是山云和尚豈不是法嗣德山又不肯德山頭云是山云不肯德山即不問只如洞山有什麼虧缺頭良久云洞山好佛只是無光羅山便禮拜頌云花逆春風十里香令人歡處動愁腸句中意言中響田地一片瓜不長只使瓜州賣瓜漢一稱稱去十八兩因禪客舉一官人問海會憨璞娘生褲因緣璞答語官人舉似禪客客與官人俱不肯海會語故為頌云娘未生時褲一條等閒拾得便穿搖私偷出賣官酬價寧死公堂話不招法語付楷生鹽公法嗣源流佛佛授受祖祖相傳本無鉤章棘句奧語奇言秪要洞明心地見徹骨髓如南嶽讓授馬祖一一授百丈海海授黃檗運運授臨濟玄玄授興化獎獎授南院顒顒授風穴沼沼授首山念念授汾陽昭昭授石霜圓圓授楊岐會會授白雲端端授五祖演演授圓悟勤勤授虎丘隆隆授應菴華華授密菴傑傑授破菴先先授無準範範授雪巖欽欽授高峰妙妙授中峰本本授千巖長長授萬峰蔚蔚授寶藏持持授東明旵旵授海舟慈慈授寶峰瑄瑄授天奇瑞瑞授絶學聰聰授笑巖寶寶授幻有傳傳授密雲師翁悟悟授本師萬如微和尚是也本師即授豫以上師承各各皆有機緣符合茲繁不録吁智與師齊減師半德智過與師方堪傳授若不爾者縱饒舌瀉溪聲身融山色總非當家種草今楷生鹽公乃閩梁浦人也耐盡風霜歷於業席忘形骸鎔聲色研窮宗乘究明實諦已有年矣獨嗟邪風之四起欲肥遁於山林翛然自適以了平生庚寅冬暮渡南湖過如菴訪豫丈室豫見其容儀骨鯁言辭入理因案頭有僧問古德云萬里無雲時如何德云飢虎投崖因緣令頌之遂頌曰天無四壁望無塵撒手懸崖豈顧身識盡蹤忘休覓處從教獵犬吠旁人豫頷之遂留過歲每於言中考論堪為法門高士復勉之莫作自了漢也故書源流一則拂子一握以表信夫將來耳付師貞長老嗣法偈并囑語舊號道覺師貞上座一日入室師舉古云恰恰用心時恰恰無心用作麼生是無心用貞遂下數語不契至次日早呈語云某昨承和尚逼拶夜不安席果某只到得者個地位今早方省和尚為人處真知子莫若父也師仍徵語貞云竹密不妨流水過師云未在更道云和尚莫埋沒人好師云你見得個什麼貞便喝師云你又強作主宰那貞禮拜便出故書付法偈并囑語云法法本從元法本無法付達此佛心宗無二無別故汝向拈天童師翁香已刻録行今復入如菴室者實汝不自欺爾既徹法源底此去宜保重深蓄厚養待龍天推出開鑿人天正眼續佛慧命是吾宗之所望也至祝至祝囑宗極維那證公釋迦老子四十九年談空說有亦似打草驚蛇末後拈花方顯正法眼藏涅槃妙心付囑摩訶迦葉始立教外別傳之旨原師承有據遞代授手以至達磨正法流傳於震旦一花五葉讖云金雞解銜一粒粟供養什邡羅漢僧出一馬駒踏殺天下人然而派衍五宗脈歸一致惟我臨濟大師突出頭地一喝金剛王寶劍直教斷人命根去更不用如何若何固爾唐宋以來代不乏人英靈群立各吐玄珠倒嶽傾湫一時聖天子國王大臣無不欽仰宋元如高峰大師死關三十年把住要津學者望崖退跡可謂寒香絶操彙萼傾姿三百餘年亦出我天童密雲師翁拈條白棒扶正濟北宗風佛來魔來總與棒棒到底致使談玄論要之士一見藏鋒結舌而履險驅耕不顧危亡直令人當下徹頭徹尾不幸師翁於崇禎壬午歲謝世以來法幢秋臨祖道隆替而獅隱狐鳴雖則兒孫遍地亦不免玉燕雜目良可慨矣近來一等阿師不以本分為人全向語言文字上作活計引些諸子百家五經四書或扯些莊老史傳以逞胸中學識富饒牢籠初機晚進鼓弄門庭鬧熱冬瓜印子不論是神是鬼遇著便搭圖其益盛如斯之輩他日閻羅王豈肯放過那不見蜆子和尚僧問如何是祖師西來意師云神前酒臺盤樓子和尚聞歌云你若無心我便休便悟去此二老何嘗以語言文字為印心印子來可為千古宗猷萬世遺範也今宗極維那向習教乘歷年叢席而堅志宗門果為己為人須兢兢業業寶重自器切莫向這般群隊裡效樣茲付拂一柄以表師承有據源流不謬他日龍天推出自爾鵝王擇乳實吾宗之所望也祝祝示吼如禪人參學之事無別貴乎真實老成古人三登投子九上洞山致於終身不變固有超群拔萃之風果為生死心切要在立志猛鋭牢牢卓卓挨拶將去忽然透脫如明鏡當臺無物不鑑到此田地始信毋自欺也邇來末運狂禪掠人涎唾哄騙人家男女到處成蹟殊不知一旦熱病臨身平日所學禪道佛法一些也用不著可不憐愍者哉吼如禪人行腳造方切為己躬下事豈作這般去就南湖亦不效諸邪師將無作有污爾清淨心田一味以實相告所以高峰大師云但得胸中憎愛盡不參禪亦是工夫咄喚什麼作工夫切忌道著示尼不違不違四歲出塵十七剃染雖忝質於閨閣之中而夙因猶當不昧深可為難得者也向曾親承龍池和尚示以固身之語客歲浴佛日復乞漏澤箬菴和尚為得戒師是時余居三師之列違今年已六十矣竟不被榮勢所奪而煢煢潔居堅心操道頗有丈夫之志古有總持今有祗園洞明心地各分燈續焰亦閨閣中人也不違雖未及古今超卓之輩而童真入道德行溫和居寒暑而動靜了然不生知耳順亦不為壽是不愧於有道比丘尼也示張道友十字街頭橫身紅塵堆裏著腳苟非其人焉能如是廣額屠兒放下刀云吾乃千佛一數石鞏禪師擲弓棄箭直下頓徹心宗由自大力量人自爾一肩擔荷順溪道友雖向鬧市中行住坐臥亦不見有人我衆生壽者之相更有一段過人頭處涉危險而能自持緣身塵而潔其行志意淳和言不二過食味惟蔬日以金剛經為課禮誦精誠閒忙無間雖居俗地尚能堅心奉道豈不是過人頭處耶幸慶知非之年將登五十而知天命也正所謂率性之謂道信不謬矣丙申秋入燕都笑祖塔前上供拈香云此一瓣香得非容易等閒不燒非恩不報非價莫酬爇向爐中供養我曾祖月心笑巖老和尚伏惟常寂光中眼光燦破四天下在遂插香復合掌說偈云祖塔翛然思可傷兒孫祭掃甚凄涼化緣已謝三冬雪離亂誰親一瓣香節概風高鳴帝闕源流的骨正諸方百花影落經行處深草苔封說法堂林木凋殘春雨露徑通雲水載秋光丁酉秋解夏制後復掃祖翁塔以拄杖指塔云大衆還知這老漢端由麼從此出從此入獨立孤峰等閒不與人謀曾向關子嶺打失鼻孔又入大覺圓老師室中脫落桶底呈個頌子云自笑當年畫模則幾番紅了幾番黑如今謝主老還鄉那管平生得未得復至無聞老祖處得個正心符子回入京南圓通寺裡道個狗走抖擻口猴愁摟搜頭皆是佛法道理端的又作麼生一旦露布嘉聲坐斷天下人舌頭賺得個溧陽釣背筋老古錐向荊溪龍池山頂興波作浪沒殺個蔣三爺爺登銅棺山頂伸出頭來識得情與無情等同一體拈條白棒打鳳羅龍扶正臨濟宗風煙塵絶跡瓦礫生光乃至六坐道場末後向太白峰頭又賺得個秀州張阿師仍坐禹門浪裏淹沒許多不唧溜漢不肖今日覿面相呈且道還許這老和尚著眼麼秪如明明百草頭明明祖師意又作麼生喝一喝云祖翁田地與兒孫寥廓虛明滿大地遂燒香入室機緣僧入師問云語默涉離微如何通不犯僧云統上孤危直下峭絶師云如何是統上孤危進云灼然無和尚師豎拂云這個聻僧喝師云且喜沒交涉僧禮退僧入師問云恰恰用心時恰恰無心用作麼生是無心用僧打一圓相師云卻有心了也僧遂展手師喝僧作禮師問僧云不假舟楫南湖如何得渡僧趨前三步師云猶涉程途僧云即今禮拜和尚遂作禮僧入師問云如何是祖師西來意進云鵲噪鴉鳴師云鵲噪鴉鳴時如何僧擬議師打云漆桶不快師問僧云父母非我親誰是最親者僧云今日日頭大師云與你沒交涉僧喝師便打僧禮拜出僧問云那個是某甲自己師云瞎僧擬議師掌云那個是你自己僧擬進語師又掌云放過則不可師問僧云九峰不肯首座且道首座過在什麼處進云一人傳虛萬人傳實師云你那裡得者消息來進云謾得阿誰師云沒殺闍黎僧禮拜師問僧云南湖興波不作浪你作麼生得腳踏實地進云今日不得作浪師云你向那裡安身立命僧頓足師拈棒僧拂具便出僧入師問云如何是不落依倚的意旨僧呈坐具師云落依倚了也進云和尚什處見得師云贓物現在僧便喝師云好喝僧又喝師云再喝看進云和尚腦門著地也不知師便棒僧喝師連棒僧連喝兩喝便出師云猶強作主宰師問僧云不動干戈如何得致太平進云干戈寧息師云干戈動也進云和尚在者裡恁麼師豎起拂子進云太平本是將軍定不許將軍建太平師云卻是汝不太平僧喝便走師云原來垂問未到南湖波浪滔天不假舟楫如何得渡已到南湖壁立萬仞作麼生得入理深談到與未到正在途路中好與三十棒且道是把住是放行
