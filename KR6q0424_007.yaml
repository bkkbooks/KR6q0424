body:
  text: 門人海鹽益證等編萍吟集詩和闇齋黃憲長寄龍池本師和尚韻大地誰親是我冤腳跟不動太平軒只憑個事開心鏡幾許閒眸入故園略彴踏翻空有句桃花笑破始忘言秋聲處處分明極擬欲尋思落正偏目前豁達本無他伎倆千般奈爾何亦不將心求解脫豈容雜念憶恒河分明差別猶相似簡點家私未較多一道秋光天際闊那須神力費功磨偶感徑僻西村岸隔東南湖恰值水雲通夜來月朗空庭際春曉鶯啼化外功帶露落花輕織女青林梅子醉溪翁衣慚荷葉風千古道媿虛名藝未攻為黃復仲居士壽辰值至節後一日陽回律轉振條風紫氣先呈翠閣中樂只放閒縱八極譚餘遊藝論三空梅花一度谿邊白桃實千秋洞口紅忽見西池降王母飛來鶴集素園東紋菴七十書贈公善琴畫問年成好事悅世喜從心弄絃恣白髮圖形異古今傍谿學老圃洗耳聽新禽歲首元三日松風慶上林劉渭公居士以仙乩贈空山曉聲別號命題林深日暖浴春風採藥仙人何處春雲到岩前渾不語水流澗下太從容輕攜竹杖尋丹灶緊峭芒鞋過別峰茆舍居無青嶂裡天聲曉發嶺頭松和𨍏轢嚴居士答劍門禪師送少林祖圖碑文韻法幢逝水振心寒譖譽門高道義懸朱紫易塗紅粉面是非難上祖師肩寧將直枉甘從事莫負公私獲罪天秦頌碑聲今日月不平劍氣為平傳為壽者書春木森森漸有香一枝嘉景向東墻看看洞口桃千樹柳帶飄颺鶴歲長為馥生師九月十八日壽兼預結大悲壇期林集鴻賓放白毫普天霜月鶴鳴皋秦溪道義風千里蓮社嘉聲第一袍三七壇中龍氣象百花叢裡士英豪春秋剎海無邊際日湧須彌萬丈高即事滌塵塵滌兩相宜惟有江流淨不知飲水谿邊嫌洗耳風高今古異堪師思移茆舍入深居竹筧支泉荷葉衣高尚水邊林下事不知花落與春歸贈決則靜主四月輕衣天氣和柳陰枝下看新荷登臨草綠春光普賞見花紅遍地多麥浪秋風林外景青香梅子樹頭窠幽栖別有通霄致雲鶴來兮黃鳥歌贈萬順泉善友三月林如蜀錦裝好將屏倚坐中央山童呼客來仙島鳥語傳聲送玉漿王母園陳千樹果桃源洞足百花香不知歲數經多少萬壑流泉一派長寄別子蓉朱居士向船居三月春將去猶懷草木香不知天外客何處是家鄉船居半船明月風帆穩一棹和雲水上飛快我平生無限意青山面面草新肥一灣流水一灣風逆順橫拖水面蓬山去岸回谿有意樹頭花落影投紅一帆天際水雲寬萍與溪山到處安閒過東風好時節且停篙櫓漫看看題扇頭畫兼以為贈塵事競紛擾水雲流不煩呼春林下鳥叫月嶺頭猿山靜杳蹤跡路平見道原空亭一個子若往向誰言和徐虞求盡節韻字石麒拋卻五車摧筆鋒心空及第始歸宗臨行別有風高韻贏得聲鳴夜半鐘六月霜飛劍倚天儒冠高掛叩深禪洞然劫火隨他去一片丹心勝白蓮寄上白谷音二開士庭花無語靜秋光野景支吾興味長黃鶴去非雲水事露清聲滴夜來香風前黃葉攙秋雨極目瞻光聽落谿寄語林間問道者莫教輕忽案頭題寄祝金剛菴上乘兄五十武林歌舞禁喧譁清味香烹趙老茶雲集松聲春二月望臨鶴髮頌三車芳庭日暖應先供景樹煙濃最後嘉愧我南湖風弗順短篇寄到夕陽斜代友和韻老邁林泉時一過商量佛法子無多排寒爐火燒松竹覆熱清涼長薜蘿結社詎能思惠遠安邦誰解問蕭何十年見別風塵士盡向山阿與澗阿喜臘雪驟積頃刻村城溶世界堆堆茅屋浪平田山家靜坐紅塵樂騷客添思野老眠一色寒光晴夜月凝空瑞氣應豐年春風漫作楊毬舞且看梅花笑目前旱暑感賦亢陽蠲滴禁流湍遍地嘉苗似火攢草木甦須霖雨潤魚龍躍必海門寬欽承鑑格蒼生願禱頃消除鱗甲殘若降平原三尺水一聲漁笛縱歌歡初遊龍池山徑曲橋三度山幽樹一林澗流芳草積鐘扣翠微深古殿晨煙靄龍湫夜月沉源長通濟北法鼓振雷音又畫師秋日邀登絕頂望太湖有感玉峰高出諸山小三萬六千頃未寬林落秋風天氣爽草枯春色雁門寒一聲角笛鳴江半幾點輕帆入炤殘圖畫不須描虎跡白雲崖下有龍蟠長泰寺懷古寺建自梁有六景記焉樹挽六朝煙烏去閒道者黃花空自愁梅子知歸也秋水颺波紋月到中庭野柏老霜雪姿堪盟歲寒社宿焦山月夜聞鐘蓬萊殿閣明如洗陡插層圍天際峰夜靜中流看去遠江潮浪湧聽來洶山清岫出雲生石岸斷聲沉月扣鐘欲倩畫工描此意那知又隔海門東崇禎壬午憶親有感并引予自天啟六年歲次丙寅五月離俗十月十一日剃度於黃安縣東林寺西禪堂屈指經今十七載矣昔年江上看龍舟倏忽光陰十七秋若不多生承願力那能易服入僧流癸未之楚省親遇流寇仍返金陵晤友有感十七伶俜吳越遊為親思省覓江舟一聲葉落侵墻腳滿徑黃花泣路頭劫火洞燃焚郡邑旌旗閃爍禁王侯輕身夜走嫌星朗說似長干人盡愁登天台山石門在大冶縣西南四十里未入天台境人言不可侵登山谿水隔問路石門深峭壁連雲闔飛泉帶雨斟我來樵子在話盡有餘心華山雨霽宿雨流香液晴巒黛色鮮澗聲翻石鼓清翠出松煙隱者依巖窟幽居別洞天中藏多傑士不與問秦川冬日閒吟朔風封螘戶冰脆落寒涓日澹山無色雲層水拂天濤聲瀉梵詠鳥語雜清傳撮葉頻添火煨爐宿晚煙為壑舟禪友壽佚志能超物明心豈在天忘情當事澹謀道得貧先臘邁非為老嵩高別引年閒將疏影探一度一春鮮和友雨過韻風來爽氣生雨長階前草雲霧捲晴空山頭色不老香從何處飄聲入耳邊好挈杖問流泉可曾傾嶽倒初秋樹下坐與哲生兄得句松陰招我論何事冷地難為話容心此去漫愁霜雪老西風一入鬢毛侵夜秋摘木飛聲早何人嘆所思半窗清影下一葉冷風吹月皎添涼氣蛩吟斷竹枝相看於此際金井落無私訪正可法師宿長泰寺揭目青山雲外峙幽林許我話知己杖頭不掛一帆風恐落溪聲輕入耳潤城生生菴送友兼別上林春事勝天氣逼人遊一葉江心去相期語未休夏日與哲生兄話別入夏見新荷籬疏補薜蘿問人林下少寄足馬蹄多道味風塵雜閒情日月俄與君在岐路何復論坎坷過西菴訪哲公同陳大田聯句偶爾來松徑逢僧秪論詩田與君皆亂世結社在今時哲茅屋三更夢江山一局碁師閉門花影靜鳥語落高枝田至廣陵有阻江南草木亂棖棖天老山荒戰馬鳴欲渡占風驚白浪投林空聽語黃鶯傾城豔色憐孤旅野岸塵沙擁去旌遍地牧童歌往事不甘珠淚滴秋聲送玉澗之京口一葉輕帆逆上流綠陰顏色忌江洲煙波直入蒼茫去何處風聲趁客舟寓秦郵懷平山公喜其即至知有黃花落更悲西風咽草木解其衣鱗甲藏於穴但見行路難來去無斷絕孤坐孰與言鵲弄簷前舌勤勤話短長不將名姓說忽聞犬吠聲想是故人瞥四顧村煙靜兩岸蘆花雪疑困在天涯何期霜後節風吹一院香留待與君折商尊兄嗣天台通玄林和尚歸南嶽住靜索筆贈自古天台稱石梁雲儔五百老行藏赤城義氣爭吳越南嶽峰高邁楚湘兩岸梅花春雨足一溪流水草莖香載歸湖海千層浪不落煙波調更長訪友隱居卜得幽居隔遠山谿深難禁水雲還封塵草色花如醉徑入門開總不關丙戍元旦述懷五湖山色羨江梅一度新聲振地雷雨露逢春林木長寒香積樹雪花頹清波不繫萍蹤跡幽谷能藏梁棟材增減劫中多少事年長歸去幾時來夏日喜雨暑氣侵窗熱風雲布雨除草鮮花色媚山翠綠眉舒客路涼生快田疇潤自如南軒亦可意停扇且翻書和得山翁和尚出天童欲往匡山因受靈峰寺請以詩和宋學士韻收拾瓢囊別隱天小身大出化三千片帆欲掛西江上一衲猶拋東海邊闢破靈泉通古澗鑿開石壁丈新田有時月到孤峰頂長嘯風生雲滿肩喜語風老人孟夏山居詩首聯續其韻我愛山頭草屋香就將毛竹搆為梁誅茆苫結螺螄頂壘石門開八字墻火入炎蒸猿鳥息谿流情見我人忘閑庭日日雲飛過化作輕煙散客床夏日過劉渭公家與仙乩限韻偶爾成詩閑情久共山川老沉世相看半白頭綠竹深藏高士屋青山獨出梵王樓路連秦北皆官馬水漲江南一葉舟湖上煙波漁父穩詩飄無字與君收又轉韻對客春聲盡青陰遍未收試涼舒羽扇禁熱縱芳舟泉落驚幽鳥樵歌到竹樓不知天地老日月下簷頭窗吟雨霽花繞竹籬屋遶香晴窗開豁見人忙樹高綠出呈清況雨過風生帶露涼幽鳥鳴庭翻夢眼田歌入耳滌詩腸松巢冷落西林社霽色雲飛鶴路長詠雨中秋海棠影不高墻外青陰沒地多精神浴夜雨容色颺秋波嫩蕊香微放新紅粉澹摩猶將含笑意終未語如何禮雲門雪嶠大師龕道播星馳湖海僧何期秋月暗孤燈秦山黃葉悲天老禹穴青泉慟地崩擺脫五雲茶灶冷拋空雙髻目清澄風高不許閒眸望千古令人恨未登讀雲門志略卷入雲門寺傳來歲月深燈懸新夜火筆立古人心青草生樵徑白泉出鶴林先賢何所去不復見題吟因事出雲門過化鹿山訪荊門法師入徑問流泉泉聲咽悲語進路忽逢艱橫棘刺如虎行人未敢前余奮突其伍猛步過遠山渾忘惡風侮惟爾青松心舒我常年睹徘徊一嘯中驚出林間父攜笻撥易難人面多塵土放鶴逆鳴皋聲落傳枝怒寒梅簇院香殘葉何所補君不見西山一去杳無蹤名高天下聞今古雨中吟雨闊天無岸雲深蹊徑迷相呼疑似伴聽語鳥聲齊禮雪嶠大師塔辭出山師有青獅翁別號樹老葉落遺青嶂不知人去何攸向又見空飛嶺外雲覆雨弗傾清溪漾林間幽鳥忽翻聲到耳欣欣乘興況遶谷穿岩入小山松煙薄薄遮秦望相看遙立若個人及乎人無高于丈疑似飛來華表峰天然一座無縫幢四壁重封山萬個遠近龍降虎亦降內有全身獅子翁擒雲攖霧御其風冷落秋光藐天際冰霜皎月誰相似仰天長嘯欲成顛翻身笑破渾無地有時摩寫太虛空有時圖幅青山松亦不將錢貨與人亦不容人眇其神絕筆聲名謝世遊罵雨呵風影勿留稽首殷勤一瓣香千古萬古為供養莫謂春光年未知花開人面七十七歸歟皈與何所之記取鵝毛雪飛日師未辭世預作偈有鵝毛雪兒滿空飛之句遊明覺寺故址并引越之會稽有山曰明覺即千歲寶掌禪師居處相傳前代勢家謀為骨穴有古井洗骨池并寺額碑乃明神宗壬子歲太守鄭棟恢復邑令史垂則立石勒文尚存焉弔寺袈裟地冷白雲斑道骨千秋鎖玉環聞說不堪林下思到來塚積依青山記池曾記當年入越時寺成明覺韻成詩後將骸骨攜歸去獨剩清清一箇池問井一穴清泉冷地浮多年名沒在荒丘如何不作風雲事想是尸人未與謀捫碑磨雲磨雨負煙霞賴爾憑寒歷歲華殘畫分明支姓字可憐明覺屬天涯慰山雲依無語泣寒松巖谷晴空荒草封影落池邊沉古寺唯存山月待鳴鐘諭墓燐火夜徒然腐草謾誇白骨掩明沙縱教酹酒堪溫地只恐兒孫也破家做墳之家俱寥落元旦登秦望山頂昔始皇命李斯篆碑立此春來一日登秦望滿目青峰勢插天竹裏人家焚柏火林間古寺積松煙嶺無過客成荒僻溪有樵風作浪顛篆碣不知何代廢空餘殘木聽啼鵑宿寓山贈恒公修淨業天地孰可寓寓山而寓水寓水濯其足寓山亦無恥山水狎其遊雄雄無彼此卓立萬古松幽然樂君子行徑陟高崗極目遙千里或煙忽成雲飛入空谷裏亭亭石上梅襲香落青泚淵深沃焦石林木堪其止或來問局人佯佯徒勞爾惟有白社聲浩浩驚狂史亦非陸子玄亦非陶亮士也無禪可逃也無偷心死一念萬念念不休念念念盡從茲始湖上行聽泉聲入小語落枝頭鳥柳拂六橋煙山色尚縹緲載酒載歌人不見唯有西湖鏡一面山高山低南北峰忽雨忽風天地幻郭中絃管浪漂聲湖上聽兮調不清亂綠叢豐桃李花映入清波印落霞君不見雲昏簇簇宿漁艇埜歌醉舞學狂飲又不見夕陽影落西浦深棲鴉點點拳樹頂待將天曉一聲鳴驚破夢回人自省欲問湖上人去來去來端的人莫審贈關中西宗禪友棄教入禪知君出秦川為識天涯路天涯路雖多君不辭勞固黃葉止兒非厥心何所寓思古覓安心孤征南詢渡履險帶風霜泉石誇獨步除卻文字禪力決驚人句君不見擊竹聲中達者知祖師玄要從斯悟但得心花豁自開馨香觸鼻沒回互他年登臨若閒吟寫情休得忘卻萍相遇晤鐵關禪師於禹門兼送別君別余時余不然不道君別余十年信知人間別有天何方道者不飲泉幽谷茅菴雲不眠為留清光入掛簾山花雜綠開更妍乘風襲襲到巖前君來正直農初田褰衣輕染薜蘿煙何期斯約禹門肩君亦欣欣余亦廉忽捲絲綸放釣船想爾只在滄浪邊余欲與君質引緣恐君惜我杖頭錢媿無才續匹古賢聊寫短章以作送行篇洪都耑愚大師訪船子跡兼詢季子墓仍歸臺山掃月川師塔意況有渭濱之隱偶過江干黃介子居士以詩呈得和其韻別號傘居張空傘蓋體如如不問雲山好結廬一棹洪波經北固風帆下載入南徐追尋船子延陵跡欲弔清涼渭水漁訪及春申墳在此卻來江上閱安居傘蓋乾坤得自如大千沙界一茅廬相尋古渡推篷轉又向臺山去路徐禪不風顛隨普化教從海闊任陶漁偶來話月澄江上何似清光載別居又和耑師璧介子公玻璃瓶韻相呈至物非同物喚作玻璃盞共瓶問道三三前後語卻來兩兩和同聲涵光皎潔通身淨貯乳圓明內外清珍重主人藏愛惜師情已見世中情訪平山關主額曰量雲遂書為贈殿閣涼生風入微南窗由自鳥閒飛量雲幾許評長短談柄何曾較是非擊竹聲從簷外落拈花意向目前揮月高難到分陰地若得分陰忘所歸答俞玄音居士韻別號響忍疇昔過毘陵夏末秋未老恣譚坐陰涼塵跡謝除討話月曹溪深漁歌滄浪渺指歸天地間萬物洞玄妙忽爾聽秋聲弗覺紅樹杪窺烏白眼人縱橫空中鳥宇宙氣浩然混沌何所曉未明生前事頑如喪妣考悲風振林木洪音擊天竅鳴揚霄漢驚聲落息群噪玲瓏道者心障雲豈能罩獨有龐襄陽一家善其造讀斯響忍吟今古亦同調孰想太白峰影落江月炤舒我意徐徐臨筆猶奇妙寓毘陵龍興禪院拈贈無蘊禪士勉參不立文字教外傳一花五葉分皮髓莫道佛法無多子只為困徹語相似毫忽存胸生死根力揮金剛劍斬此饒說天花湧地蓮流浪風塵何依倚縱蘊雄文掞國才傳燈幾載遊說士西山隱主舌如鋒馬師一喝伎倆死德嶠未見龍潭惡怒嗔魔子呵直指路逢婆子詰三心默默無言當下恥驀地吹滅暗生光翻身哮吼威千里契如來禪學祖禪不燒佛經燒故紙潑天門戶摛風月絕遮攔棒從茲始獨步雲門一字為不落鋒芒筆妙喜欲謀此道猛如虎進退由人渾不理直踏千山與萬山踞高峰頂誰敢視選得心空及第歸六龍地振揮玄旨今日與君識一面他年來飲南湖水客晤棲雲道契小陽春十月寓目楓林紅葉落樹頭雨霜凝冷地風孤身懷短棹逆旅促行鐘不期臨客路恰與故人逢訪友棹撥霜花到毘陵抬眸楓葉亂飛岑誰知道者依朝市不藉秦山隱處深憶普懷禪兄空亭獨立意徘徊欲望芙蓉江上來徑有清香持晚節春風那得笑顏開慟蒼石禪士參得當年柏子禪結茅深處任高眠人情一別如湘水到底無心向北川過江干宿契宗兄菴中敘別自從把臂論三三十二年交今尚慚早晚多情承益語往來疏闊少書函江潮雪涌君山北蘆葉霜封閘口南一宿天涯人去遠聲名不改舊時菴夜泊南閘投靜室宿朔風林外十分寒潮落江聲行路難扣戶菴前松梵靜尚餘月色炤更殘訪友特尋黃葉溯溪流茆屋忘年雲蓋頭日火炊餐三頓足那知遠客夜來投代梅吟東風若到我家門漫笑寒岩香骨冷不肆春容姿態多一枝獨向雪中挺望哲生兄坐息三日五日望知己知己望到歡不已不屑澹交事需吟默坐相看意唯唯座中有客悉含聲嶺外猿啼峰月起炤徹乾坤亙古心耐水清兮魚不餌珍重欣欣莫浪言一回相見風千里空吾禪衲壽楚人博得吳山水拋空楚岸船不知松柏老忘卻世情緣覷破浮生夢淘乾盡底禪幻身如海滴白髮丈三千和菩提菴自如師韻學道愧三登翻思面壁九屈指記春秋算來白髮有何似上古心仁宏形陋醜一點成太極兩畫分奇偶便爾列時序蒙媚窈窕柳化物日月光星拱辰北斗弗登天子堂甘為林下叟此是何等人善應而哮吼以涅槃為家以菩提為友率不改行優遊仍如舊源海索書君辰正值夏初熱榴花開瓣硬如鐵刺破薰風殿入涼大點小點枝頭血五十餘年似春眠一枕松聲驚忽徹纔覺從前夢裡身選佛選官由他歇淨慧園種一娑羅子已成樹矣經十六載始試花見者奇之有題詠頗甚偶過主人亦索題遂拈筆成韻即辛卯夏云廣陵一子堪成樹十六年經方試花香入座中風剪碎影高霄漢月移斜品題得句雲箋染帶露清和筆墨賒繼跡將來陰大覆除天霜雪蓋塵沙同牧其師過華亭棹旋朱涇渡口弔船子和尚兼和牧師韻即清明後一日附元韻一帆高掛過雲灘不泛清波意孰堪千載至今流不盡清明歸去日猶寒堪字不在韻乘流船子下洄灘忽轉推蓬思不堪一自收綸人去後東風日暖渡頭寒有推蓬室尚在懷米頭陀善工書畫即薛崖孟諱宷久慕誼風抱飲源不知鳳閣有王孫南宮墨點家山水北海珍藏屋漏痕趺坐展巾學洗缽掛冠剪髮傚于髡杏壇日冷刪書筆月下敲推刺史門遊棲霞寺內有千佛嶺昭明太子塔珍珠泉玉沙泉雙澗主峰即攝山攝峰山下寺棲霞形勢開張地脈嘉兩派源分雙澗落千尊石佛一行斜塔遭劫火流金屑泉涌珍珠浪玉沙樹歷六朝煙雨在松聲穆穆水雲家謝友過邀凍解春風草木香時來邀我過錢塘青山滿目羞慚色爭得臨溪話一商題朱去塵墨竹無君居處道人俗掃雪揚眉窗上綠戰落松風萬派聲去塵筆剪精神足過聞性菴觀金魚內一尾通身澹銀色有十二點大紅故名十二紅可愛避秦不必問桃源大隱何妨車馬喧十二點紅新世眼鶉衣道者誦高軒同箬菴和尚舟集南湖放生兼次其韻坐草瞻光花木深舟呼水陸集幽林當年點首惟頑石此日圓明總佛心且喜覺場空有漏不煩情見到雲岑談鋒瓶瀉回狂瀾湖海游鱗天地禽酬曾儀公居士見訪次原韻時來將燈上葉落秋林不計年何期知己話生緣人間已沒天邊日月下偏歌湖上船夜泛波明吟絕句心空機息罷逃禪誰能把臂傾肝膽卻較吹燈滅正傳答𨍏轢嚴居士原韻幾回靜坐月明中冷地猶懷千里風春草岸深蛙沸耳祖庭秋晚葉飄空惟憑道眼掀塵世縱逸狂歌達此宗選佛選官非所事等閒出沒妙高峰元旦雪夜詠春風入歲散天花草木銀頭世界賒鑼鼓喧喧沉醉客不知林下雪烹茶宿興善古禪堂雨霽酬大山兄元韻喜逢時雨話生寒翠鎖煙雲樹一團夢屬天涯依古寺聲流大海別溪灘隔江招手成多事到耳狂歌息異端聚首笑談清夜月眼空碧落太虛寬送致言道兄之武林省親滿林風澀靜寒煙擊凍聲催夜半船數載思親歸未得忽逢江上拜尊前挽闇齋黃老居士二首宦遊學海事王侯諫議曾標五鳳樓為覓安心林下士故乘風月問溪流花開薝蔔君當去果熟祗園孰可留不負西乾金口囑再來東閣閱高丘質託閻浮入帝鄉全無聲色動行藏生緣識破莊周夢法性靈遊大覺場鴛水空流紅日影百花謝盡素園香傳燈雖未稱名姓道義千秋為舉揚題不借居余思軒冕遂多以榮辱易何似山水情常年終不二雲鶴縱其眸獰龍恣游戲流長接天淵花落香泥地明月引清風松竹排其次集英樂幽賞賓主益高志舒懷百草頭豁目庭前意不借居無為豈許立文字登煙雨樓登臨惜不見岑樓一望雲山天際週煙散長空風月冷雨餘極目草庭秋臺前謝客聲何似樹上啼鶯語若流泛濫清波渾釣艇夜來酣飲笑封侯見鴈陣初來忽爾見天涯北來一陣斜行成雖有隊影落恐無家翅奮爭霄漢群零惜淺沙春秋時節事煩語不須嗟為萬松菴石盟禪友壽草肅風清松有神夜來蘿月碎龍鱗開軒縱目雲霄鶴坐石安心格外人不問秋聲吟底事單提黃葉頌斯辰雖然算數知天命僧臘何妨百二旬寄隱者林木經霜老道維許自孤名高思靖節籬菊杖親扶送中佳禪師之松陵孤鄰懷去鶴草木禁秋馨話別楓林老期長竹徑青露清雲障捲天冷月華停空眼著何處輕身喜浪萍村居五首結箇小茆房周圍不打墻春三二月裏好看菜花黃居住依村舍聽音喜樹下門臨淥水長屋遶薔薇架一掌平陽地茆房三兩間門開無晝夜徑出犬聲關村居出入便不畏蹊𨄅路菜飯粥隨時山深多異獸獨愛村居裏年來爆竹聲菴中坐聽響直放到天明寄龍池和尚侍寮斷疑兄欲寫春前事何如晚節香水澄魚眼碧林老傲霜黃秋色冷煙雨樵歌振玉陽懷心千里外令我憶滄浪過古南次泛舟尋梅韻解纜乘風過別津欲題無語問江濱相依屋角吹香冷卻到林邊見蚤春野岸未容芳草色高枝先占百花神三冬冰骨亭亭秀留與閒情莫放身送素嚴法弟還山涼風乍起君出山君今還山風愈寒視水清兮魚不飲扁舟歸去霜花冷目渺七十二峰低蕩胸三萬六千頃高歌漫板興瀟然破浪安眠唯自領到岸踏翻腳下船直上玉陽臺絕頂覽窮湖海何小焉惟有禹門誇獨秉和冰燈詩并引辛卯秋日忽山中老人耑使至為遣弔闇齋黃公有斷疑公者作元旦冰燈詩并敘附示余接誦頓令心清腸滌可為龍池絕景美觀也又託予轉致梅溪大山兄欲共切玉揚金聲和響協以增祖庭山色即二公冰燈詩始刱焉然雖藏珍之家不可無詫怪之嗤如許著一礫屑雜寶器之中但不知玩賞者以為何如若以荊燕同目則藏珍之家掩面東南已也誰劈玉岑縱崖靚珠垂珪樹明如鏡不須琢磨經異匠天然之色臨物映佛供山川溪澗月僧邀庭際圍積雪架空一座勢如山玲瓏巖壑形凹凸竇竅四面洞光輝中心一點內外徹輝天鑑地耀無私熱腸冷骨貌凜冽偪人眼底盡生光爍破乾坤螢火滅證心堂乃額名也集元旦賞瑛花綻裂開餘丈此燈此日絕奇勝光揚湖海咸慕仰景聯少室奪春芳燄高星辰佳氣象可惜龍池老古錐不曾吹滅攔腮掌因書此語達諸方擬議喫我南湖杖無題桂子飄香八月天水清鷗鳥伴魚眠秋光冷抹涼風雨蘆荻花飛白雪船鴈字橫空臨古畫帆征落木瀉流泉和宣微法師村居除夕三韻村居草舍避風威谿徑雖通驛路違謝卻除寒紅日暖相看夕火暮林稀家家爆竹分聲碎處處燒荒祭地肥菴內不同人共賞一爐松燄向空歸柏老能操霜雪威寒香不與世相違山深歲盡松煙羃聚落幽棲車馬稀烹茗峽中泉異美煮羹冬筍菌香肥聽憑醉後添杯樂漫擊鐘聲送夕歸林泉意氣逆塵蹤不問溪山有異同好看兒童雙眼碧笑他老大一身紅樽前弗覺更籌改醉裡焉知歲月窮高世書懷除夜詠題餘信筆寫春風詠雪兼懷三塔自閒禪師天降瓊林擁四維崑崙玉出眾崔嵬青山白疊成風浪碧水銀流合派歸策馬藍關唐國重牧羊北海漢庭威誰將少室峰前事今古如何論是非乙未二月廿日謝如菴院事兼訊南湖別眾臨谿睹雪上頭陀六載依棲意若何一度寒侵一度熱幾翻風險幾番波人情佛法春霜曉世事名程夢裡過逆順消歸東海去聽憑時鳥亂啼多山中吟五首世路多荊棘山林少客行泉流稀草木何處虎狼生交情貴意澹相約定然期即此堪頻往何愁見別離學語隊成班沉吟向上關一生空傲腹懷抱我人山祖道傳心印師承肉與皮老胡真骨髓未夢剋家兒雨潑青山壯雲歸洞口香捲簾千嶂碧花落見人忙秋日寄金韻伯詩客月冷蛩吟水碧流普天聲色落江秋不知黃葉催何事打著其人自點頭觀海菊花香盡朔風寒草色青黃樹葉丹潮湧雷聲驚海岸層層波級耐人看得夢中首聯續成兼勉友花芳尋澗底葉落振秋聲夢裡遊春事醒來記夜成眼前圖霸業身後總虛名若個憑今古由誰定死生宿栴檀寺與蕃子夜話偶宿栴檀寺三生論劫灰月弦初夜發更點漸深來星斗持霄漢鴈聲落九垓話殘燈火息弗覺曉鐘催金臺栴檀寺乃江右歷山法師開山刱建見其幀子有自讚故書此兼勉龍吟關主號龍吟即徒孫也燕國栴檀寺非同入眾材青年童子在白髮老僧回孤影尊堂上雙眸冷地開法壇問道去枯木聽龍來丙申九日前送淨慧園主人旋南北地秋深南畝黃西風催促晚來香廣陵如得春光蚤先寄一枝入帝鄉為尚甫童居士壽是日雨下風生殿閣動微涼正值臨辰下玉漿一滴沾唇鮮百味千杯傾腹漫流觴花飛艷麗爭歌舞茗試新清倍酒香鶴駕宴亭恣共老何須問訣秘傳方題畫雲山涵水水涵天寥廓虛明萬象潛月載滿船歸未得暫將孤艇宿蘆煙秋日雨中即事不聞林木香應被西風刷雲想衣裳輕寒隨霜露滑飛飛紅葉老片片秋聲殺平知松柏心不將顏色刮溪帆不逐情緣水一溪長帆短棹各東西乘風載月歸家去莫向蘆花野岸棲五月寒葉染雲煙薄梅黃五月寒柳陰攤地北山色媚江南馬上輕風冷署中裘葛殘窗前天雨久脫卻兩衣難聽雨雨打窗前過潺潺漸覺大濕林鳥不啼唯聽雲聲墮瓶梅得蜂字韻春入瓶梅蚤未開霜雪封案頭燈照色窗外月形容瘦影成孤立清香豈易逢夜深蝴蝶夢天曉繫遊蜂伴梅遺我非青黃一枝梅在傍支梧情弗倦對影意偏長點額疑為假塗身似有香歲寒心愈潔姿色自天章孟春送友之楚二首三冬冰骨解風暖覺天長取次入幽逕依稀在故鄉凝眸青嶂嫩襯足草頭香踏遍江南地收歸月一囊不妨流水在高山若便誅茆可著閒種竹移陰晴帶雨裁雲補衲自成斑呼來鹿子狂心歇養就獅兒縱意頑如吐瞞人三寸舌莫教放過趙州關擬題黃鶴樓漢陽江上烽煙塞黃鶴高飛化五湖日落洪波空草色舟橫渡口載荒蕪秋風蕭索王宮盡劫火燒殘鬼孤欲問洲前鸚鵡話吳山相隔杳難符甘汝耀老居士索題爵鹿圖有二鵲抱松枝開口相向鹿走林原鳥忽驚雙飛來去樹頭鳴梅生兩角風難埽雪點通身看有情回首望崖花放萼懸蹄弄影草停聲老人只在松山後不與時流說姓名甲申過金陵懷古斷鐵沉江鎖荒城湧石頭馬蹄催驛路樵斧亂林丘玉氣從雲散陰風落日囚一回春夢入白地草生秋戊戌八月初一日讀三國志忽聞雷懼雷昔爾笑曹瞞天釋英雄義不單舌戰群儒羞劍客聲驚將相伏星壇七擒瀘水波濤振六出秋風心膽寒國喪中原輕九犯至今流血未曾乾
