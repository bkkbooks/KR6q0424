body:
  text: 門人海鹽益證等編偈造方丈山門即如如菴如菴叢席年來荒僻佛法無聞丈室誰葺欲起前因須憑衆力扶正宗風莫教狼籍掌不孤鳴木不獨立水到渠成功因漸積海流百川源歸一滴達本來人通個消息化長生米如菴不是無檀護怪我伽藍神不致故爾門庭冷似秋去來賓主兩三次而今我欲計長生須得長生一片地也弗難也弗易大家出隻通霄臂相牽共入選佛場莫教輪回生死纍辛卯夏絶糧三月二首緣歉自慚薄福人如菴獨力勉殷勤佛燈六盞油添月僧食三餐鉢貯雲乞化檀門憎世眼持貧道義愧超群雖然衆不容多也將就燒薪日貫文僧行不多二十餘商量佛法沒工夫炊羹乏米飢腸餒種菜彎腰氣力無説向檀那真實句飽齁齁地再匡徒結制化知浴欲轉法輪第一義必須四事先周備如菴選佛場初開要化檀那百日費洗滌身心般若香大家都入龍華會化米現成公案古南泉牧一頭牛水草邊大地春風齊著力不知耕熟那家田我家田沒底鉢盂口向天示參父母未生前父母未生前面目必須討個安身處終朝聲色不曾藏為甚渠儂無本據送豁然維那璉假旋武塘克賓法戰何所長令行千古力承當不是久經臨陳將那能立國定封疆罰錢出院名播揚師門高出弟門強驅耕奪食興化郎正法眼滅敢覆藏爛熳爭鮮草木香一枝拔萃雪中王熱勝門庭窺諸方令人猶憶老汾陽南湖一棹拒滄浪羅龍打鳳綱恢張擎頭戴角悉擒囊獨放俊鶻逆風翔距爪靈晴如電遑高視雲霄去武塘更有末後句未及與子訂期載春光與關東永濟知藏佛祖兒孫無別説端的是非當下瞥自家行履自家知為人到底終為徹煉得髑髏情盡乾一回入草須甄別君不見獅子威奮超絶等間哮吼群腦裂雨若書記四十初度麥浪秋風夏初暑清泉雀舌石鼎煮不昧靈根歷劫來信地花逢時自開迦毗羅國一聲吼天上天下誇尊口雲門老子太無端拈棒打殺餧卻狗丈夫志氣若如然目視雲霄廓大千不參銅頭鐵額禪舉足動步踏生緣即心即佛非心佛畢竟心佛是何物四十光陰倏忽過五十六十快如梭古稀之壽世無多縱爾百歲一剎那有朝瞥地忘言語那時方知應自許示在家道友貪嗔一把利名刀何不從中放下高一念妄生諸想集心空塵淨萬緣消擬大珠和尚三意況韻我無意況大好知足處無煩惱面無慚色負人即此平常是道不以心覓安心也無了與不了雲騰化其自然顏本貴乎非皂果得心體一如不妨和身入草我無意況大寬彼此無諍是安履踐在於貞潔發言莫若易難染衣被而自省花冠謝以何看但心無纍於物世緣瞥爾非干我無意況大奇物我怡然何欺是衣可以蔽體是食可以充飢任從百巧機宜難得一默爭癡玉瑛花非燕石心光耀徹玻璃道化無方不化不知是以為知禮幻祖塔師見燈花爆悟道居五臺後笑祖以笠覆為記云振濟宗風大用施潛身不著外威儀燈花爆卻瞎驢眼笠覆清涼師子眉雲曉牧童刪徑草影縣山月印龍池春林雨洗莓苔緑百鳥銜花未教遲賦得無求到處人情好二絶春風爛熳啼黃鳥一謝東風何處討莫若平常亙古心無求到處人情好世情冷暖相從勝雲鶴無求氣量高來去歲寒松柏立看他霜雪豈同曹為宣微禪友五十兼書大經畢持梅霜雪裡供柏老庭前僧臘形忘久大椿紀引年書經間貝葉閣筆慰流泉志道無餘事安心已學禪示尼無起日課蓮經動靜間忙轉法華間忙無起法華轉風清月白恁麼時一念不生誰隱顯又請題卷子上是卷係諸知識贈言并親筆三周九㖮妙堪誇火宅門開長者家入理談深窮子事真乘示等白牛車佛身已許成龍女聲色何妨轉法華領略目前無量義大千世界眼中沙次除夕貧字韻村居埋歲月不與問疏親思卓錐無地慚孤德有鄰更符驅鬼魅爆竹謝天人陋巷堪持樂年窮未若貧和趙州祖師魚鼓頌一聲天竅出凡功化道無私語不空喚爾靈明知覺性莫將音韻等雷同勉僧參究了生脫死本無他只要工夫切到家拼得一翻寒徹骨自然雪地見梅花詠梅贈宛在菴主人號物如天童蜜祖披剃梅點春風宛在林冰稜骨格玉團心神清有異超凡萼調別難將共一音瘦影尚高雲鶴致奇枝偏向雪霜吟即從見後無非佛何用年來識話禽竹知兄別余十有年餘忽過如菴話懷兼贈別辨峰昔日話瀟湘今到南湖話更長柳暗桃紅春意足風清月白鶴雲翔扶弘祖道安心竟整頓頽林論義章勘破五家禪一味猶拈六字教提綱習蓮宗墻邊竹忽爾透屋裏衆立索題描不成畫不就如何特地墻邊透撇卻梅花幾樹香風風雨雨窗前候丹青約爾伴天涯切莫將名貨與他幾度風搖搖不動昂昂骨格自堪誇過淨慧園挽尊證闍黎清菴師時圓寂天童師之去兮何所曉黃花灑淚沾秋草諸子無聞向上機剎竿此日他方倒繩床不繫舊時衣瓶杖誰復將塵掃太白峰前獨露身廣陵影落空堂早咸來睹目痛傷悲七百人師今已老卜隱小小岩阿好結廬架椽不用施班斧天生緣木足堪棲巧手輸他還在魯贈梁溪菩提菴主人六十月入薰風南畝燥一池淥水開新藻溪縈竹徑放僧間門對山峰歸鶴蚤寸土深藏亙古心桃花發見平常道任將滄海易桑麻髮變不從今日老示勉志十年未必成名士一念回光頓出塵今古白衣多拜相眼看都是丈夫身治升董居士乞薦室人超源朱氏分明箇事不假胞胎獨露真常無去無來當下知歸兮逍遙自在觸目菩提兮縱橫無礙從今透脫死生關任運騰騰充法界克己書華嚴經漫去南詢煙水寒百千盡在一毫端直須親到妙高頂未免渠儂句下瞞句下瞞八十一卷絶遮攔始知百城煙水易五十三參一筆完訪慧乾道兄話懷知己話長白日短菊花香冷鬢毛寒吹空楚角天中落動地胡笳馬上彈林下笑歸周禮樂席邊歌舞漢衣冠磨磚作鏡徒然事斷臂求心何處安山徑刈茅逢每異入廛垂手恐多端勵參禪者學禪不在論談雄貴要虛心肯用功勘破香嚴親切處無錐無地始知窮參箇話頭鐵橛禪八風吹不動如山一回撒手親承徹倒卓須彌笑破顏欲了生前生死關也無奇特與忙間忽然驀見虛空碎自謝胸中人我山蒲團坐破成何用讀盡詩書文字禪不了心頭差別見鑽他故紙枉徒然書寄江干諸友三十餘年愧不才幾經寒暑日摧頽蒲團坐破思長慶茆舍移居想大梅三頓恨深太白棒一聲殃及禹門雷漫言跳入金毛隊羞見東君江上來贈藥雨禪友以醫濟急檢點心頭事了然拈來是藥濟貧緣人人喫著通身汗賺得給孤金布磚贈玄音居士趙州婆子話頓徹目前機截斷中途句全提正令揮掀翻今日案勘破古人非禪不學文字心空始自歸贈淨慧園主人恢宏梵剎係先人舊業號祥光力承祖業建新林邗水重重煙樹深剪棘鋤開三徑草留雲瓶瀉五湖聲熟耕畎畝資香積間種松風集梵音饒舌不談陳底事偏宜愛我話傾心過金陵杏花村示心見學徒入林深得趣攬景居無厭花木雜顏色石泉流野灩閲心唐梵書磨筆古今硯鳥迹謝銜空目前休異見五日偶成五月榴花紅似火剪枝插向艾旗左不用硃砂畫靈符只消此樹驅鬼禍鑼鼓江心鬥木龍彩橈浪裡爭人我也無角黍汨羅投那有青錢買供果一滴清泉睡魔大家開眼好打坐毒蛇百腳飲雄黃魍魎箇箇喉封鎖過金陵訪同門話懷憶昔同登金粟峰翀霄志不受羅籠鋒藏巨爪驚群異調別玄音振祖風扶起破沙盆子案拈提正法眼流通好施棒雨為霖日喝及雷轟建業中梅溪大山兄者昔為天童師翁護法弟子經變披緇後與古南和尚機契茲年登不惑之慶而受囑於昭陽是謂喜慶雙臨也高足接旋即鍵關作把關十詠一日示豫又見自贅矮翁為別號更羡三絶孰可繼焉辛卯秋日述賀并祝云有石勒梅子熟也四字匾曰正目堂矮翁軀短胸襟長千丈盧身難比量淡泊世緣名利淨幽居林下道風香法筵炙口熟梅子龍象掀眉正目堂從此嘉聲流布也庭前柏老壽無疆物如兄被盜驚書寄菴在水中有白蓮衛護溪流香泛白蓮開隔斷紅塵影不來忽被西風驚熟夢一番心事盡成灰庚寅歲底喜楷生鹽公至話懷以詩呈遂拈筆和韻兼勉其志寒結霜花淨谷深香未施十年經作夢千里外逢奇論法寧無惜扶林賴有持莫將茅舍隱覆卻祖師眉訪彙旃高居士諱世泰選佛選官較一籌呼名信不諱裴休卻將法網張黃口便就儒冠駕白牛縱奪枯禪生活計放擒快鶻逞風流梁溪輸與高居士掉臂伸拳百草頭和𨍏轢道人對玉環帶過江兒水邁古超今步行騎水牛傾家蕩酒有甚是冤仇心空歸及第禪説沒量口又堪羡儒釋道衣冠何曾容泊湊語默機鋒鬥始終見作家到處呈好手呸説什麼那引蔓牽枝笑春風翠柳銅頭鐵額山中有君知否徐仲達居士索書扇頭在家出家法無別只要當人志猛烈識破根塵情愛除眼前光景一時滅大丈夫超群越一言既出如釘鐵君不見詩三百一言以蔽將何説莫教情生一念差二六時中須透徹示參本來面目大事未明莫等間急須力透祖師關忽然覷破娘生面鼻孔何曾有兩般述懷舉目林泉無個士孰為鄰與話滄桑法幢逝水空庭息何力能扶祖道昌己丑冬一日送元龍許秀才之龍池出塵須得丈夫志丈夫之志非容易全憑一片鐵石心入佛魔境超群類若爾依稀似庸流未免仍遭聲名纍噫嘻今之妄傳燈慧命懸絲何所嗣大徹還他斷臂人九年腰雪拔其萃高梁淨地益安身一一皆承血力被思古巢穴律其形瞻之仰之今可愧君不見風流獨邁老趙州庭前柏子翻身異香嚴一擊忘所知靈雲眼廓桃花刺君之孑兮越天然不駕車牛奮猛智孤征扶正一帆風莫放繩頭空掉臂此去禹門浪潑天牢把腳跟著實地得聆劫外春消息歸來煙雨恣遊戲庚寅秋毗陵俞玄音居士以禪頌八章書扇頭見寄即原韻和答兼致之莫謂奇逢火裡蓮也須親悟祖師禪若還不得偷心盡搬運塵勞枉度年鬧靜間忙仔細看縱橫無礙始安然從來不借東君力豈受桃花當下瞞坐斷目前無一物將何指示意多端豁空見徹娘生面莫把腳頭上別船欲去謀生生本無試將何物堪為死死生不立透重關飛出紅爐金彈子坐脫立亡猶未羡撑撑拄拄可憐生縣崖撒手承當否漫謂無錐卓是貧指天指地稱尊貴爍破乾坤眼底光若箇猢猻捏不殺如何證得法中王八萬孔中藏舍利道堅骨具信存留功程不計終須得打破虛空見髑髏踢翻大海波濤靜勘破揚聲臭老婆百萬人天輸一笑鎮家種草不須多建秋亭索和韻拈莖草木建秋亭四面窗窺月到楞好看情空於此際一聲落葉又誰聽爽氣清臨上小亭林生月白見疏楞坐中有曲非同調四海聞音別一聽見禪者書攜笻太白下百事懶營為之句遂續成章以徵吟者勉志攜笻太白下莫道事無為飲水須防噎吹燈忌失眉臨岐問道晚去劍刻舟遲寄語吟題者驚群始見奇送友隱居一帆吳越話重逢又曳孤笻上別峰煙鎖春林刪草木月明簾外看芙蓉笑談倦臥三竿日吟詠長懷千里風去路必須憑指示莫教滅卻瞎驢宗寫龍池新建從雲亭兼寄斷疑法弟聞説從雲亭搆就崢嶸頭角鳴宇宙銼磨林巒黃葉飛蒼松不改顏如舊怪石稜層兩岸冰濤聲漫瀉晴空吼蒙煙帶霧龍行藏徘徊秋月峰群秀莫教眼底爛熳紅寒岩徹骨香自透中秋送古帆法兄住寶山菴桂林香飄雲彩化一輪皓月充天下世間何物堪比倫惟有道人行處不著聲名價單提玄機接上流不打葛藤之乎者三寸能擒猛丈夫一條楖栗佛祖魔來都與打禹門浪裏昂頭角寶山峰頂眼卓朔殺活縱橫棒喝施直教千手大悲難測度只許獨行獅子兒拋擲繇來乾坤闊衲山禪者結茆索書遺風千載衲衣間末後拈花笑破顏不是無禪師有愧追隨茆舍入深山草鞋行腳遍吳越收拾歸來入虎穴趁出麒麟獅子兒峰頭夜夜猿啼徹刪草鋤雲就卓菴拋空一擲韻成三打頭句子分明説瞬目揚眉莫放憨禪者呈偈遂走筆和勉大唐國裏不無禪事到叮嚀倒剎竿只為無師應吐舌令人千古亦心寒忽見溪桃甚諦當再三勘徹道方親而今若箇能投句可爾臨機第一人不須把住任悠遊撞倒崑崙赤腳走入佛入魔眼底塵驅耕奪食何前後日月雲山天地埋大光明照豈吾儕風流父子南泉老殺活猶較頭頂鞋涼風撼林木擲釣洪波鱗甲多莫道秋光歸去好五湖煙景事如何施茶十字街頭開箇鋪不將顏色攤門戶頻傾七碗展家風須用信心檀越庫贈苕關主號清源耳順餘年復掩關始知心印狀如山君臣道合兼中致賓主全提大用間撩亂春光新語句澄清皎月舊容顏好將幽徑通雲鶴玄要臨機不等間示脫白沙彌年今十七得為僧是此知非將相能猛策越群須上志殷勤學業力規繩齊賢必欲思三省了義當先究一乘他日心空歸及第成株大樹碧層層和嚴居士寒字五首九年面壁不為難千古聞風立雪寒斷臂始知求法異真乘六代位單傳少林碑碣歷霜寒正位傳燈早已刊關係是非前宿定亂流何事喻江干明星夜睹碧光寒此道無為與勢干不料兒孫今古異短長攻擊笑旁觀深知仗劍逼人寒善受輸他地面寬堪笑當時謀略少如何不教告經官天威一發斗牛寒試火焚經道俗安所以王臣金口囑為今教外別生端示方爾嘉善友佛老當年教有言開權顯實示根元奈何見墮三乘慢瞥爾情生八苦煩領略談空成夢幻應觀法界破心猿嶺南道者分明説不是風兮不是幡泛妙喜過悟空菴訪清伯黃居士不遇聞入煉士社去書此五章寄致之煉石修身何足堪長生祕訣不為難昔年問道黃龍老仙骨傳燈器量寬春歸屋裏百花香徑接窮巖有異芳過客到門呼弗語點頭石已悟空王清目沖雲幾箇山一回登眺鳥關關歸來戴月泉飛雨茆屋沉沉松竹間洞繞長生不老花千年結果味堪誇凡人若也知端的來共烹泉試蚤茶居山儘有居山趣莫道居山與世違雲去月來光燦熳照人天地一同歸雪中寄厚菴曹學士諱本榮天玉從空落瓊花應瑞年夜行人主義茅顧臥龍賢語覆千山頂機忘一色邊棒頭三頓後誰説老婆禪贈蓮親顧居士蓮出淤泥越衆芳輕塵不著水雲鄉許君親見一回後在處花開般若香贈報國寺賓如教主化門賢教主塵世尚為賓律正心無咎袍方道亦親清名廉法侶器量悅王臣交結一平等如常豈愧人丁酉秋解制後別院主覺幻公之南破屋楊岐風凜冽宗門千古稱豪傑滹沱玄要啓大方正法眼藏瞎驢滅三腳驢子弄蹄行賣弄西河真骨血掀天括地振頽綱驅耕奪食抽釘拔楔卓犖門墻壁立峰躋扳孰入雲霄穴鳳生鳳雛翅摩空虎生虎子威猛烈男兒立志必封侯道者尊貴絶其流豈不見出家乃大丈夫之所為非將相而可匹其儔反古思今能幾幾盧能衣鉢豈同擬而今南北總是禪青黃混説通玄理我亦乘帆向此來恍忽一期方便爾前入京師七月一茲欲旋南中元節蟬鳴露降涼飆拍雖別君兮君勿別不落其中事即易始終難道一葉落時秋聲擷堪持此語為標格直教棒下風顛徹肋下拳最親切相信何用多饒舌別禪者南旋秋末沾林衣露香就移短棹泛流長道交冷淡朋情重離別風塵世路狂黃葉亂占投澗落白雲歸必去山藏堪憐此事同誰調南北宗乘定有方示潘道生居士先賢所以外聲名本立何愁道不生見徹源頭隨處入紅塵堆裏一身輕示胡文宇居士一輪皎月徹秋光萬境清虛透碧窗人坐中庭何所思須知別有好商量示史元之居士人生世若日中央影去如飛下夕陽打點歸家何計較莫教臨夜路頭忙示沈彥先居士都道十分不得間奈何難打利名關目前景況如能卻在處紅塵在處山別童上甫經歷秋林爽氣甚舒懷𡬡耐秋聲寒漸催道者不妨相別去悠遊南嶽與天台示吳金谷都司我佛叮嚀曾有言須憑信力究根元從中一念狂心歇了卻千生萬劫冤江千任雲液秀才索偈遂走筆書示君曾與我素相知今又相逢話別離論盡世緣何可惜惟憐鬚髮滿頭絲熱腸冷語贈知己只此分明牢記取梁溪自如師曾居靜匡阜年經七秩書贈廬山面目識頭陀二十餘年住若何歸別西風開晚菊去來夏日長新荷倚松恣爾雲中鶴弄影相呼水上鵝忘卻從心緣所欲徑邀明月入高歌詠雪栗火銷鎔金彈子楚天風落玉花飛空山不見樵行路多半牧羊人未歸與友話及論古今事樹圍日暖香飛煙鎖林間翠微與坐談論石悟就溪洗鉢龍歸蒲團坐破心空梅子結成佛非不用玄言妙化自然到處忘機送友居山秋將半入蘆花白新葉飄黃尚未多此去峰頭高著眼不妨楖栗任橫拖除夕人人盡道三十日臘去春來咸委悉凜凜朔風徹骨寒梅花早已通消息看雲看雲雲去復歸來來去分明不假胎碧漢無門天地闊寰中有路絶塵埃飛空載雨傾滄海化影藏龍遍九垓不向煙波留形迹待將明月下蒼苔贈明余老衲號當人則不輸名姓喚去應來只是余信向箇中明底事了然何處不徐徐拄杖標格出凡孑立挺然日炙風吹不易不遷亙古無虧磨礪愈堅超群物表縱奪機先拂子一毫端上露布十方橫豎任運卷之勿藏絲來線去體用全彰垂示今古法脈流長鉢盂巨口向天赤陀陀地萬象平吞全沒巴鼻具滿月相應人間食隱毒龍身拔文殊智蒲團髼鬆月扇玲瓏日面蕩坦盈夷渾然一片天地周流乾坤際遍放眠身安跏趺無倦附法派源流字派行源清淨海流亙百川深法脈傳千古洞明佛祖心
