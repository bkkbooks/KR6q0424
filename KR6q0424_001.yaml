body:
  text: 門人海鹽益證等編住嘉興南湖如如菴語録順治六年己丑二月十三日龍池和尚送師入院集郡檀護於十五日上堂囑付繼住持遂返次檀越請升座僧問如如瑞氣曇花現煙雨春光萬境新如何是如菴境師云四面緑陰垂野岸進云如何是境中人師云眼卓孤峰獨足立進云如何是人中意師云奈遇知音進云三句已蒙師指示一句無私意若何師云滿腔別調進云曇花瑞現千年秀一葉流芳萬古春師云誰似渠儂得自由進云有意氣時添意氣不風流處也風流師云須是作家始得問昔日世尊鹿野苑中轉四諦法輪今辰和尚升座轉何法要師卓拄杖云會麼進云恁麼大衆霑恩學人禮拜師云照顧腳下僧復喝師便打問靈山拈花微笑面面相陳今日豎拂揚眉心心相應且道今古不異一句如何示人師云針劄不入進云恁麼則當體已超空劫外撑天拄地絶遮攔師云猶是階下漢乃云今朝四月初一鳥語風聲齊出若是靈利衲僧決不向此求覓且道覓個什麼不見香嚴禪師云一擊忘所知更不假修持動容揚古路不墮悄然機喝一喝云又幾向聲色外威儀參結制當日衆檀護請上堂師指法座云人天普集狐兔潛蹤縱使釋迦彌勒也須退身三步喝一喝遂升座拈香祝聖罷次拈香云此一瓣香靈山付囑不忘震旦金湯有賴伏為護法宰官居士等同圓般若種智永固信力根深又拈香云此一瓣香太白室親遭毒手辨山堂卒地翻身二十年撥草瞻風末後飲水喫噎今當人天衆前爇向爐中供奉現住常州府宜興縣龍池山禹門堂上萬如微和尚用酬法乳之恩斂衣就座維那白槌云法筵龍象衆當觀第一義問一條白棒當陽現木馬橫騎海底行如何是臨濟宗師云殺佛殺祖進云君臣五位全不失個裡風光事事窮如何是曹洞宗師云子承父業進云月出海門雲吐白鳳皇橋下水流東如何是雲門宗師云泉聲流出廣長舌進云未離兜率降皇宮大地山河手掌中如何是溈仰宗師云杲日當空進云野國窮通寒鵲噪栴檀林裏透香風如何是法眼宗師云事事無礙進云五家宗旨蒙師指南湖個裏事如何師打云你試道看僧喝師打僧禮退優婆夷問除卻三玄三要如何是佛師云你是男是女夷擬議師打云忘卻了也進云如何是法師云如是你聞進云如何是僧師云禮拜著進云如何是佛法僧三寶師云穿衣喫飯進云除卻穿衣喫飯請和尚道師打云你咬著一粒米也未夷禮拜師云佛法僧寶集爾現前離心離識淨體圓明若然念起緣生瞥爾迷封萬有與麼還有言前薦得者麼如無又畫蛇添足去也喝一喝復云臨濟大師示衆云赤肉團上有一無位真人常在汝諸人面門出入未證據者看看時有僧出問云如何是無位真人濟下繩床搊住云道道僧擬議濟托開云無位真人是什麼乾矢橛便歸方丈師云臨濟恁麼説話大似好肉剜瘡若問南湖如何是無位真人但向他道是什麼無位真人乾矢橛且道與古人是同是別具眼者試分析看復白椎云諦觀法王法法王法如是下座冬節上堂問逢至小年節大地意氣新青山仍舊色不改舊時人如何是舊時人師拂一拂云會麼進云日出方知天下曉水流穿過院庭中師云對面底聻進云和尚證明師云證明個甚麼僧擬進語師震威一喝乃以拂召云大衆還會麼欲識佛性義當觀時節因緣時節若至其理自彰且道是個什麼時節一陽生萬物長世間多少守株人惟有趙州老子不逐十二時轉遂擲拂子喝一喝下座上堂問雪屋梅花灼灼辨的眚目不瞪衲子難謾秪如南湖一曲為誰宣師云山林瓦礫縱橫説若到常情取信難進云爭奈萬籟有心聞不得師云恪問三藏教文收不到一聲清磬廓無餘寶座高登將何所務師云朔風凜凜進云如何是直截提持一句師云汝屈不首進云曲為今時又作麼生師云不要你多事乃云達磨西來直指人心見性成佛二祖斷臂覓心了不可得馬大師云即心即佛這三個老古錐恁麼為人如釘釘木然雖如是未免承言者喪滯句者迷驀拈拄杖卓一卓云阿呵呵庭前柏樹子菩提薩婆訶臘八初祖開光上堂拈拄杖卓一卓云大衆還知麼今日乃雪山老子睹明星悟道成等正覺之日謂一切衆生具有如來智慧德相皆因妄想執著而不能證得者老漢何似開眼説夢衆中且道迦文未睹明星時還具眼也無復卓拄杖云且喜達磨祖師向拄杖頭上豁開眼光爍破四天下去也亦謂現前大衆具有如來智慧德相皆因將心待悟所以不能證得證與不證且止衆中還識祖師西來意麼聽取一頌昔睹明星今見大雪星雪光交輝乾坤都照徹祖師西來意早已言漏泄便下座是日上堂時忽大雪新春日諸山禪碩請上堂問煙鎖龍樓玉磬浮半岩殘雪占春眸梅含嫩蕊拈新句臘盡春回百草頭如何是臘盡春回的句師云柳眼舒窺天地闊春聲啼徹歲寒心進云與麼則萬木沾恩梅吐白殿角風生翠竹呈師云隨境漂流漢進云學人只如是和尚又作麼生師打云這一棒合該你喫問請問和尚天下何以為二同師云普進云動容揚古路不墮悄然機師云拶乃云臘盡春來草木咸知窮底事冰消凍解狐蹤斷迹見流長一任乾坤新日月看看原只舊時人諸仁者還識舊時人麼若識舊時人且説舊時話昔世尊説法華時有七寶塔從地湧出住在空中於是釋迦牟尼佛以右指開七寶塔戶出大音聲如卻關鑰開大城門即時一切衆會皆見多寶如來於寶塔中坐師子座全身不散如入禪定又聞其言善哉善哉釋迦牟尼佛快説是法華經我為聽是經故而來至此今日諸山禪碩亦非從地涌出亦非住在空中於彈指頃會集現前驀拈起拄杖云衆中還知這個端的麼復卓一卓云祖師心印狀似鐵牛之機説什麼釋迦多寶拈來總與一串穿卻何故惟此一事實餘二則非真便下座上堂問三通鼓罷簇簇上來佛法人事一時周畢秪如尼慧溫禪師云拄杖子不在手苕帚柄聊與三十且道過在什麼處師打云賞罰分明進云犀因玩月文生角象被雷驚花入牙師云又被風吹別調中僧推香几云老漢是何心行師打云也須喫棒乃云看看正月初四各各眉橫鼻豎笙歌拶碎須彌聲色打翻酒具佛殿倒騎山門鳥語惺惺分付且道分付個什麼我見人見衆生見壽者見個事分明本成現既是本成現為什又有我人衆生壽者見喝一喝云即此見聞非見聞實無聲色可呈君卓拄杖下座上堂問枝頭梅笑露全提兩岸依依緑柳舒啼鳥一聲春漏泄請師拈出祖師機師云春風滿大地進云恁麼則清風敲竹韻紅日綴花梢師云何處不風光進云南湖波浪從今息大家齊唱太平歌師云更有事在問不待桃紅并柳緑佳音早已遍皇都萬象回春即且置劫前一段請宣敷師云鴛鴦飛入金針裏繡出雙雙上碧天進云空王殿上泥牛吼碧玉盤中木馬嘶師云作麼生是木馬嘶的意旨僧喝師云再喝喝看進云不勞再勘師云又與麼去也乃云聞聲悟道見色明心雲門大師雖能耳裏著楔眼裏挑筋只是不會祖師西來意且道祖師西來意作麼生會喝一喝下座豁然維那請上堂問拈出少林無孔笛等間吹出大家知且道誰是知音師云囫圇吞吐三千界進云知音不在頻頻舉達者須教暗裡驚師云倒卓須彌任意行進云恁麼熊耳山前金鳳舞如菴堂上玉雞啼師云誰是知音僧喝師便打乃拈起拄杖云南湖拄杖子𨁝跳上三十三天築著帝釋鼻孔將東海鯉魚打一棒雨似盆傾復卓一卓云仍教雲收霧卷依舊杲日當空盡十方世界若草若木若僧若俗若男若女若長若幼無不盡知盡見所以單提獨弄只貴眼親手辦正按旁提須是作者方知幾許言前取證那容句外明機還他過量人始行過量事且道作麼生是過量事良久云雲有出山勢水無投澗聲元宵解制董耀庭姚公掄二居士領衆請上堂問結制解制即不問如何是和尚為人處師便棒進云還有不費婆心者麼師云現成受用進云恁麼則家家有路透長安師云腳跟下一句作麼生道僧便喝師云合取狗口乃云去年十月十五日諸方盡起模畫樣謂之結制今年正月十五日處處瓦解冰消謂之解制結時將眼耳鼻舌身意縛作一團拋入大冶紅爐朝鍛暮煉煉得冰消瓦解及至解時把八萬四千毛孔等間撒開一時放光現瑞天雨四花地搖六震鳥語風聲齊音演唱五根五力七菩提分八聖道分令見者聞者聽者受者喜者怒者各各踴躍歡喜曠劫無明當下灰空頓教一肩擔荷直入千峰萬峰眼徹四大海腳踢五須彌十字街頭縱橫無礙笙歌叢裡任意優遊且道不動腳跟一句又作麼生遂卓拄杖云舉頭天外看誰是我般人便下座上堂情生智隔念別差殊所以動靜乖張間忙得失而不能澄清絶點是故道不屬知知乃衆禍之門心必由悟悟乃迷源之本知本無方道從何立喝一喝便下座上堂豎起拂云山僧拂子頭上放大寶光演説無量妙義為汝諸人一音證據了也復揮一揮云假爾再運神通鼓陳卒風暴雨一時大地平沉虛空粉碎正恁麼時作麼生回避得去看看各自眉毛還在眼上麼良久云不是久經風浪者難將大海作家鄉卓拄杖下座觀察黃公百日之辰孝子復仲請對靈升座僧問向上全提當陽剖露即今薦親一句請師酬唱師云大衆證明進云恁麼則覿體迥超生死外人間天上任逍遙師云且道黃老居士在什麼處進云森羅萬象齊稽首師云森羅萬象且置畢竟黃老居士面目在什麼處僧呈坐具云有意氣時添意氣不風流處也風流師云切莫隨他轉乃卓拄杖喝一喝云大衆還會麼昔日釋迦老子離兜率降皇宮出母胎説法度人即此一喝秪如我護法暗齋黃老居士出母胎離襁褓身長力大知言識禮學儒學佛至於位及天垣言政諫給勒回風行八閩掉臂聲頌匡廬挂冠林下穩坐七十餘年名不易節金湯無倦亦知即此一喝也又喝一喝云這一喝昔我天童密雲師翁曾在太白峰頭招手居士向長水岸畔點頭幸我師翁拽杖乘風一葉拋泊於此與老居士把手同行入理深談舉個話頭令參句萬法歸一一歸何處雖然與麼聞此一喝頓放八識田中亦沒交涉又喝云者一喝即我現住荊溪龍池山本師和尚與老居士道契三十餘年始於桐月菴中説家裏話後向曹山頂上起模畫樣拽動四海衲子一段瞻光有賴然我本師訊別一棹禹門院裡掀翻祖翁窠窟耕熟現前田地雖千里同風猶未休道義之交故於己丑春駕沒底船泛桃花浪得得到此欲與老居士重結般若緣雖則面面相看眼眼相覷爭奈未與親口道破這一喝在又喝云此一喝自山僧到滮湖以來三經寒暑數次往還常與促膝相談或熱言冷語或倒腹傾腸惟商此一喝更不談餘又謂自幼究心於此事恨未得㘞地一聲是為苦耳山僧有個末後句子正欲叮嚀不料居士恁麼趁快撩起便行倏忽百日竟辰令公子抱孝踴泣難報慈誨之恩命山僧升此座特為老居士指個安樂法門若也如斯會得即此一喝三喝四喝八百千萬億喝亦不離此一喝即此一喝分身百億遍布十方塵説剎説無邊説亦不曾説著一字如斯方始會得一喝不作一喝用驀拈拄杖云衆中還見麼且喜黃老居士來也卻在山僧拄杖頭上踴躍騰空揚聲大叫云南湖長老不合恁麼鼓唇饒舌將老夫生平事業一一盡情狼籍致使老夫胸中瓦解冰消端居毗盧頂上優遊自在遽喝云適才黃老居士恁麼直下承當卻被山僧一喝默爾杜口結舌且道山僧與麼覿面相呈為復是神通妙用為復是法爾如然現前大衆還知黃老居士安身立命處麼即此身心現塵剎歸元何處不風流卓拄杖下座住都門西瓦廠普濟禪院語録師於順治十四年三月二十四日受院主覺幻純公暨衆護法宰官居士等恭請結制開堂師至法座前云瞻之在前七縱八橫仰之彌高頭正尾正黧奴白牯掀眉須彌燈王眨眼不須眉毛挂劍早已血濺梵天且道新普濟如何施設喝一喝遂升座拈香云此一瓣香根歷磐石葉覆千秋伏惟當今皇帝聖躬萬歲萬萬歲次拈香云此一瓣香位列天星名標帝極奉為滿朝文武概國公卿并及現前護法宰官居士等伏願股肱帝祚恆新永作法門墻塹又拈香云此一瓣香把手牽人難行惟人自肯方親常言道冤有頭債有主今日人天衆前共證酬償此乃第二回拈出奉供現住江南常州府宜興縣龍池山禹門堂上傳曹溪正脈第三十五世本師萬如微和尚用酬法乳之恩乃就座上首白槌云法筵龍象衆當觀第一義師豎拂云不打鬧市門前鼓單提獨弄截流機衆中還有句下知宗言前取快者麼僧問濟宗爐韝盛京重開四海英靈咸集此會和尚且如何鍛煉師打云一棒一條痕進云莫便是和尚為人處麼師云闍黎還薦取麼進云頂門具眼方堪曉耀古騰今達者知師便喝進云萬鍛爐中鐵蒺藜佛祖當塗不讓伊師云好個消息僧禮退問法幢初豎選佛場開四衆瞻仰未審説何法要師云杲日當空進云四壁盈虛關不住滿堂盡是法雲飛師云眼橫鼻塞僧喝師云者一喝是何意旨進云除卻萬年天子貴秪有當朝宰相尊師云也須照顧自己僧禮退問古德云欲行千里一步為初如何是最初一步師踏足云會麼進云如何是向上一著師卓拄杖進云如何是末後一句師云劄進云恁麼則天上有星皆拱北海內無針不指南師云且道腳跟下一句又作麼生僧便喝師云好一喝士問弟子打鼓和尚上堂且道有拄杖也無師云汝不識痛癢進云如何是聲前末後句師云今朝三月二十四進云如何是賓中主師云不答你進云如何是主中賓師云禮拜著進云如何是主中主師便喝進云如何是賓中賓師云門外漢進云如何是和尚真正佛法師云汝不是其人士便喝師云者一喝落在甚麼處士噓一噓師云弄精魂漢師乃卓拄杖云若便恁麼擔當已是落二落三更要第二杓惡水所以道本無言因言顯道故爾言言見諦句句歸宗如若倚他門戶隨語生解情存境觸頭出頭沒輪回生死作麼生得自由自在去所以古人參叩師承有據眼目清正見識穩密堪作人天模範而入門便棒便喝正要你心光發焰性海揚波智天麗日如幽谷無聲遂至斯響洪鐘虡受叩無不應方乃頭頭得妙處處全彰豈可以一言而語其優劣者哉若不如斯縱使諸子百家熟背三乘十二分教精通千七百則葛藤橫嚼豎咬忽遇著個本色作家不消拄杖子一撥便乃渾身汗下眼目定動要個字腳也摸索不著可見眼見耳聞的到者裡總用不得畢竟作麼生復卓拄杖云惟此一事實餘二則非真謝詞不録復舉僧問南院日月交謝寒暑迭遷如何是不涉寒暑者院云紫羅抹額繡裙腰僧云向上之機今已曉中下之流如何解會院云炭庫裡藏身師云南院是個作家善辨來機者僧未免就地活埋然雖如是南院猶未會末後句在今日有問普濟日月交謝寒暑迭遷如何是不涉寒暑者向他道歷歷分明院云紫羅抹額繡裙腰師云春花鋪地錦迷悟許多人又謂向上之機今已曉中下之流如何解會師云欠少個什麼院云炭庫裡藏身師云太煞分明大衆山僧與麼批判還有道得末後句的麼如無普濟自道去也喝一喝下座孔雀佛大悲準提菩薩開光上堂問請問和尚這三個老古錐未入紅爐已前畢竟喚作什麼師云蚤已安名了也進云畢竟如何師云孔雀明王進云簷前瑞氣騰霄漢歷歷分明作者知師云爭奈旁觀者親問大悲菩薩現千手眼覆被群生秪如今日所點者是那一隻眼師云瞎進云若是這一隻眼昔本不閉今亦不開用點作麼師云照天照地進云恁麼則當陽點出摩醯眼劈破根塵及第空師云照顧眉毛問刻雕衆像須憑良匠之工秪如斤斧未運時大悲手眼在什麼處師云從來不借他人力進云本色現成乞師點眼師云點眼了也進云我見燈明佛本光瑞如此便禮拜師云猶是第二頭事乃以拄杖指像云你看者三個沒量大人各各具大人相一時現形變相三頭六臂手擎日月鑑天鑑地乃至張弓架箭揮智慧刃佩符印輪具摩醯眼擎山執杵入佛入魔無論貧富貴賤羅剎鬼國遂求即應雖各具無量威德自在神變終不免山僧拄杖子為伊點出佛眼法眼慧眼天眼肉眼一時共見十方世界森羅萬象至於草木叢林立地成佛去也諸仁者須信自性立地成佛切莫向外馳求汝若起一念向外馳求心即一棒打折你驢腰上堂師云末後拈花迦葉打失鼻孔九年面壁神光失卻眉毛者一隊老古錐雖與東西為則仔細檢點將來兩個五百共成一串直至而今分疏不下衆中莫有分疏得者麼如無普濟更與分疏去也東勝神洲與西牛賀洲斫額南贍部洲撫掌呵呵大笑北俱盧洲捶胸助哀何故正所謂喜怒哀樂之未發發而皆中節且道是中何節聻今朝四月初五一時敲鐘擊鼓及至雲集向前佛法一些沒有既無一些子佛法汝諸人眼見耳聞的又作麼生咄浴佛日放生上堂問世尊初生分手一指且道明甚麼邊事師云眉毛上見數進云末後拈花與最初一指是同是別師云也須領略進云佛真法身猶若虛空和尚今日作麼生浴師云橫按莫邪全正令進云恁麼則水底有天藏世界無邊風月挂長空去也師云也須喫棒問未離兜率已降皇宮未出母胎説法已竟因甚猶用者一杓惡水師云亦是自取進云秪如雲門一棒打殺餧卻狗子又作麼生師云奈汝不知痛癢進云和尚還識痛癢麼師云汝不是其人進云和尚也須三十棒師云且道山僧過在甚麼處僧喝師云汝卻不知問昔本不生今亦不滅既是不生不滅為甚又有降誕之辰師云頭正尾正進云垂絲千尺鉤還曲利物應知語帶悲師云汝還知麼僧擬進語師云卻較些子進云自有一雙窮相手不妨隨處舞三臺師云點即不到乃云還有問話者麼直饒問得海水騰波虛空粉碎要與衲僧分上毫沒交涉衆中還知麼今日有個沒面目漢從空降下脫體風流赤條條地金盆捧足九龍吐沐指天指地獨稱其尊目顧周行去也非但大地瞻光乃至情與無情水陸空行咸沾恩化為甚雲門又要一棒打殺貴圖天下太平所以為人須為徹殺人須見血普濟今日路見不平要與雲門討個斷決莫有拔劍相助者麼普濟恁麼是為人是不為人若分別得出許你親見雲門釋迦若分別不出且喫普濟三十棒一棒也不較多良久云莫將間學解埋沒祖師心上堂問祖幟高標於普濟法幢大建於金臺即今七衆齊臨未審示何三昧師打云令不虛行進云棒頭傾出千秋月獨照乾坤萬古明師云普天風月人猶在進云滔滔一派滹沱水直到都門湧雪濤師云也須打濕袈裟角問文殊是七佛之師為甚出女子定不得師云疑殺人進云罔明乃下方菩薩為何出得女子定師云卻較些子進云女子入定明甚麼邊事師云眼睛壁立直進云世尊坐觀成敗意旨如何師云牙齒一具骨進云謝師答話師云也須薦取始得乃云今朝四月十五諸人切莫莽鹵普濟院裏打鼓撞鐘正陽門外揚塵簸土忽然撞著李鬍子驀面一唾云元來是你你若起一念俗見僧見法見佛見閻羅王即來取你性命去也你若不起一毫俗見僧見法見佛見閻羅王亦來取你性命畢竟如何聻無風荷葉動必定有魚行復舉盤山寶積禪師一日因市肆行見客買豬肉曰將精底割一斤來屠家放下刀叉手曰長史那一塊不是精底寶積當下大悟所以大丈夫漢聞恁般話便乃發露本地風光如從萬丈深坑跳出一肩擔荷去也現前莫有更較寶積一籌者麼嗄相逢盡道休官好林下何曾見一人便下座上堂士問不與萬法為侶者是什麼人師云十字街頭眼卓朔進云弟子則不然師云你又作麼生進云手長衫袖短師打云果然問但有言説都無實義默然杜口亦非真諦去此二途請師直指師云普濟菴前剎竿子進云恁麼則言句了也師云草木不借春風力到處花香盡可知進云可謂拂子頭邊施雨露草木瓦礫盡翻身去也師云也須識自始得士問夏景連天熱鮮花遍地開花開花卸請問和尚卸在什麼處師云眼裏緇素泥人墮淚士云四大分張又作麼生師云四大分張猶是外頭事如何是你家裏事士云兩頭掐斷師云中間又作麼生士喝師打云卻原不知乃云昔日大慧禪師因見老宿上堂云我在老師會中得個末後句不免布施大衆良久云不與萬法為侶者是甚麼人待汝一口吸盡西江水即向汝道便下座大慧云山僧即不然我在老師會中得個末後句不免舉似大衆便下座師云大衆還知大慧老宿末後句麼直饒二老一鼻孔出氣要且同條生不同條死普濟則又不然我在江南老師會中得個末後句一時拋向正陽門外去也待五鳳樓點頭即向你道便下座上堂問夜來風雨聲花落知多少請問和尚畢竟是多少師云紅塵堆裏撒珍珠進云恁麼則雪山片片藏蹤迹師云依舊天晴日頭出雨落階前濕忽雨復晴進云杲日當空曜古今師云為甚卻有一點照不著問昔日興化打擯維那未審過在什麼處師云更與你一頓進云恁麼罰錢五貫則已因甚又擯出院師云賞罰分明進云智過於師方堪傳受秪如克賓還識興化也無師云官不容針進云和尚今日法戰不勝罰知藏師辦齋一供師打云維那也須喫棒進云果然賞罰分明師云靜悄悄地乃云若人識得心大地無寸土還有識得心的麼獅子決定咬人韓盧始終逐塊須是家裏人始説家裏話南泉牧一頭水牯牛擬向溪東牧不免犯人苗稼擬向溪西牧亦不免犯人苗稼不免隨分納些些總不見得普濟者裡瞎驢群隊一任東踏西踏也無苗稼可犯且喜水足草足一個個飽齁齁地切忌瞌睡汝若瞌睡閻羅王即將木瓜換卻汝心黑豆換卻汝眼牛頭阿傍將利刃換卻汝舌縫卻汝口塞卻汝鼻管教你有口開不得有氣吐不得有眼見不得有心用不得到此田地作麼生得直下脫略去普濟更與矢上加尖喝一喝下座京衛經歷司童上甫母難日請上堂問若知天命處處盡成無量壽將通耳順聲聲皆是古彌陀此是童君原具足因齋慶讚又如何師云一點也謾你不得進云恁麼則柱石千年朝帝闕金湯萬古法王城師云家家有路透長安乃云若論佛法二字直得嘴挂壁上無言可説無理可伸所以妙性圓明離諸名相今日因齋慶讚不免旁通一線豎起拂子云還見麼喝一喝云還聞麼見乃親見聞乃親聞既爾聞見分明更少欠個什麼來咄即此見聞非見聞實無聲色可呈君君不見南山雨濕松蒼翠北海波添歲更長是日直雨上堂問教中道諸可還者自然非汝不汝還者非汝而誰不知汝是什麼師云棋盤街口下馬牌進云祖家又道釋迦彌勒猶是他奴且道他又是誰師云犯禁者斬進云祖義教義是同是別師云從來沒有這些子進云必竟水須朝海去到頭雲定覓山歸師打云放過則不可乃拈起拄杖云諸仁者還會麼復卓一卓云心不是佛智不是道拄杖子𨁝跳上三十三天觸著帝釋鼻孔打箇噴嚏落在汝諸人眉毛上廝結儘力抖擻不下直饒抖擻得下未免明人面前三尺暗切忌仔細復云昔僧問趙州云萬法歸一一歸何處州云我在青州做領布衫重七斤師云趙州恁麼貼體為人可憐者僧沒處著到今日有問普濟萬法歸一一歸何處即向他道我在都門做領葛布道袍重三斤四兩且道與趙州是同是別若道是同爭奈寒暑何若道是別又爭奈寒暑何山僧與麼亦不壓良為賤此話三十年後自有識得輕重者在汝等更向者裏討什麼斤兩以拄杖趁散大衆歸方丈上堂師云淨裸裸赤灑灑絶遮攔沒可把普濟安居月餘日來未審所求何事若教他立地成佛去不免自生退屈只得朝打三千暮打八百管取頭徹尾徹徹不徹那怕甕中走卻鱉一款招承了也且道是何罪結逢人但恁麼舉普濟有此説沒此説雲門乾矢橛喝一喝下座端午節上堂問五月五日天中節赤口百舌咸消滅當陽不必挂靈符直截根源請師説師云誰思屈子意千古動悲風進云恁麼則大家相看鬥龍舟去也師云莫眼花乃云家家門前艾旗高挂蒲劍揮空魑魅魍魎掃蹤滅迹間神野鬼何處窺張雄黃酒到處噴灑敕令符挨門排帖城市兒童點額村坊父老歡杯秪如汨羅江上楚水連天龍舟鬥彩角黍投漩又作麼生雖然事因人設時逢節慶爭奈當年於此日招魂千古慟悲風且道衲僧門下如何慶感不免也歌一曲平平仄仄仄平平仄仄平平兩樣聲若問西來佛祖意三千里外沒途程沒途程可憐生君不見九年面壁兮單丁五葉花開兮令行雨落地濕日出天晴且道是甚時節樂歆歆兮依前日午打三更上堂師舉經云若以色見我以音聲求我是人行邪道不能見如來師云若乃離名離相業識茫茫無本可據其或就事就理如蠶作繭自纏自縛即心即佛亦是認賊為子非心非佛何似捏目成花馬大師是何心行普濟一味應病與藥豈肯為蛇添足秪如古人道東司頭不得與你説佛法既東司頭不得説佛法莫是法堂前説得麼若總作恁般見解三生六十劫也未夢見祖師西來意在遂攛下拄杖展手云我手何似佛手便下座上堂是日大雨樂修法師問龍池興法雨滂沱潤燕山古曲無音調請師為重宣師云拍拍是令進云秪如洞上宗風如何是正倒時便起師云切忌向功勳邊坐殺云如何是正起時便倒師云棒頭指處血濺梵天云如何是起倒同時師云瞎如何是起倒不立師云大衆俱在現前進云四句已蒙師指示不涉起倒時如何師云禮拜著進云更有應時為人一句請師直指師云風雲為爾通消息進云恁麼則不風流處也風流師云也須照顧自己乃云過量人自爾異目超宗白拈賊慣便就窠打劫衲僧家果有如斯手段不妨竿木隨身逢場作戲乘機接物驅耕奪食亦不為分外豈不見高峰大師在三塔悟得個百年三萬六千朝返覆元來是這漢便打脫個拖死尸底句子以為一場歡喜及見雪巖欽一日問云日間浩浩還作得主麼云作得主又問睡夢中作得主麼云作得主又問正睡著時無夢無想無見無聞主在什麼處高峰大師被此一問只得無理可伸無言可對所以古人虛心不肯自欺若是今時之流不是擎拳便是豎指一時勉強支捂過去如此等輩實可憐愍故爾欽云從今日去也不要汝學佛學法也不要汝窮古窮今但只飢來喫飯困來打眠才眠覺來卻抖擻精神我這一覺主人公畢竟在什麼處安身立命你看高峰大師將這個疑團子安在胸中五年吞吐不下一日被同宿推枕子墮地廓然大悟方知是個到家時節始信從上為人言不謬發豈效認光影門頭而為印可者哉大衆且道高峰大師悟個什麼來噦云紅爐豈是間施設要煉真精不變金柯總督夫人請上堂師乃卓拄杖云拄杖子為汝諸人説佛法去也諸人還信得及麼若信得及直下一念知歸十方世界消殞淨體圓明真常獨露曠劫無明煩惱即是真如佛性情見習氣亦是遊戲三昧始信聖凡不二含靈一家山河大地草木叢林都歸自己又有什麼僧俗男女之見所以經云若能轉物即同如來且道現前之物又作麼生轉直饒轉得也只得一半秪如那一半又作麼生不妨更與道破喝一喝下座上堂師云須菩提解空第一生時家室盡空世尊才升座須菩提便出衆云希有世尊大慧杲禪師云見個什麼道理便恁麼道天親菩薩作無量偈只贊希有二字圓悟禪師云一句是一個鐵橛故六祖聞應無所住而生其心便悟去師云現前衆中且道六祖悟個甚麼若知六祖悟處便不辜負自己若不辜負自己便乃直截根源一刀兩斷直教勦絶去實無一法可當情更説什麼應無所住而生其心遂卓拄杖云知音不在千鍾酒一盞清茶也醉人上堂師云勦絶一句子不辭向汝諸人道去也良久云還會麼三乘十二分教一時應病與藥千七百則公案亦是披枷帶鎖若是個大丈夫漢瞥爾見徹根源藥病俱除枷鎖頓釋向二六時中灑灑落落遇境安排有甚麼的的確確見眼是色聞耳是聲聲色堆頭祖師心祖師心且置作麼生是汝諸人自己底心殺人者知罪旁觀者喫驚解制上堂問根塵同元縛脫無二教中既無縛脫禪門何有結解師云不向他家路縱橫任去來進云秪如解開布袋頭放出一群牛請和尚放出牛看師云照顧腳下進云忽遇著踞地獅子向什麼處躲避師云遍界絶蹤迹進云恁麼則喪身失命了也師云果然乃云普濟院九十六日安居已竟不曾動著諸人一些及至驀地一拶粉碎向二六時中屙屎放尿穿衣喫飯行住坐臥觸著磕著又作麼生回避若回避得許你十字街頭縱橫無礙淫坊酒肆任意逍遙如若未然切忌仔細他日閻老子前莫謂山僧不道喝一喝下座如如開鐘板附師云雲從龍風從虎馬祖僧堂百丈規矩不落聲聞大丈夫遵循號令歷今古遂擊板如如齋單引附銅頭鐵額不問廬陵米價水足草足休提趙州公案木札羹和盤掇出鐵屑飯一任吞吐雖然如是南湖不做這般去就要使應供高流人人腳跟點地飽參上士個個鼻孔撩天普濟挂鐘板師云少室單丁遍地兒孫出馬駒大雄號令典型千古振宗風秪如舊店重開又作麼生遂挂板云一番提起一番新復擊板云隨伊喫飯穿衣去眼裏聞聲處處真普濟齋單普濟院裡赤手空拳不問如何若何一個個眉毛廝結要與黑面老子討個越生出死的路頭恰遇著山僧劈脊一棒直教瓦解冰消雖然如是也要灶裡明生鉢盂口濕
